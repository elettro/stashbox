<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Redirecting to Stashbox Radio Offline</title>
  <link rel="canonical" href="https://stashbox.com/radio/offline/">
  <meta http-equiv="refresh" content="0; url=https://stashbox.com/radio/offline/">
  <script>
    (function () {
      var target = 'https://stashbox.com/radio/offline/' + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="https://stashbox.com/radio/offline/">Stashbox Radio Offline</a>…</p>
</body>
</html>
