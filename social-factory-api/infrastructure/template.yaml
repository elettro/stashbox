AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Isolated Stashbox Social Factory DEV API with YouTube OAuth, unlisted publishing, protected Video Factory orchestration, Content Review, and scheduled queue publishing.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
  AllowedOrigin:
    Type: String
    Default: https://stashbox.com

Resources:
  SocialFactoryHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: stashbox-social-api-dev
      StageName: dev
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - Content-Type
          - Authorization
          - x-admin-token
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 600

  YoutubeOAuthConfigSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: stashbox/social-factory/dev/youtube-oauth/config
      Description: Google OAuth client configuration for Stashbox Social Factory DEV.
      GenerateSecretString:
        SecretStringTemplate: >-
          {"client_id":"REPLACE_GOOGLE_CLIENT_ID","client_secret":"REPLACE_GOOGLE_CLIENT_SECRET","success_redirect_uri":"https://stashbox.com"}
        GenerateStringKey: admin_token
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: stashbox-social-factory
        - Key: Environment
          Value: dev
        - Key: Purpose
          Value: youtube-oauth-config

  YoutubeOAuthTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: stashbox/social-factory/dev/youtube-oauth/tokens
      Description: YouTube OAuth refresh token and channel metadata for Stashbox Social Factory DEV.
      SecretString: '{}'
      Tags:
        - Key: Application
          Value: stashbox-social-factory
        - Key: Environment
          Value: dev
        - Key: Purpose
          Value: youtube-oauth-tokens

  CustomGptCredentialSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: stashbox/social-factory/dev/custom-gpt
      Description: Dedicated revocable credential for the private Stashbox Radio Custom GPT in DEV.
      GenerateSecretString:
        SecretStringTemplate: >-
          {"actor_id":"stashbox-radio-gpt","enabled":true,"permissions":["songs:read","campaigns:plan","campaigns:create_drafts","renders:read","renders:create_drafts","renders:launch","review:read","review:write","review:decide","review:stage","schedule:create","schedule:cancel","youtube:read","youtube:publish"]}
        GenerateStringKey: api_key
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: stashbox-social-factory
        - Key: Environment
          Value: dev
        - Key: Purpose
          Value: custom-gpt-credential

  SocialPublishBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub stashbox-social-publish-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - !Ref AllowedOrigin
            ExposedHeaders:
              - ETag
            MaxAge: 900
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSocialPublishStaging
            Status: Enabled
            Prefix: incoming/
            ExpirationInDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Application
          Value: stashbox-social-factory
        - Key: Environment
          Value: dev
        - Key: Purpose
          Value: youtube-publish-staging

  SocialPublishScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: stashbox-social-publish-dev
      Tags:
        - Key: Application
          Value: stashbox-social-factory
        - Key: Environment
          Value: dev

  SocialPublishScheduleDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: stashbox-social-publish-dev-dlq.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Application
          Value: stashbox-social-factory
        - Key: Environment
          Value: dev
        - Key: Purpose
          Value: scheduled-publish-dead-letter

  SocialPublishScheduleQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: stashbox-social-publish-dev.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 960
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SocialPublishScheduleDeadLetterQueue.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Application
          Value: stashbox-social-factory
        - Key: Environment
          Value: dev
        - Key: Purpose
          Value: scheduled-publish-queue

  SocialPublishSchedulerTargetRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: stashbox-social-scheduler-target-dev-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - scheduler.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: SendScheduledPublishMessages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt SocialPublishScheduleQueue.Arn

  SocialApiDevRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: stashbox-social-api-dev-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: SocialApiDevLogsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
        - PolicyName: SocialApiDevYoutubeOAuthSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadYoutubeOAuthSecrets
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref YoutubeOAuthConfigSecret
                  - !Ref YoutubeOAuthTokenSecret
                  - !Ref CustomGptCredentialSecret
              - Sid: WriteYoutubeOAuthTokenSecret
                Effect: Allow
                Action:
                  - secretsmanager:PutSecretValue
                Resource: !Ref YoutubeOAuthTokenSecret
        - PolicyName: SocialApiDevPublishStaging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadWriteIncomingVideos
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${SocialPublishBucket.Arn}/incoming/*
              - Sid: ReadWriteReviewDrafts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${SocialPublishBucket.Arn}/drafts/*
              - Sid: ListReviewDrafts
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt SocialPublishBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - drafts/*
              - Sid: ReadVideoFactoryRenderOutputs
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::stashbox-radio-video-factory-dev-${AWS::AccountId}-${AWS::Region}/video-factory/*
        - PolicyName: SocialApiDevScheduling
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageSocialPublishSchedules
                Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:GetSchedule
                Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${SocialPublishScheduleGroup}/social-review-*
              - Sid: PassSchedulerTargetRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt SocialPublishSchedulerTargetRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com
              - Sid: QueueImmediateYoutubePublish
                Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt SocialPublishScheduleQueue.Arn

  SocialScheduledPublishWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: stashbox-social-publish-worker-dev-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: SocialPublishWorkerLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
        - PolicyName: SocialPublishWorkerSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadYoutubeOAuthSecrets
                Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref YoutubeOAuthConfigSecret
                  - !Ref YoutubeOAuthTokenSecret
              - Sid: WriteYoutubeOAuthTokenSecret
                Effect: Allow
                Action:
                  - secretsmanager:PutSecretValue
                Resource: !Ref YoutubeOAuthTokenSecret
        - PolicyName: SocialPublishWorkerStorage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadIncomingVideos
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub ${SocialPublishBucket.Arn}/incoming/*
              - Sid: ReadWriteReviewDrafts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${SocialPublishBucket.Arn}/drafts/*
        - PolicyName: SocialPublishWorkerQueue
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt SocialPublishScheduleQueue.Arn

  SocialApiDevFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: stashbox-social-api-dev
      Description: Isolated Stashbox Social Factory DEV API.
      CodeUri: ../
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 900
      Role: !GetAtt SocialApiDevRole.Arn
      Environment:
        Variables:
          APP_ENV: !Ref EnvironmentName
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          YOUTUBE_OAUTH_CONFIG_SECRET: !Ref YoutubeOAuthConfigSecret
          YOUTUBE_OAUTH_TOKEN_SECRET: !Ref YoutubeOAuthTokenSecret
          SOCIAL_CUSTOM_GPT_SECRET: !Ref CustomGptCredentialSecret
          SOCIAL_PUBLISH_BUCKET: !Ref SocialPublishBucket
          VIDEO_FACTORY_SOURCE_BUCKET: !Sub stashbox-radio-video-factory-dev-${AWS::AccountId}-${AWS::Region}
          SOCIAL_SCHEDULE_GROUP: !Ref SocialPublishScheduleGroup
          SOCIAL_SCHEDULE_QUEUE_ARN: !GetAtt SocialPublishScheduleQueue.Arn
          SOCIAL_SCHEDULE_QUEUE_URL: !Ref SocialPublishScheduleQueue
          SOCIAL_SCHEDULER_ROLE_ARN: !GetAtt SocialPublishSchedulerTargetRole.Arn
          SOCIAL_MAX_UPLOAD_BYTES: '536870912'
          SOCIAL_MAX_DIRECT_PUBLISH_BYTES: '26214400'
          SOCIAL_PUBLISH_TIME_ZONE: America/New_York
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/health
            Method: GET
        YoutubeOAuthStart:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/youtube/oauth/start
            Method: GET
        YoutubeOAuthCallback:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/youtube/oauth/callback
            Method: GET
        YoutubeStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/youtube/status
            Method: GET
        YoutubeDisconnect:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/youtube/disconnect
            Method: POST
        SocialUploadPresign:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/uploads/presign
            Method: POST
        YoutubePublish:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/youtube/publish
            Method: POST
        TopSongAnalytics:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/analytics/top-songs
            Method: GET
        OrchestrationCandidates:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/orchestration/candidates
            Method: GET
        OrchestrationBatchPlan:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/orchestration/batch-plan
            Method: POST
        OrchestrationBatchDrafts:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/orchestration/batch-drafts
            Method: POST
        OrchestrationBatchJobs:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/orchestration/batch-jobs
            Method: GET
        OrchestrationBatchLaunch:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/orchestration/batch-launch
            Method: POST
        OrchestrationBatchStage:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/orchestration/batch-stage
            Method: POST
        OrchestrationRenderJobsGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/orchestration/render-jobs
            Method: GET
        OrchestrationRenderJobsCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/orchestration/render-jobs
            Method: POST
        OrchestrationRenderJobGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/orchestration/render-jobs/{jobId}
            Method: GET
        OrchestrationRenderJobLaunch:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/orchestration/render-jobs/{jobId}/launch
            Method: POST
        OrchestrationRenderJobStage:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/orchestration/render-jobs/{jobId}/stage
            Method: POST
        ReviewItemsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/review-items
            Method: GET
        ReviewItemGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/review-items/{reviewId}
            Method: GET
        ReviewItemPreview:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/review-items/{reviewId}/preview
            Method: POST
        ReviewItemSave:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/review-items/{reviewId}/save
            Method: POST
        ReviewItemDecision:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/review-items/{reviewId}/decision
            Method: POST
        ReviewItemPublish:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/review-items/{reviewId}/publish
            Method: POST
        ReviewItemsBatchSchedule:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/review-items/batch-schedule
            Method: POST
        ReviewItemSchedule:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/review-items/{reviewId}/schedule
            Method: POST
        ReviewItemScheduleCancel:
          Type: HttpApi
          Properties:
            ApiId: !Ref SocialFactoryHttpApi
            Path: /social/review-items/{reviewId}/schedule/cancel
            Method: POST

  SocialScheduledPublishWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: stashbox-social-publish-worker-dev
      Description: Isolated Social Factory SQS worker for approved scheduled YouTube uploads.
      CodeUri: ../
      Handler: scheduled-publish-worker.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 900
      Role: !GetAtt SocialScheduledPublishWorkerRole.Arn
      Environment:
        Variables:
          APP_ENV: !Ref EnvironmentName
          YOUTUBE_OAUTH_CONFIG_SECRET: !Ref YoutubeOAuthConfigSecret
          YOUTUBE_OAUTH_TOKEN_SECRET: !Ref YoutubeOAuthTokenSecret
          SOCIAL_PUBLISH_BUCKET: !Ref SocialPublishBucket
          SOCIAL_MAX_UPLOAD_BYTES: '536870912'
          SOCIAL_MAX_DIRECT_PUBLISH_BYTES: '536870912'
          SOCIAL_PUBLISH_TIME_ZONE: America/New_York
      Events:
        ScheduledPublishQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt SocialPublishScheduleQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  SocialApiDevLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/stashbox-social-api-dev
      RetentionInDays: 30

  SocialScheduledPublishWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /aws/lambda/stashbox-social-publish-worker-dev
      RetentionInDays: 30

Outputs:
  SocialApiDevFunctionName:
    Value: !Ref SocialApiDevFunction
  SocialApiDevUrl:
    Value: !Sub https://${SocialFactoryHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/dev/social/health
  SocialApiDevBaseUrl:
    Value: !Sub https://${SocialFactoryHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/dev
  SocialApiDevYoutubeCallbackUrl:
    Value: !Sub https://${SocialFactoryHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/dev/social/youtube/oauth/callback
  SocialApiDevExecutionRoleArn:
    Value: !GetAtt SocialApiDevRole.Arn
  SocialScheduledPublishWorkerFunctionName:
    Value: !Ref SocialScheduledPublishWorkerFunction
  SocialScheduledPublishWorkerRoleArn:
    Value: !GetAtt SocialScheduledPublishWorkerRole.Arn
  SocialPublishScheduleQueueUrl:
    Value: !Ref SocialPublishScheduleQueue
  SocialPublishScheduleQueueArn:
    Value: !GetAtt SocialPublishScheduleQueue.Arn
  SocialPublishScheduleDeadLetterQueueArn:
    Value: !GetAtt SocialPublishScheduleDeadLetterQueue.Arn
  SocialPublishScheduleGroupName:
    Value: !Ref SocialPublishScheduleGroup
  SocialPublishSchedulerTargetRoleArn:
    Value: !GetAtt SocialPublishSchedulerTargetRole.Arn
  YoutubeOAuthConfigSecretArn:
    Value: !Ref YoutubeOAuthConfigSecret
  YoutubeOAuthTokenSecretArn:
    Value: !Ref YoutubeOAuthTokenSecret
  CustomGptCredentialSecretArn:
    Value: !Ref CustomGptCredentialSecret
  SocialPublishBucketName:
    Value: !Ref SocialPublishBucket
  SocialPublishBucketArn:
    Value: !GetAtt SocialPublishBucket.Arn
