name: Rename Bug Nav to Bug Base

on:
  push:
    paths:
      - '.github/scripts/rename_bug_nav_to_bug_base.py'
      - '.github/workflows/rename-bug-nav-to-bug-base.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update shared DEV admin navigation
        run: python .github/scripts/rename_bug_nav_to_bug_base.py
      - name: Commit navigation change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio-admin/dev/shared-admin-header.js
          git diff --cached --quiet || git commit -m "Rename DEV admin bug navigation to Bug Base"
          git push
