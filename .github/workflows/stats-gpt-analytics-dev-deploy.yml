name: Stats GPT Analytics DEV Deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stats-gpt-analytics-dev-deploy.yml'
      - 'scripts/wire-top-song-analytics.py'
      - 'social-factory-api/top-song-analytics.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stashbox-social-api-dev-deployment
  cancel-in-progress: false

jobs:
  implement-test-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      AWS_REGION: us-east-1
      STACK_NAME: stashbox-social-api-dev
      REPORT_PATH: deployment-reports/top-song-analytics-dev.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: aws-actions/setup-sam@v2

      - name: Wire analytics route and GPT schema
        run: |
          set -euo pipefail
          python scripts/wire-top-song-analytics.py

      - name: Validate implementation
        working-directory: social-factory-api
        run: |
          set -euo pipefail
          npm install --omit=dev --no-audit --no-fund
          npm run check
          npm test

      - name: Commit analytics implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social-factory-api/index.mjs social-factory-api/request-auth.mjs social-factory-api/infrastructure/template.yaml custom-gpt/stashbox-radio/openapi.yaml
          if git diff --cached --quiet; then
            echo 'Analytics implementation already committed.'
          else
            git commit -m 'Expose read-only top-song analytics to Custom GPT'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy isolated DEV API
        working-directory: social-factory-api
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="stashbox-social-deploy-${ACCOUNT_ID}-us-east-1"
          ROLE=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].RoleARN' --output text)
          sam build --template-file infrastructure/template.yaml

          for ATTEMPT in 1 2 3; do
            set +e
            sam deploy \
              --stack-name "${STACK_NAME}" \
              --region "${AWS_REGION}" \
              --capabilities CAPABILITY_NAMED_IAM \
              --role-arn "$ROLE" \
              --s3-bucket "$BUCKET" \
              --s3-prefix "social-factory-api/${GITHUB_SHA}" \
              --no-confirm-changeset \
              --no-fail-on-empty-changeset \
              --parameter-overrides EnvironmentName=dev AllowedOrigin=https://stashbox.com \
              2>&1 | tee /tmp/sam-deploy.log
            DEPLOY_STATUS=${PIPESTATUS[0]}
            set -e

            if [ "$DEPLOY_STATUS" -eq 0 ]; then
              break
            fi

            if grep -q 'InvalidChangeSetStatus.*OBSOLETE' /tmp/sam-deploy.log && [ "$ATTEMPT" -lt 3 ]; then
              echo "CloudFormation change set became obsolete; waiting before retry ${ATTEMPT}/3."
              sleep 20
              continue
            fi

            exit "$DEPLOY_STATUS"
          done

      - name: Verify live analytics and reggae genre enrichment
        run: |
          set -euo pipefail
          BASE_URL=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query "Stacks[0].Outputs[?OutputKey=='SocialApiDevBaseUrl'].OutputValue" --output text)
          aws secretsmanager get-secret-value --secret-id stashbox/social-factory/dev/custom-gpt --query SecretString --output text > /tmp/gpt.json
          GPT_TOKEN=$(jq -r '.api_key' /tmp/gpt.json)

          for METRIC in likes shares; do
            URL="${BASE_URL}/social/analytics/top-songs?metric=${METRIC}&limit=5&period=all_time"
            STATUS=$(curl --silent --show-error --max-time 60 -H "x-admin-token: ${GPT_TOKEN}" -o "/tmp/${METRIC}.json" -w '%{http_code}' "$URL")
            echo "${METRIC} verification status: ${STATUS}"
            if [ "${STATUS}" != '200' ]; then
              jq 'del(.preview_url, .signed_url, .token, .api_key)' "/tmp/${METRIC}.json" 2>/dev/null || cat "/tmp/${METRIC}.json"
              exit 1
            fi
            jq -e '.ok == true and .mode == "read_only_analytics"' "/tmp/${METRIC}.json" >/dev/null
            jq -e --arg metric "${METRIC}" '.metric == $metric and (.songs | type == "array")' "/tmp/${METRIC}.json" >/dev/null
            jq -e '.mutation_performed == false and .publishing_triggered == false' "/tmp/${METRIC}.json" >/dev/null
          done

          REGGAE_URL="${BASE_URL}/social/analytics/top-songs?metric=plays&limit=5&period=all_time&genre=reggae"
          REGGAE_STATUS=$(curl --silent --show-error --max-time 60 -H "x-admin-token: ${GPT_TOKEN}" -o /tmp/reggae.json -w '%{http_code}' "$REGGAE_URL")
          echo "reggae verification status: ${REGGAE_STATUS}"
          if [ "${REGGAE_STATUS}" != '200' ]; then
            jq 'del(.preview_url, .signed_url, .token, .api_key)' /tmp/reggae.json 2>/dev/null || cat /tmp/reggae.json
            exit 1
          fi
          jq -e '.ok == true and .mode == "read_only_analytics" and .metric == "plays" and (.genre_filter | ascii_downcase) == "reggae"' /tmp/reggae.json >/dev/null
          jq -e '.count > 0 and (.songs | length) > 0' /tmp/reggae.json >/dev/null
          jq -e '[.songs[] | ((.genre // "") + " " + (.secondary_genre // "")) | ascii_downcase | contains("reggae")] | all' /tmp/reggae.json >/dev/null
          jq -e '.mutation_performed == false and .publishing_triggered == false' /tmp/reggae.json >/dev/null

          mkdir -p "$(dirname "${REPORT_PATH}")"
          jq -n \
            --arg recorded_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg commit_sha "$(git rev-parse HEAD)" \
            --arg stack_status "$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text)" \
            --argjson likes_count "$(jq '.songs | length' /tmp/likes.json)" \
            --argjson shares_count "$(jq '.songs | length' /tmp/shares.json)" \
            --argjson reggae_count "$(jq '.songs | length' /tmp/reggae.json)" \
            '{status:"success",recorded_at:$recorded_at,commit_sha:$commit_sha,stack_status:$stack_status,likes_verified:true,shares_verified:true,reggae_verified:true,likes_count:$likes_count,shares_count:$shares_count,reggae_count:$reggae_count,mutation_performed:false,publishing_triggered:false}' \
            > "${REPORT_PATH}"

      - name: Commit deployment receipt
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${REPORT_PATH}"
          git commit -m 'Record top-song analytics DEV deployment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
