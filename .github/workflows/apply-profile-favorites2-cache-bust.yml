name: Apply Profile Favorites2 Runtime Repair

on:
  push:
    paths:
      - '.github/workflows/apply-profile-favorites2-cache-bust.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load repair script in all active PROD and DEV runtimes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('radio/index.html'),
              Path('radio/desktop/index.html'),
              Path('radio/dev/v2/index.html'),
              Path('radio/dev/v2/desktop/index.html'),
          ]
          repair = '  <script src="/radio/v2-profile-favorite-sync-repair.js?v=20260824-profilefavorites2" defer></script>'
          profile_re = re.compile(r'(  <script src="[^"]*v2-profile-entry\.js\?v=[^"]+" defer></script>)')

          for path in paths:
              text = path.read_text()
              if repair not in text:
                  text, count = profile_re.subn(r'\1\n' + repair, text, count=1)
                  if count != 1:
                      raise SystemExit(f'Could not locate profile-entry loader in {path}')
              text = text.replace('profilefavorites1', 'profilefavorites2')
              text = text.replace('v2-profile-entry.js?v=20260822-profileoverlay1', 'v2-profile-entry.js?v=20260824-profilefavorites2')
              path.write_text(text)
          PY

      - name: Remove one-time workflow and commit repair
        run: |
          rm -f .github/workflows/apply-profile-favorites2-cache-bust.yml
          git config user.name "stashbox-radio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add radio/index.html radio/desktop/index.html radio/dev/v2/index.html radio/dev/v2/desktop/index.html .github/workflows/apply-profile-favorites2-cache-bust.yml
          git commit -m "Load profile favorites repair in PROD and DEV runtimes"
          git push
