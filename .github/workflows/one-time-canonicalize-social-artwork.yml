name: Canonicalize Social Artwork and Verify 9x16

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-canonicalize-social-artwork.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  canonicalize-deploy-verify:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      RADIO_API_BASE: https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev
      SOCIAL_API_BASE: https://tnrca1ff32.execute-api.us-east-1.amazonaws.com/dev
      SOCIAL_CONFIG_SECRET: stashbox/social-factory/dev/youtube-oauth/config
      REPORT_PATH: deployment-reports/dirty-bird-canonical-artwork-verification.json

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Unify legacy and canonical song artwork storage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('radio-api/song-artwork-routes.mjs')
          text = path.read_text()

          optional_anchor = "const OPTIONAL_FIELDS = Object.freeze([\n  'song_artwork_16x9_url',\n  'song_artwork_9x16_url',\n  'song_artwork_3x4_url',\n  'song_artwork_4x5_url',\n  'song_artwork_21x9_url'\n]);\n"
          constants = optional_anchor + "\nconst LEGACY_PREPARED_FIELD = 'prepared_artwork_images';\nconst PROFILE_SOURCE_PREFIX = 'song_profile_image:';\n"
          if "LEGACY_PREPARED_FIELD" not in text:
              if optional_anchor not in text:
                  raise SystemExit('Optional artwork field anchor was not found.')
              text = text.replace(optional_anchor, constants)

          old_select = "SELECT song_key, song_name, display_title, artist, song_artwork_url, public_visibility"
          new_select = "SELECT song_key, song_name, display_title, artist, song_artwork_url, visual_assets, public_visibility"
          if old_select in text:
              text = text.replace(old_select, new_select)
          elif new_select not in text:
              raise SystemExit('Song artwork SELECT anchor was not found.')

          read_anchor = """async function readOptionalArtwork(songKey, deps) {
  await ensureArtworkTable(deps);
  const result = await deps.client.query(`
    SELECT ${OPTIONAL_FIELDS.join(', ')}, updated_at
    FROM ${deps.qname('song_artwork_images')}
    WHERE lower(song_key) = lower($1)
    LIMIT 1
  `, [songKey]);
  return result.rows[0] || {};
}
"""
          replacement = """async function readOptionalArtwork(songKey, deps) {
  await ensureArtworkTable(deps);
  const result = await deps.client.query(`
    SELECT ${OPTIONAL_FIELDS.join(', ')}, updated_at
    FROM ${deps.qname('song_artwork_images')}
    WHERE lower(song_key) = lower($1)
    LIMIT 1
  `, [songKey]);
  return result.rows[0] || {};
}

function objectValue(value) {
  if (value && typeof value === 'object' && !Array.isArray(value)) return value;
  if (typeof value !== 'string' || !value.trim()) return {};
  try {
    const parsed = JSON.parse(value);
    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
  } catch (_) {
    return {};
  }
}

function arrayValue(value) {
  if (Array.isArray(value)) return value;
  if (typeof value !== 'string' || !value.trim()) return [];
  try {
    const parsed = JSON.parse(value);
    return Array.isArray(parsed) ? parsed : [];
  } catch (_) {
    return [];
  }
}

export function legacyPreparedArtwork(song = {}, recipeValue = {}) {
  const recipe = objectValue(recipeValue);
  const prepared = objectValue(recipe[LEGACY_PREPARED_FIELD]);
  const images = {};

  for (const asset of arrayValue(song.visual_assets)) {
    const source = cleanText(asset?.source).toLowerCase();
    if (!source.startsWith(PROFILE_SOURCE_PREFIX)) continue;
    const ratio = source.slice(PROFILE_SOURCE_PREFIX.length);
    const field = ARTWORK_FIELDS[ratio];
    const url = cleanText(asset?.url || asset?.src);
    if (field && OPTIONAL_FIELDS.includes(field) && url && !images[field]) images[field] = url;
  }

  for (const [ratio, field] of Object.entries(ARTWORK_FIELDS)) {
    if (!OPTIONAL_FIELDS.includes(field)) continue;
    const url = cleanText(prepared[ratio]);
    if (url) images[field] = url;
  }

  return images;
}

export function mergeArtworkSources(stored = {}, legacy = {}) {
  return Object.fromEntries(OPTIONAL_FIELDS.map(field => [
    field,
    cleanText(stored[field] || legacy[field])
  ]));
}

async function readLegacyVisualRecipe(songKey, deps) {
  try {
    const result = await deps.client.query(`
      SELECT recipe
      FROM ${deps.qname('song_visual_recipes')}
      WHERE lower(song_key) = lower($1)
      LIMIT 1
    `, [songKey]);
    return objectValue(result.rows[0]?.recipe);
  } catch (error) {
    if (error?.code === '42P01') return {};
    throw error;
  }
}

async function ensureLegacyVisualRecipeTable(deps) {
  await deps.client.query(`
    CREATE TABLE IF NOT EXISTS ${deps.qname('song_visual_recipes')} (
      song_key TEXT PRIMARY KEY,
      recipe JSONB NOT NULL DEFAULT '{}'::jsonb,
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      updated_at TIMESTAMPTZ NOT NULL DEFAULT now()
    )
  `);
}

async function syncLegacyPreparedArtwork(songKey, patch, deps) {
  const optionalPatch = Object.fromEntries(
    Object.entries(patch || {}).filter(([field]) => OPTIONAL_FIELDS.includes(field))
  );
  if (!Object.keys(optionalPatch).length) return;

  await ensureLegacyVisualRecipeTable(deps);
  const recipe = await readLegacyVisualRecipe(songKey, deps);
  const prepared = { ...objectValue(recipe[LEGACY_PREPARED_FIELD]) };

  for (const [field, value] of Object.entries(optionalPatch)) {
    const ratio = Object.entries(ARTWORK_FIELDS).find(([, artworkField]) => artworkField === field)?.[0];
    if (!ratio) continue;
    const url = cleanText(value);
    if (url) prepared[ratio] = url;
    else delete prepared[ratio];
  }

  const nextRecipe = {
    ...recipe,
    [LEGACY_PREPARED_FIELD]: prepared,
    prepared_artwork_updated_at: new Date().toISOString()
  };

  await deps.client.query(`
    INSERT INTO ${deps.qname('song_visual_recipes')} (song_key, recipe)
    VALUES ($1, $2::jsonb)
    ON CONFLICT (song_key) DO UPDATE SET recipe = EXCLUDED.recipe, updated_at = now()
  `, [songKey, JSON.stringify(nextRecipe)]);
}

async function readCanonicalArtwork(song, deps) {
  let stored = await readOptionalArtwork(song.song_key, deps);
  const recipe = await readLegacyVisualRecipe(song.song_key, deps);
  const legacy = legacyPreparedArtwork(song, recipe);
  const migrationPatch = Object.fromEntries(
    OPTIONAL_FIELDS
      .filter(field => !cleanText(stored[field]) && cleanText(legacy[field]))
      .map(field => [field, cleanText(legacy[field])])
  );

  if (Object.keys(migrationPatch).length) {
    await persistPatch(song, migrationPatch, deps);
    stored = await readOptionalArtwork(song.song_key, deps);
  }

  return {
    ...stored,
    ...mergeArtworkSources(stored, legacy)
  };
}
"""
          if "async function readCanonicalArtwork" not in text:
              if read_anchor not in text:
                  raise SystemExit('readOptionalArtwork anchor was not found.')
              text = text.replace(read_anchor, replacement)

          old_get = """  if (method === 'GET') {
    const stored = await readOptionalArtwork(song.song_key, deps);
    return deps.response(200, { success: true, media: mediaPayload(song, stored) });
  }
"""
          new_get = """  if (method === 'GET') {
    const stored = await readCanonicalArtwork(song, deps);
    return deps.response(200, { success: true, media: mediaPayload(song, stored) });
  }
"""
          if old_get in text:
              text = text.replace(old_get, new_get)
          elif new_get not in text:
              raise SystemExit('Artwork GET handler anchor was not found.')

          old_patch = """    await persistPatch(song, patch, deps);
    const freshSong = await resolveSong(song.song_key, deps, { includeHidden: true });
    const stored = await readOptionalArtwork(song.song_key, deps);
"""
          new_patch = """    await persistPatch(song, patch, deps);
    await syncLegacyPreparedArtwork(song.song_key, patch, deps);
    const freshSong = await resolveSong(song.song_key, deps, { includeHidden: true });
    const stored = await readCanonicalArtwork(freshSong, deps);
"""
          if old_patch in text:
              text = text.replace(old_patch, new_patch)
          elif new_patch not in text:
              raise SystemExit('Artwork PATCH handler anchor was not found.')

          path.write_text(text)
          PY

      - name: Make the Song CMS use the canonical backend first
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          bridge = Path('radio-admin/songs/dev/song-images-compat-bridge.js')
          text = bridge.read_text()
          text = text.replace('__stashboxSongImagesCompatBridgeV3Installed', '__stashboxSongImagesCompatBridgeV4Installed')
          old = """      const mediaMatch = url.pathname.match(/^\\/dev\\/radio\\/admin\\/songs\\/([^/]+)\\/artwork-images$/);
      if (mediaMatch && (method === 'GET' || method === 'PATCH')) {
        return handleArtworkMedia(input, init, mediaMatch, bodyText);
      }
"""
          new = """      const mediaMatch = url.pathname.match(/^\\/dev\\/radio\\/admin\\/songs\\/([^/]+)\\/artwork-images$/);
      if (mediaMatch && (method === 'GET' || method === 'PATCH')) {
        const canonicalResponse = await fetchWithRetry(input, init, {
          label: 'Canonical song artwork request',
          attempts: 3
        });
        if (canonicalResponse.status !== 404) return canonicalResponse;
        return handleArtworkMedia(input, init, mediaMatch, bodyText);
      }
"""
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('Compatibility bridge media interception anchor was not found.')
          bridge.write_text(text)

          app = Path('radio-admin/dev/app.js')
          app_text = app.read_text()
          app_text = app_text.replace(
            'song-images-compat-bridge.js?v=20260729-song-images-network1',
            'song-images-compat-bridge.js?v=20260730-canonical-artwork1'
          )
          app_text = app_text.replace(
            'song-images.js?v=20260729-song-images-order2',
            'song-images.js?v=20260730-canonical-artwork1'
          )
          app.write_text(app_text)
          PY

      - name: Add canonical artwork tests
        shell: bash
        run: |
          set -euo pipefail
          cat > radio-api/tests/song-artwork-canonical.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { legacyPreparedArtwork, mergeArtworkSources } from '../song-artwork-routes.mjs';

          test('legacy VEC prepared artwork is exposed as canonical artwork fields', () => {
            const result = legacyPreparedArtwork({}, {
              prepared_artwork_images: {
                '9x16': 'https://media.example/dirty-bird-9x16.png',
                '16x9': 'https://media.example/dirty-bird-16x9.png',
                '3x4': 'https://media.example/dirty-bird-3x4.png',
                '4x5': 'https://media.example/dirty-bird-4x5.png',
                '21x9': 'https://media.example/dirty-bird-21x9.png'
              }
            });
            assert.equal(result.song_artwork_9x16_url, 'https://media.example/dirty-bird-9x16.png');
            assert.equal(result.song_artwork_16x9_url, 'https://media.example/dirty-bird-16x9.png');
            assert.equal(result.song_artwork_3x4_url, 'https://media.example/dirty-bird-3x4.png');
            assert.equal(result.song_artwork_4x5_url, 'https://media.example/dirty-bird-4x5.png');
            assert.equal(result.song_artwork_21x9_url, 'https://media.example/dirty-bird-21x9.png');
          });

          test('legacy visual_assets profile entries are also recognized', () => {
            const result = legacyPreparedArtwork({
              visual_assets: JSON.stringify([
                { type: 'image', source: 'song_profile_image:9x16', url: 'https://media.example/vertical.png' }
              ])
            }, {});
            assert.equal(result.song_artwork_9x16_url, 'https://media.example/vertical.png');
          });

          test('canonical values win while legacy fills missing ratios', () => {
            const result = mergeArtworkSources(
              { song_artwork_9x16_url: 'https://media.example/canonical-vertical.png' },
              {
                song_artwork_9x16_url: 'https://media.example/legacy-vertical.png',
                song_artwork_16x9_url: 'https://media.example/legacy-wide.png'
              }
            );
            assert.equal(result.song_artwork_9x16_url, 'https://media.example/canonical-vertical.png');
            assert.equal(result.song_artwork_16x9_url, 'https://media.example/legacy-wide.png');
          });
          EOF

      - name: Validate source and tests
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix radio-api install --omit=dev --no-audit --no-fund
          node --check radio-api/song-artwork-routes.mjs
          node --check radio-admin/songs/dev/song-images-compat-bridge.js
          node --check radio-admin/dev/app.js
          node --test radio-api/tests/song-artwork-canonical.test.mjs
          npm --prefix video-render-worker install --omit=dev --no-audit --no-fund
          npm --prefix video-render-worker test

      - name: Commit canonical artwork implementation
        id: implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio-api/song-artwork-routes.mjs \
                  radio-api/tests/song-artwork-canonical.test.mjs \
                  radio-admin/songs/dev/song-images-compat-bridge.js \
                  radio-admin/dev/app.js
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Canonicalize song artwork for Social Factory and GPT [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy canonical Song Artwork backend
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-song-artwork-dev.yml --ref main
          sleep 10
          RUN_ID=$(gh run list \
            --workflow=deploy-song-artwork-dev.yml \
            --event=workflow_dispatch \
            --limit=10 \
            --json databaseId,headSha,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[0].databaseId')
          test -n "${RUN_ID}"
          echo "Waiting for Song Artwork deployment run ${RUN_ID}."
          gh run watch "${RUN_ID}" --exit-status

      - name: Migrate Dirty Bird and run a Social Factory 9x16 proof render
        env:
          RADIO_ADMIN_TOKEN: ${{ secrets.STASHBOX_DEV_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$(dirname "${REPORT_PATH}")"
          test -n "${RADIO_ADMIN_TOKEN}"

          curl --fail --silent --show-error --max-time 90 \
            -H "x-admin-token: ${RADIO_ADMIN_TOKEN}" \
            "${RADIO_API_BASE}/admin/songs" > /tmp/songs.json
          SONG_KEY=$(jq -r '[.songs[] | select(((.song_name // "") + " " + (.display_title // "")) | ascii_downcase | contains("dirty bird"))][0].song_key // empty' /tmp/songs.json)
          test -n "${SONG_KEY}" || { echo 'Dirty Bird was not found in DEV songs.' >&2; exit 1; }
          ENCODED_KEY=$(jq -rn --arg value "${SONG_KEY}" '$value|@uri')

          curl --fail --silent --show-error --max-time 90 \
            -H "x-admin-token: ${RADIO_ADMIN_TOKEN}" \
            "${RADIO_API_BASE}/radio/admin/songs/${ENCODED_KEY}/artwork-images" > /tmp/artwork.json
          EXPECTED_9X16=$(jq -r '.media.artwork_images["9x16"] // empty' /tmp/artwork.json)
          test -n "${EXPECTED_9X16}" || {
            echo 'Dirty Bird still has no canonical 9x16 artwork after migration.' >&2
            cat /tmp/artwork.json >&2
            exit 1
          }

          SOCIAL_CONFIG=$(aws secretsmanager get-secret-value \
            --secret-id "${SOCIAL_CONFIG_SECRET}" \
            --query SecretString --output text)
          SOCIAL_ADMIN_TOKEN=$(printf '%s' "${SOCIAL_CONFIG}" | jq -r '.admin_token // empty')
          test -n "${SOCIAL_ADMIN_TOKEN}"

          CAMPAIGN="Canonical Artwork Verification - Dirty Bird - $(date -u +%Y%m%dT%H%M%SZ)"
          jq -n \
            --arg song_key "${SONG_KEY}" \
            --arg campaign "${CAMPAIGN}" '{
              song_key: $song_key,
              batch_name: $campaign,
              client_name: "Stashbox",
              project_name: "Social Factory",
              campaign_name: $campaign,
              duration_mode: "promo",
              duration_seconds: 15,
              aspect_ratio: "9:16",
              fps: 30,
              intro_enabled: false,
              outro_enabled: false,
              corner_bug_enabled: false,
              include_artist: false,
              include_song: false,
              include_album: false,
              metadata_comment: "Canonical artwork regression verification for Social Factory and GPT readiness"
            }' > /tmp/draft-request.json

          curl --fail --silent --show-error --max-time 90 \
            -X POST \
            -H "x-admin-token: ${SOCIAL_ADMIN_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/draft-request.json \
            "${SOCIAL_API_BASE}/social/orchestration/render-jobs" > /tmp/draft.json
          JOB_ID=$(jq -r '.job.id // empty' /tmp/draft.json)
          test -n "${JOB_ID}" || { cat /tmp/draft.json >&2; exit 1; }

          curl --fail --silent --show-error --max-time 90 \
            -X POST \
            -H "x-admin-token: ${SOCIAL_ADMIN_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"confirm_render":true}' \
            "${SOCIAL_API_BASE}/social/orchestration/render-jobs/${JOB_ID}/launch" > /tmp/launch.json
          jq -e '.launched == true' /tmp/launch.json >/dev/null

          DEADLINE=$(( $(date +%s) + 2700 ))
          STATUS=''
          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            curl --fail --silent --show-error --max-time 90 \
              -H "x-admin-token: ${SOCIAL_ADMIN_TOKEN}" \
              "${SOCIAL_API_BASE}/social/orchestration/render-jobs/${JOB_ID}" > /tmp/social-job.json
            STATUS=$(jq -r '.job.status // empty' /tmp/social-job.json)
            echo "Dirty Bird proof render status: ${STATUS}"
            case "${STATUS}" in
              completed) break ;;
              failed|cancelled) cat /tmp/social-job.json >&2; exit 1 ;;
            esac
            sleep 15
          done
          test "${STATUS}" = 'completed' || { echo 'Dirty Bird proof render timed out.' >&2; exit 1; }

          curl --fail --silent --show-error --max-time 90 \
            -H "x-admin-token: ${RADIO_ADMIN_TOKEN}" \
            "${RADIO_API_BASE}/admin/video-factory/jobs/${JOB_ID}" > /tmp/radio-job.json

          SELECTED_URL=$(jq -r '.job.render_recipe.artwork.url // empty' /tmp/radio-job.json)
          SOURCE_RATIO=$(jq -r '.job.render_recipe.artwork.source_ratio // empty' /tmp/radio-job.json)
          FALLBACK=$(jq -r '.job.render_recipe.artwork.fallback_used // true' /tmp/radio-job.json)
          FIRST_ARTWORK_URL=$(jq -r '[.job.render_recipe.timeline[]? | select((.asset_id // "") == "song-artwork" or (.source // "") == "song-artwork")][0].url // empty' /tmp/radio-job.json)

          test "${SELECTED_URL}" = "${EXPECTED_9X16}" || { echo 'Renderer did not select the canonical 9x16 URL.' >&2; exit 1; }
          test "${SOURCE_RATIO}" = '9x16' || { echo "Unexpected source ratio: ${SOURCE_RATIO}" >&2; exit 1; }
          test "${FALLBACK}" = 'false' || { echo 'The exact 9x16 selection was incorrectly marked as a fallback.' >&2; exit 1; }
          test "${FIRST_ARTWORK_URL}" = "${EXPECTED_9X16}" || { echo 'The first song-artwork timeline segment was not rewritten to 9x16.' >&2; exit 1; }

          jq -n \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg song_key "${SONG_KEY}" \
            --arg expected_9x16 "${EXPECTED_9X16}" \
            --arg job_id "${JOB_ID}" \
            --arg campaign "${CAMPAIGN}" \
            --slurpfile artwork /tmp/artwork.json \
            --slurpfile job /tmp/radio-job.json '{
              status: "success",
              checked_at: $checked_at,
              contract: "Song CMS -> canonical artwork API -> Social Factory -> Video Factory worker",
              song_key: $song_key,
              campaign: $campaign,
              job_id: $job_id,
              expected_9x16_url: $expected_9x16,
              artwork_completion: ($artwork[0].media.completion // {}),
              renderer_selection: ($job[0].job.render_recipe.artwork // {}),
              first_song_artwork_segment: ([($job[0].job.render_recipe.timeline // [])[] | select((.asset_id // "") == "song-artwork" or (.source // "") == "song-artwork")][0] // {}),
              output_url: ($job[0].job.output_url // ""),
              completed_at: ($job[0].job.completed_at // "")
            }' > "${REPORT_PATH}"

          rm -f /tmp/songs.json /tmp/artwork.json /tmp/draft-request.json /tmp/draft.json /tmp/launch.json /tmp/social-job.json /tmp/radio-job.json
          unset RADIO_ADMIN_TOKEN SOCIAL_ADMIN_TOKEN SOCIAL_CONFIG

      - name: Commit verification receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "${REPORT_PATH}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Verify canonical Dirty Bird 9x16 Social Factory render [skip ci]'
          git push origin HEAD:main
