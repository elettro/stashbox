name: Canonicalize Social Artwork and Verify 9x16

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-canonicalize-social-artwork.yml'

permissions:
  contents: write
  actions: write

jobs:
  canonicalize-deploy-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Canonicalize, deploy, and prove Dirty Bird 9x16 artwork
        env:
          GH_TOKEN: ${{ github.token }}
          RADIO_ADMIN_TOKEN: ${{ secrets.STASHBOX_DEV_ADMIN_TOKEN }}
          RADIO_API_BASE: https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev
          SOCIAL_API_BASE: https://tnrca1ff32.execute-api.us-east-1.amazonaws.com/dev
          SOCIAL_CONFIG_SECRET: stashbox/social-factory/dev/youtube-oauth/config
          REPORT_PATH: deployment-reports/dirty-bird-canonical-artwork-verification.json
        run: bash .github/scripts/run_canonical_artwork_verification.sh
