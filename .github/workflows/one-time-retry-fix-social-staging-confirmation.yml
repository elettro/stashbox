name: One-time retry Social Factory staging confirmation fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-retry-fix-social-staging-confirmation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch GPT staging action contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('custom-gpt/stashbox-radio/openapi.yaml')
          text = path.read_text()
          text = text.replace('version: 0.9.4', 'version: 0.9.5', 1)

          single_old = """  /social/orchestration/render-jobs/{jobId}/stage:
    post:
      operationId: stageCompletedRenderForReview
      summary: Stage one completed render into Content Review.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200': {description: Staging result, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
"""
          single_new = """  /social/orchestration/render-jobs/{jobId}/stage:
    post:
      operationId: stageCompletedRenderForReview
      summary: Validate or stage one completed render into Content Review.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_stage]
              properties:
                confirm_stage:
                  type: boolean
                  default: false
                  description: Set false for validation. Set true to move the completed render into Content Review.
              additionalProperties: false
      responses:
        '200': {description: Staging validation or execution result, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
"""
          if single_old in text:
              text = text.replace(single_old, single_new, 1)

          batch_old = """  /social/orchestration/batch-stage:
    post:
      operationId: stageCompletedRenderBatchForReview
      summary: Stage completed jobs into Content Review as a batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_ids]
              properties:
                job_ids:
                  type: array
                  minItems: 1
                  items: {type: string}
      responses:
        '200': {description: Batch staging result, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
"""
          batch_new = """  /social/orchestration/batch-stage:
    post:
      operationId: stageCompletedRenderBatchForReview
      summary: Validate or stage completed jobs into Content Review as a batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_ids, confirm_stage_batch]
              properties:
                job_ids:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: {type: string}
                confirm_stage_batch:
                  type: boolean
                  default: false
                  description: Set false for validation. Set true to move every eligible completed render into Content Review in one batch.
              additionalProperties: false
      responses:
        '200': {description: Batch staging validation or execution result, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
"""
          if batch_old in text:
              text = text.replace(batch_old, batch_new, 1)

          if 'required: [confirm_stage]' not in text:
              raise SystemExit('single staging confirmation field missing')
          if 'required: [job_ids, confirm_stage_batch]' not in text:
              raise SystemExit('batch staging confirmation field missing')
          path.write_text(text)

          path = Path('custom-gpt/stashbox-radio/instructions.md')
          text = path.read_text()
          old = '- Completed Social Factory renders should enter Content Review when the workflow supports automatic staging. Otherwise, stage completed jobs as one batch when requested.\n'
          new = (
              '- Completed Social Factory renders should enter Content Review when the workflow supports automatic staging. Otherwise, validate batch staging with `confirm_stage_batch: false`, then execute the same batch with `confirm_stage_batch: true` when staging has been authorized.\n'
              '- Staging copies completed output into Content Review. It does not approve, schedule, upload, publish, or notify subscribers.\n'
              '- Never stop after a successful validation-only staging response when execution has already been authorized. Make the confirmed staging call and verify `staged: true` plus every returned review ID.\n'
          )
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace(
              '- Validation-only render, publish, or schedule checks.\n',
              '- Validation-only render, staging, publish, or schedule checks.\n- Staging completed renders into Content Review after campaign authorization or an explicit request to continue into Content Review.\n',
              1
          )
          marker = '- Before publishing or scheduling, validate first and repeat destination, title, privacy, date, time, timezone, and review ID.\n'
          addition = marker + '- For batch staging, send all completed job IDs with `confirm_stage_batch: true` after authorization. Capture every returned review ID before approval or scheduling.\n'
          if marker in text and 'For batch staging, send all completed job IDs' not in text:
              text = text.replace(marker, addition, 1)
          path.write_text(text)
          PY

          grep -n "confirm_stage_batch\|required: \[confirm_stage\]" custom-gpt/stashbox-radio/openapi.yaml
          grep -n "Never stop after a successful validation-only staging response" custom-gpt/stashbox-radio/instructions.md

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom-gpt/stashbox-radio/openapi.yaml custom-gpt/stashbox-radio/instructions.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Custom GPT staging confirmation contract'
          git pull --rebase origin main
          git push origin HEAD:main
