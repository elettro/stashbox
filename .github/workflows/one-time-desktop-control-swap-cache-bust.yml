name: One-time desktop control swap cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-desktop-control-swap-cache-bust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Cache bust desktop control positions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('radio/desktop/index.html')
          text = path.read_text()
          text = text.replace('v2-desktop-video-fit-toggle.css?v=20260821-fitfull5', 'v2-desktop-video-fit-toggle.css?v=20260824-controlswap1')
          text = text.replace('profilefavorites2-playlist1">', 'profilefavorites2-playlist1-controlswap1">', 1)
          path.write_text(text)
          PY
      - name: Commit desktop control swap publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio/desktop/index.html
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'Publish desktop Playlist and Fit control swap'
            git push origin main
          fi
