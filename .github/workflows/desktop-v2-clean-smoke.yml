name: Desktop V2 Clean Smoke

on:
  push:
    branches: [main]
    paths:
      - 'radio/dev/v2/index.html'
      - 'radio/dev/v2/desktop/**'
      - 'radio-api/scripts/smoke-test-v2-desktop-clean-live.mjs'
      - '.github/workflows/desktop-v2-clean-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-clean-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile-check desktop browser scripts
        run: |
          node --check radio/dev/v2/desktop/desktop-vec2.js
          node --check radio/dev/v2/desktop/desktop-audio-master.js
          node --check radio/dev/v2/desktop/desktop-health.js
          node --check radio-api/scripts/smoke-test-v2-desktop-clean-live.mjs
      - name: Run clean desktop structural smoke test
        run: node radio/dev/v2/desktop/smoke-test.mjs
      - name: Record successful smoke check
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p radio/docs/ci
          {
            echo "desktop_v2_clean_smoke=PASS"
            echo "source_commit=${GITHUB_SHA}"
            echo "passed_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > radio/docs/ci/desktop-v2-clean-smoke.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio/docs/ci/desktop-v2-clean-smoke.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record desktop V2 smoke pass [skip ci]"
          git push
