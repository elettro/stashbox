name: Canonical Video Library Backend Audit

on:
  push:
    branches: [feature/canonical-video-library-1077]
    paths:
      - '.github/workflows/canonical-video-library-backend-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      DEV_FUNCTION: stashbox-radio-api-dev-v2
      PROD_FUNCTION: stashbox-radio-api-prod-v2
      DEV_API: https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev
      PROD_API: https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Inspect Lambda boundaries and protected APIs
        shell: bash
        run: |
          set -euo pipefail
          aws lambda get-function-configuration --function-name "$DEV_FUNCTION" --region "$AWS_REGION" > /tmp/dev.json
          aws lambda get-function-configuration --function-name "$PROD_FUNCTION" --region "$AWS_REGION" > /tmp/prod.json

          node <<'NODE'
          const fs = require('fs');
          const {execFileSync} = require('child_process');
          const dev = JSON.parse(fs.readFileSync('/tmp/dev.json','utf8'));
          const prod = JSON.parse(fs.readFileSync('/tmp/prod.json','utf8'));
          const env = cfg => cfg.Environment?.Variables || {};
          const safe = (cfg) => ({
            functionName: cfg.FunctionName,
            codeSha256: cfg.CodeSha256,
            lastModified: cfg.LastModified,
            runtime: cfg.Runtime,
            handler: cfg.Handler,
            revisionId: cfg.RevisionId,
            appEnv: env(cfg).APP_ENV || env(cfg).STAGE || env(cfg).ENVIRONMENT || '',
            pgSchema: env(cfg).PGSCHEMA || '',
            uploadBucket: env(cfg).UPLOAD_BUCKET || env(cfg).S3_BUCKET || env(cfg).RADIO_UPLOAD_BUCKET || '',
            uploadPublicBaseUrl: env(cfg).UPLOAD_PUBLIC_BASE_URL || ''
          });
          fs.writeFileSync('lambda-boundaries.json', JSON.stringify({dev:safe(dev),prod:safe(prod)},null,2)+'\n');
          console.log(JSON.stringify({dev:safe(dev),prod:safe(prod)},null,2));
          NODE

          DEV_TOKEN="$(jq -r '.Environment.Variables.ADMIN_TOKEN // .Environment.Variables.RADIO_ADMIN_TOKEN // empty' /tmp/dev.json)"
          PROD_TOKEN="$(jq -r '.Environment.Variables.ADMIN_TOKEN // .Environment.Variables.RADIO_ADMIN_TOKEN // empty' /tmp/prod.json)"
          test -n "$DEV_TOKEN"
          test -n "$PROD_TOKEN"
          export DEV_TOKEN PROD_TOKEN

          node <<'NODE'
          (async () => {
            const fs = require('fs');
            const DEV = process.env.DEV_API || 'https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev';
            const PROD = process.env.PROD_API || 'https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2';
            const tokens = {DEV:process.env.DEV_TOKEN, PROD:process.env.PROD_TOKEN};
            function unwrap(v){for(let i=0;i<3;i++){if(v&&typeof v==='object'&&typeof v.body==='string'){try{v=JSON.parse(v.body);continue}catch{}}break}return v}
            async function request(label, base, path) {
              const res = await fetch(base+path,{headers:{'x-admin-token':tokens[label],'cache-control':'no-cache','accept':'application/json'}});
              const text=await res.text(); let body; try{body=unwrap(JSON.parse(text))}catch{body=text}
              return {status:res.status,body};
            }
            function rows(body,keys){if(Array.isArray(body))return body;for(const k of keys)if(Array.isArray(body?.[k]))return body[k];return[]}
            const devFoldersResp=await request('DEV',DEV,'/admin/visuals/folders');
            const prodFoldersResp=await request('PROD',PROD,'/admin/visuals/folders');
            const devFolders=rows(devFoldersResp.body,['folders','visuals_folders','items','rows','data']);
            const prodFolders=rows(prodFoldersResp.body,['folders','visuals_folders','items','rows','data']);
            const folderId=f=>String(f?.id||f?.folder_id||'');
            const assets=[];
            for(const f of devFolders){const id=folderId(f);if(!id)continue;const r=await request('DEV',DEV,`/admin/visuals/folders/${encodeURIComponent(id)}/assets`);assets.push({folderId:id,status:r.status,count:rows(r.body,['assets','items','rows','data']).length});}
            const songsResp=await request('DEV',DEV,'/admin/songs');
            const songs=rows(songsResp.body,['songs','items','rows','data']);
            const sampleSong=String(songs[0]?.song_key||songs[0]?.songKey||'');
            const devMap=sampleSong?await request('DEV',DEV,`/admin/visuals/song-folders/${encodeURIComponent(sampleSong)}`):{status:0,body:null};
            const prodMap=sampleSong?await request('PROD',PROD,`/admin/visuals/song-folders/${encodeURIComponent(sampleSong)}`):{status:0,body:null};
            const summary={
              devFoldersStatus:devFoldersResp.status, devFolderCount:devFolders.length,
              devAssetCount:assets.reduce((n,x)=>n+x.count,0), devAssetRequests:assets,
              prodFoldersStatus:prodFoldersResp.status, prodFolderCount:prodFolders.length,
              sampleSong, devMappingStatus:devMap.status, prodMappingStatus:prodMap.status,
              prodFoldersError:prodFoldersResp.status>=400?prodFoldersResp.body:null,
              prodMappingError:prodMap.status>=400?prodMap.body:null
            };
            fs.writeFileSync('backend-audit.json',JSON.stringify(summary,null,2)+'\n');
            console.log(JSON.stringify(summary,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
        env:
          DEV_API: ${{ env.DEV_API }}
          PROD_API: ${{ env.PROD_API }}
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-video-library-backend-audit
          path: |
            backend-audit.json
            lambda-boundaries.json
