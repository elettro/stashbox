name: Canonical Video Library Backend Audit

on:
  push:
    branches: [feature/canonical-video-library-1077]
    paths:
      - '.github/workflows/canonical-video-library-backend-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  migrate-and-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-1
      PROD_FUNCTION: stashbox-radio-api-prod-v2
      PROD_API: https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2
      PROD_BUCKET: stashbox-radio-media-prod-us-east-1
      PROD_CDN: d34ez960394y8w.cloudfront.net
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Remove diagnostic run that echoed derived environment values
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/33251290969" || true

      - name: Apply exact VE-10B PROD migration and prove canonical Video Library
        shell: bash
        run: |
          set -euo pipefail
          aws lambda get-function-configuration --function-name "$PROD_FUNCTION" --region "$AWS_REGION" > /tmp/prod-config.json
          PGHOST="$(jq -r '.Environment.Variables.PGHOST' /tmp/prod-config.json)"
          PGPORT="$(jq -r '.Environment.Variables.PGPORT // "5432"' /tmp/prod-config.json)"
          PGDATABASE="$(jq -r '.Environment.Variables.PGDATABASE' /tmp/prod-config.json)"
          PGUSER="$(jq -r '.Environment.Variables.PGUSER' /tmp/prod-config.json)"
          PGPASSWORD="$(jq -r '.Environment.Variables.PGPASSWORD' /tmp/prod-config.json)"
          PGSCHEMA="$(jq -r '.Environment.Variables.PGSCHEMA // "radio"' /tmp/prod-config.json)"
          PROD_TOKEN="$(jq -r '.Environment.Variables.ADMIN_TOKEN // .Environment.Variables.RADIO_ADMIN_TOKEN // empty' /tmp/prod-config.json)"
          test -n "$PGHOST"; test -n "$PGDATABASE"; test -n "$PGUSER"; test -n "$PGPASSWORD"; test -n "$PROD_TOKEN"
          test "$PGSCHEMA" = "radio"
          export PGPASSWORD PROD_TOKEN

          DB_IDENTIFIER="${PGHOST%%.*}"
          aws rds describe-db-instances --db-instance-identifier "$DB_IDENTIFIER" --region "$AWS_REGION" > /tmp/db.json
          SG_ID="$(jq -r '.DBInstances[0].VpcSecurityGroups[0].VpcSecurityGroupId // empty' /tmp/db.json)"
          test -n "$SG_ID"
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          CIDR="${RUNNER_IP}/32"
          cat > /tmp/ingress.json <<JSON
          [{"IpProtocol":"tcp","FromPort":5432,"ToPort":5432,"IpRanges":[{"CidrIp":"$CIDR","Description":"stashbox-ve10b-${GITHUB_RUN_ID}"}]}]
          JSON
          ingress_open=0
          close_ingress() {
            if [ "$ingress_open" = "1" ]; then
              aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --ip-permissions file:///tmp/ingress.json --region "$AWS_REGION" >/dev/null 2>&1 || true
            fi
          }
          trap close_ingress EXIT
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" --ip-permissions file:///tmp/ingress.json --region "$AWS_REGION" >/dev/null
          ingress_open=1

          CONN="host=$PGHOST port=$PGPORT dbname=$PGDATABASE user=$PGUSER sslmode=require connect_timeout=10"
          psql "$CONN" -X -v ON_ERROR_STOP=1 -Atc "SELECT 'rds-ok'" >/dev/null

          TABLE_COUNT="$(psql "$CONN" -X -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='radio' AND table_name IN ('song_visual_settings','song_visual_folder_mappings','song_visual_asset_mappings');")"
          if [ "$TABLE_COUNT" != "0" ] && [ "$TABLE_COUNT" != "3" ]; then
            echo "Partial VE-10B PROD state detected: $TABLE_COUNT/3 tables." >&2
            exit 1
          fi

          if [ "$TABLE_COUNT" = "0" ]; then
            {
              echo 'BEGIN;'
              sed \
                -e 's/radio_dev\./radio./g' \
                -e 's/TRUE DEV only/canonical LIVE/g' \
                -e 's/TRUE DEV/canonical LIVE/g' \
                radio-api/db/migrations/001_ve10b_song_visual_source_controller.sql
              echo 'COMMIT;'
            } > /tmp/ve10b-prod.sql
            psql "$CONN" -X -v ON_ERROR_STOP=1 -f /tmp/ve10b-prod.sql >/dev/null
          fi

          psql "$CONN" -X -v ON_ERROR_STOP=1 -Atc "
            SELECT table_name||'|'||column_name||'|'||data_type||'|'||is_nullable||'|'||coalesce(column_default,'')
            FROM information_schema.columns
            WHERE table_schema='radio' AND table_name IN ('song_visual_settings','song_visual_folder_mappings','song_visual_asset_mappings')
            ORDER BY table_name,ordinal_position;
          " > ve10b-prod-columns.txt
          FINAL_COUNT="$(psql "$CONN" -X -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='radio' AND table_name IN ('song_visual_settings','song_visual_folder_mappings','song_visual_asset_mappings');")"
          test "$FINAL_COUNT" = "3"
          echo 'VE-10B tables verified in PROD.'

          TEST_SONG='petty-fuck-02b-stashbox'
          HAD_SETTINGS="$(psql "$CONN" -X -Atc "SELECT count(*) FROM radio.song_visual_settings WHERE song_key='$TEST_SONG';")"
          export TEST_SONG

          node <<'NODE'
          const fs=require('fs'); const {execFileSync}=require('child_process');
          const API=process.env.PROD_API,token=process.env.PROD_TOKEN,bucket=process.env.PROD_BUCKET,cdn=process.env.PROD_CDN,songKey=process.env.TEST_SONG;
          const marker=`__canonical_visual_prod_proof_${Date.now()}__`;
          const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl6ZqgAAAAASUVORK5CYII=','base64');
          const report={marker,startedAt:new Date().toISOString(),steps:{},cleanup:{}};
          let folder=null,originalFolder=null,folderChanged=false,assetId='',uploadedKey='';
          function unwrap(v){for(let i=0;i<3;i++){if(v&&typeof v==='object'&&typeof v.body==='string'){try{v=JSON.parse(v.body);continue}catch{}}break}return v}
          async function req(path,opt={}){const method=String(opt.method||'GET').toUpperCase();const r=await fetch(API+path,{...opt,method,headers:{'x-admin-token':token,accept:'application/json',...(opt.body?{'content-type':'application/json'}:{}),...(opt.headers||{})},cache:method==='GET'?'no-store':undefined});const t=await r.text();let b;try{b=unwrap(t?JSON.parse(t):{})}catch{b=t}if(!r.ok||b?.success===false)throw new Error(`${method} ${path} -> ${r.status} ${typeof b==='string'?b:JSON.stringify(b)}`);return b}
          async function pub(path){const r=await fetch(API+path,{headers:{accept:'application/json','cache-control':'no-cache'},cache:'no-store'});const t=await r.text();let b;try{b=unwrap(t?JSON.parse(t):{})}catch{b=t}if(!r.ok)throw new Error(`GET ${path} -> ${r.status}`);return b}
          const rows=(b,ks)=>{if(Array.isArray(b))return b;for(const k of ks)if(Array.isArray(b?.[k]))return b[k];return[]};
          const fid=f=>String(f?.id||f?.folder_id||''), fslug=f=>String(f?.folder_slug||f?.slug||'');
          const fp=(f,notes)=>({folder_name:f.folder_name||f.name||'',folder_type:f.folder_type||f.type||'general',description:f.description||'',status:f.status||'active',priority:f.priority||'medium',notes:notes===undefined?(f.notes||''):notes,relevant_artists:Array.isArray(f.relevant_artists)?f.relevant_artists:[],relevant_genres:Array.isArray(f.relevant_genres)?f.relevant_genres:[],relevant_moods:Array.isArray(f.relevant_moods)?f.relevant_moods:[],relevant_songs:Array.isArray(f.relevant_songs)?f.relevant_songs:[]});
          (async()=>{try{
            const songs=rows(await req('/admin/songs'),['songs','items','rows','data']);if(!songs.some(s=>String(s.song_key||'')===songKey))throw new Error('Proof song missing from PROD.');
            const folders=rows(await req('/admin/visuals/folders'),['folders','items','rows','data']);folder=folders.find(f=>fslug(f)==='dean-skateboarding-boardwalk-beach')||folders[0];if(!folder)throw new Error('No PROD visual folder.');const id=fid(folder);
            originalFolder=fp(folder);await req(`/admin/visuals/folders/${encodeURIComponent(id)}`,{method:'PUT',body:JSON.stringify(fp(folder,[originalFolder.notes,marker].filter(Boolean).join('\n')))});folderChanged=true;const folderCheck=rows(await req('/admin/visuals/folders'),['folders','items','rows','data']).find(f=>fid(f)===id);if(!String(folderCheck?.notes||'').includes(marker))throw new Error('Folder write not visible.');report.steps.folderWrite='PASS';await req(`/admin/visuals/folders/${encodeURIComponent(id)}`,{method:'PUT',body:JSON.stringify(originalFolder)});folderChanged=false;report.steps.folderRestore='PASS';
            const before=await req(`/admin/songs/${encodeURIComponent(songKey)}/visual-settings`);const payload={order_mode:before.order_mode||'random',folder_mappings:rows(before,['folder_mappings']).map(x=>({folder_id:String(x.folder_id||''),inclusion_state:x.inclusion_state||'included'})).filter(x=>x.folder_id),asset_mappings:rows(before,['asset_mappings']).map(x=>({asset_id:String(x.asset_id||''),asset_scope:x.asset_scope==='direct'?'direct':'folder',inclusion_state:x.inclusion_state||'included',manual_order:x.manual_order??null})).filter(x=>x.asset_id)};await req(`/admin/songs/${encodeURIComponent(songKey)}/visual-settings`,{method:'PUT',body:JSON.stringify(payload)});const publicSettings=await pub(`/radio/songs/${encodeURIComponent(songKey)}/visual-settings`);if(String(publicSettings.song_key||'')!==songKey)throw new Error('Public mapping readback failed.');report.steps.visualSettingsWriteRead='PASS';
            const filename=`${marker}.png`;const pre=await req('/admin/uploads/presign',{method:'POST',body:JSON.stringify({filename,content_type:'image/png',purpose:'visual_folder_image',folder_slug:fslug(folder),folder_id:id})});const uploadUrl=String(pre.upload_url||pre.uploadUrl||''),publicUrl=String(pre.public_url||pre.publicUrl||'');uploadedKey=String(pre.key||pre.object_key||'');if(!uploadUrl||!publicUrl||!uploadedKey)throw new Error('Incomplete PROD presign.');const uh=new URL(uploadUrl).hostname.toLowerCase(),ph=new URL(publicUrl).hostname.toLowerCase();if(!uh.includes(bucket))throw new Error('Presign not PROD bucket.');if(ph!==cdn&&!ph.includes(bucket))throw new Error('Public URL not PROD media.');const put=await fetch(uploadUrl,{method:String(pre.method||'PUT').toUpperCase(),headers:pre.headers||{'Content-Type':'image/png'},body:png});if(!put.ok)throw new Error(`S3 PUT ${put.status}`);report.steps.presignAndS3Upload='PASS';
            const created=await req(`/admin/visuals/folders/${encodeURIComponent(id)}/assets`,{method:'POST',body:JSON.stringify({asset_type:'image',file_name:filename,s3_key:uploadedKey,public_url:publicUrl,thumbnail_url:publicUrl,content_type:'image/png',size_bytes:png.length,width:1,height:1,ratio_label:'1:1',caption:marker,alt_text:'Canonical Video Library production proof',notes:marker,shopify_product_urls:[]})});const a=created.asset||created.data||created;assetId=String(a.id||a.asset_id||'');if(!assetId)throw new Error('Asset POST returned no id.');const publicAssets=rows(await pub(`/radio/visuals/folders/${encodeURIComponent(id)}/assets`),['assets','items','rows','data']);if(!publicAssets.some(x=>String(x.id||x.asset_id||'')===assetId||String(x.public_url||x.url||'')===publicUrl))throw new Error('Proof asset missing public readback.');report.steps.assetRegisterAndPublicRead='PASS';await req(`/admin/visuals/folders/${encodeURIComponent(id)}/assets/${encodeURIComponent(assetId)}`,{method:'DELETE'});assetId='';report.steps.assetHide='PASS';execFileSync('aws',['s3api','delete-object','--region',process.env.AWS_REGION,'--bucket',bucket,'--key',uploadedKey],{stdio:'pipe'});uploadedKey='';report.steps.s3Cleanup='PASS';report.success=true;
          }finally{if(folderChanged&&folder&&originalFolder){try{await req(`/admin/visuals/folders/${encodeURIComponent(fid(folder))}`,{method:'PUT',body:JSON.stringify(originalFolder)});report.cleanup.folder='restored'}catch(e){report.cleanup.folder=`FAILED: ${e.message}`}}if(assetId&&folder){try{await req(`/admin/visuals/folders/${encodeURIComponent(fid(folder))}/assets/${encodeURIComponent(assetId)}`,{method:'DELETE'});report.cleanup.asset='hidden'}catch(e){report.cleanup.asset=`FAILED: ${e.message}`}}if(uploadedKey){try{execFileSync('aws',['s3api','delete-object','--region',process.env.AWS_REGION,'--bucket',bucket,'--key',uploadedKey],{stdio:'pipe'});report.cleanup.s3='deleted'}catch(e){report.cleanup.s3=`FAILED: ${e.message}`}}report.finishedAt=new Date().toISOString();fs.writeFileSync('canonical-video-library-prod-proof.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));}})().catch(e=>{console.error(e);process.exit(1)});
          NODE

          if [ "$HAD_SETTINGS" = "0" ]; then
            psql "$CONN" -X -v ON_ERROR_STOP=1 -c "DELETE FROM radio.song_visual_asset_mappings WHERE song_key='$TEST_SONG'; DELETE FROM radio.song_visual_folder_mappings WHERE song_key='$TEST_SONG'; DELETE FROM radio.song_visual_settings WHERE song_key='$TEST_SONG';" >/dev/null
          fi
          echo 'Controlled PROD Video Library proof complete.'
          close_ingress
          ingress_open=0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-video-library-prod-proof
          path: |
            ve10b-prod-columns.txt
            canonical-video-library-prod-proof.json
          if-no-files-found: warn
