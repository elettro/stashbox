name: Canonical Video Library Backend Audit

on:
  push:
    branches: [feature/canonical-video-library-1077]
    paths:
      - '.github/workflows/canonical-video-library-backend-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate-and-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_REGION: us-east-1
      PROD_FUNCTION: stashbox-radio-api-prod-v2
      PROD_API: https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2
      PROD_BUCKET: stashbox-radio-media-prod-us-east-1
      PROD_CDN: d34ez960394y8w.cloudfront.net
      TEST_SONG: petty-fuck-02b-stashbox
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Snapshot exact PROD Lambda package
        shell: bash
        run: |
          set -euo pipefail
          aws lambda get-function --function-name "$PROD_FUNCTION" --region "$AWS_REGION" > /tmp/prod-before.json
          jq -e '.Configuration.Handler == "index.handler" and .Configuration.Runtime == "nodejs22.x"' /tmp/prod-before.json >/dev/null
          CODE_URL="$(jq -r '.Code.Location' /tmp/prod-before.json)"
          test -n "$CODE_URL"
          curl -fsSL "$CODE_URL" -o /tmp/prod-original.zip
          unzip -tq /tmp/prod-original.zip >/dev/null
          jq '{FunctionName:.Configuration.FunctionName,Handler:.Configuration.Handler,Runtime:.Configuration.Runtime,CodeSha256:.Configuration.CodeSha256,RevisionId:.Configuration.RevisionId}' /tmp/prod-before.json > prod-lambda-before-safe.json

      - name: Build temporary bridge package without changing original index.mjs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/prod-bridge
          mkdir -p /tmp/prod-bridge
          unzip -q /tmp/prod-original.zip -d /tmp/prod-bridge
          test -f /tmp/prod-bridge/index.mjs
          test -f /tmp/prod-bridge/node_modules/pg/package.json
          MIGRATION_NONCE="ve10b-${GITHUB_RUN_ID}-${GITHUB_SHA:0:12}"
          echo "$MIGRATION_NONCE" > /tmp/migration-nonce
          export MIGRATION_NONCE
          node <<'NODE'
          const fs = require('fs');
          const ddl = fs.readFileSync('radio-api/db/migrations/001_ve10b_song_visual_source_controller.sql','utf8')
            .replaceAll('radio_dev.','radio.')
            .replaceAll('TRUE DEV only','canonical LIVE')
            .replaceAll('TRUE DEV','canonical LIVE');
          const nonce = process.env.MIGRATION_NONCE;
          const source = `import * as original from './index.mjs';\nimport pg from 'pg';\nconst { Client } = pg;\nconst NONCE=${JSON.stringify(nonce)};\nconst DDL=${JSON.stringify(ddl)};\nconst TABLES=['song_visual_settings','song_visual_folder_mappings','song_visual_asset_mappings'];\nfunction dbClient(){return new Client({host:process.env.PGHOST,port:Number(process.env.PGPORT||5432),database:process.env.PGDATABASE,user:process.env.PGUSER,password:process.env.PGPASSWORD,ssl:{rejectUnauthorized:false},connectionTimeoutMillis:10000});}\nasync function migration(event){if(String(process.env.PGSCHEMA||'radio')!=='radio')throw new Error('Refusing VE-10B outside PROD radio schema.');const db=dbClient();await db.connect();try{const action=String(event.action||'status');const songKey=String(event.songKey||'').trim();if(action==='migrate'){const before=await db.query(\"SELECT table_name FROM information_schema.tables WHERE table_schema='radio' AND table_name=ANY($1::text[]) ORDER BY table_name\",[TABLES]);if(before.rowCount!==0&&before.rowCount!==3)throw new Error('Partial VE-10B state.');let created=false;if(before.rowCount===0){await db.query('BEGIN');try{await db.query(DDL);await db.query('COMMIT');created=true;}catch(e){await db.query('ROLLBACK');throw e;}}const after=await db.query(\"SELECT table_name FROM information_schema.tables WHERE table_schema='radio' AND table_name=ANY($1::text[]) ORDER BY table_name\",[TABLES]);if(after.rowCount!==3)throw new Error('VE-10B verification failed.');let hadSettings=null;if(songKey){const r=await db.query('SELECT count(*)::int count FROM radio.song_visual_settings WHERE song_key=$1',[songKey]);hadSettings=Number(r.rows[0]?.count||0);}return {ok:true,action,created,tableCount:after.rowCount,hadSettings};}if(action==='cleanup-proof-song'){if(!songKey)throw new Error('songKey required');await db.query('BEGIN');try{await db.query('DELETE FROM radio.song_visual_asset_mappings WHERE song_key=$1',[songKey]);await db.query('DELETE FROM radio.song_visual_folder_mappings WHERE song_key=$1',[songKey]);await db.query('DELETE FROM radio.song_visual_settings WHERE song_key=$1',[songKey]);await db.query('COMMIT');}catch(e){await db.query('ROLLBACK');throw e;}return {ok:true,action};}const t=await db.query(\"SELECT table_name FROM information_schema.tables WHERE table_schema='radio' AND table_name=ANY($1::text[])\",[TABLES]);return {ok:true,action:'status',tableCount:t.rowCount};}finally{await db.end();}}\nexport async function handler(event,context){if(event?.__stashboxDirectMigration==='VE-10B'&&event?.nonce===NONCE)return migration(event);return original.handler(event,context);}\n`;
          fs.writeFileSync('/tmp/prod-bridge/ve10b-bridge.mjs', source);
          NODE
          node --check /tmp/prod-bridge/ve10b-bridge.mjs
          (cd /tmp/prod-bridge && zip -qr /tmp/prod-bridge.zip .)

      - name: Temporarily install bridge, migrate, prove, and restore
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_SHA="$(jq -r '.Configuration.CodeSha256' /tmp/prod-before.json)"
          PROD_TOKEN="$(jq -r '.Configuration.Environment.Variables.ADMIN_TOKEN // .Configuration.Environment.Variables.RADIO_ADMIN_TOKEN // empty' /tmp/prod-before.json)"
          MIGRATION_NONCE="$(cat /tmp/migration-nonce)"
          test -n "$PROD_TOKEN"; test -n "$MIGRATION_NONCE"
          export PROD_TOKEN MIGRATION_NONCE
          code_changed=0
          handler_changed=0
          restore() {
            set +e
            if [ "$handler_changed" = "1" ]; then
              aws lambda update-function-configuration --function-name "$PROD_FUNCTION" --handler index.handler --region "$AWS_REGION" >/dev/null
              aws lambda wait function-updated --function-name "$PROD_FUNCTION" --region "$AWS_REGION" >/dev/null 2>&1
              handler_changed=0
            fi
            if [ "$code_changed" = "1" ]; then
              aws lambda update-function-code --function-name "$PROD_FUNCTION" --zip-file fileb:///tmp/prod-original.zip --region "$AWS_REGION" >/dev/null
              aws lambda wait function-updated --function-name "$PROD_FUNCTION" --region "$AWS_REGION" >/dev/null 2>&1
              code_changed=0
            fi
            set -e
          }
          trap restore EXIT

          aws lambda update-function-code --function-name "$PROD_FUNCTION" --zip-file fileb:///tmp/prod-bridge.zip --region "$AWS_REGION" >/dev/null
          code_changed=1
          aws lambda wait function-updated --function-name "$PROD_FUNCTION" --region "$AWS_REGION"
          aws lambda update-function-configuration --function-name "$PROD_FUNCTION" --handler ve10b-bridge.handler --region "$AWS_REGION" >/dev/null
          handler_changed=1
          aws lambda wait function-updated --function-name "$PROD_FUNCTION" --region "$AWS_REGION"

          PAYLOAD="$(jq -nc --arg nonce "$MIGRATION_NONCE" --arg song "$TEST_SONG" '{__stashboxDirectMigration:"VE-10B",nonce:$nonce,action:"migrate",songKey:$song}')"
          aws lambda invoke --function-name "$PROD_FUNCTION" --region "$AWS_REGION" --cli-binary-format raw-in-base64-out --payload "$PAYLOAD" /tmp/migrate.json > /tmp/migrate-meta.json
          test -z "$(jq -r '.FunctionError // empty' /tmp/migrate-meta.json)"
          jq -e '.ok == true and .tableCount == 3' /tmp/migrate.json >/dev/null
          HAD_SETTINGS="$(jq -r '.hadSettings // 0' /tmp/migrate.json)"
          jq '{ok,created,tableCount,hadSettings}' /tmp/migrate.json > ve10b-prod-migration-result.json
          echo 'VE-10B PROD tables are present.'

          proof_status=0
          node <<'NODE' || proof_status=$?
          const fs=require('fs');const {execFileSync}=require('child_process');
          const API=process.env.PROD_API,token=process.env.PROD_TOKEN,bucket=process.env.PROD_BUCKET,cdn=process.env.PROD_CDN,songKey=process.env.TEST_SONG;
          const marker=`__canonical_visual_prod_proof_${Date.now()}__`;const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl6ZqgAAAAASUVORK5CYII=','base64');
          const report={marker,startedAt:new Date().toISOString(),steps:{},cleanup:{}};let folder=null,originalFolder=null,folderChanged=false,assetId='',uploadedKey='';
          function unwrap(v){for(let i=0;i<3;i++){if(v&&typeof v==='object'&&typeof v.body==='string'){try{v=JSON.parse(v.body);continue}catch{}}break}return v}
          async function req(path,opt={}){const method=String(opt.method||'GET').toUpperCase();const r=await fetch(API+path,{...opt,method,headers:{'x-admin-token':token,accept:'application/json',...(opt.body?{'content-type':'application/json'}:{}),...(opt.headers||{})},cache:method==='GET'?'no-store':undefined});const t=await r.text();let b;try{b=unwrap(t?JSON.parse(t):{})}catch{b=t}if(!r.ok||b?.success===false)throw new Error(`${method} ${path} -> ${r.status} ${typeof b==='string'?b:JSON.stringify(b)}`);return b}
          async function pub(path){const r=await fetch(API+path,{headers:{accept:'application/json','cache-control':'no-cache'},cache:'no-store'});const t=await r.text();let b;try{b=unwrap(t?JSON.parse(t):{})}catch{b=t}if(!r.ok)throw new Error(`GET ${path} -> ${r.status}`);return b}
          const rows=(b,ks)=>{if(Array.isArray(b))return b;for(const k of ks)if(Array.isArray(b?.[k]))return b[k];return[]};const fid=f=>String(f?.id||f?.folder_id||''),fslug=f=>String(f?.folder_slug||f?.slug||'');
          const fp=(f,notes)=>({folder_name:f.folder_name||f.name||'',folder_type:f.folder_type||f.type||'general',description:f.description||'',status:f.status||'active',priority:f.priority||'medium',notes:notes===undefined?(f.notes||''):notes,relevant_artists:Array.isArray(f.relevant_artists)?f.relevant_artists:[],relevant_genres:Array.isArray(f.relevant_genres)?f.relevant_genres:[],relevant_moods:Array.isArray(f.relevant_moods)?f.relevant_moods:[],relevant_songs:Array.isArray(f.relevant_songs)?f.relevant_songs:[]});
          (async()=>{try{const songs=rows(await req('/admin/songs'),['songs','items','rows','data']);if(!songs.some(s=>String(s.song_key||'')===songKey))throw new Error('Proof song missing.');const folders=rows(await req('/admin/visuals/folders'),['folders','items','rows','data']);folder=folders.find(f=>fslug(f)==='dean-skateboarding-boardwalk-beach')||folders[0];if(!folder)throw new Error('No PROD visual folder.');const id=fid(folder);originalFolder=fp(folder);await req(`/admin/visuals/folders/${encodeURIComponent(id)}`,{method:'PUT',body:JSON.stringify(fp(folder,[originalFolder.notes,marker].filter(Boolean).join('\n')))});folderChanged=true;const fc=rows(await req('/admin/visuals/folders'),['folders','items','rows','data']).find(f=>fid(f)===id);if(!String(fc?.notes||'').includes(marker))throw new Error('Folder write missing.');report.steps.folderWrite='PASS';await req(`/admin/visuals/folders/${encodeURIComponent(id)}`,{method:'PUT',body:JSON.stringify(originalFolder)});folderChanged=false;report.steps.folderRestore='PASS';const before=await req(`/admin/songs/${encodeURIComponent(songKey)}/visual-settings`);const payload={order_mode:before.order_mode||'random',folder_mappings:rows(before,['folder_mappings']).map(x=>({folder_id:String(x.folder_id||''),inclusion_state:x.inclusion_state||'included'})).filter(x=>x.folder_id),asset_mappings:rows(before,['asset_mappings']).map(x=>({asset_id:String(x.asset_id||''),asset_scope:x.asset_scope==='direct'?'direct':'folder',inclusion_state:x.inclusion_state||'included',manual_order:x.manual_order??null})).filter(x=>x.asset_id)};await req(`/admin/songs/${encodeURIComponent(songKey)}/visual-settings`,{method:'PUT',body:JSON.stringify(payload)});const ps=await pub(`/radio/songs/${encodeURIComponent(songKey)}/visual-settings`);if(String(ps.song_key||'')!==songKey)throw new Error('Public mapping readback failed.');report.steps.visualSettingsWriteRead='PASS';const filename=`${marker}.png`;const pre=await req('/admin/uploads/presign',{method:'POST',body:JSON.stringify({filename,content_type:'image/png',purpose:'visual_folder_image',folder_slug:fslug(folder),folder_id:id})});const uploadUrl=String(pre.upload_url||pre.uploadUrl||''),publicUrl=String(pre.public_url||pre.publicUrl||'');uploadedKey=String(pre.key||pre.object_key||'');if(!uploadUrl||!publicUrl||!uploadedKey)throw new Error('Incomplete presign.');const uh=new URL(uploadUrl).hostname.toLowerCase(),ph=new URL(publicUrl).hostname.toLowerCase();if(!uh.includes(bucket))throw new Error('Not PROD upload bucket.');if(ph!==cdn&&!ph.includes(bucket))throw new Error('Not PROD public media.');const put=await fetch(uploadUrl,{method:String(pre.method||'PUT').toUpperCase(),headers:pre.headers||{'Content-Type':'image/png'},body:png});if(!put.ok)throw new Error(`S3 PUT ${put.status}`);report.steps.presignAndS3Upload='PASS';const created=await req(`/admin/visuals/folders/${encodeURIComponent(id)}/assets`,{method:'POST',body:JSON.stringify({asset_type:'image',file_name:filename,s3_key:uploadedKey,public_url:publicUrl,thumbnail_url:publicUrl,content_type:'image/png',size_bytes:png.length,width:1,height:1,ratio_label:'1:1',caption:marker,alt_text:'Canonical Video Library production proof',notes:marker,shopify_product_urls:[]})});const a=created.asset||created.data||created;assetId=String(a.id||a.asset_id||'');if(!assetId)throw new Error('No asset id.');const pa=rows(await pub(`/radio/visuals/folders/${encodeURIComponent(id)}/assets`),['assets','items','rows','data']);if(!pa.some(x=>String(x.id||x.asset_id||'')===assetId||String(x.public_url||x.url||'')===publicUrl))throw new Error('Proof asset missing publicly.');report.steps.assetRegisterAndPublicRead='PASS';await req(`/admin/visuals/folders/${encodeURIComponent(id)}/assets/${encodeURIComponent(assetId)}`,{method:'DELETE'});assetId='';report.steps.assetHide='PASS';execFileSync('aws',['s3api','delete-object','--region',process.env.AWS_REGION,'--bucket',bucket,'--key',uploadedKey],{stdio:'pipe'});uploadedKey='';report.steps.s3Cleanup='PASS';report.success=true;}finally{if(folderChanged&&folder&&originalFolder){try{await req(`/admin/visuals/folders/${encodeURIComponent(fid(folder))}`,{method:'PUT',body:JSON.stringify(originalFolder)});report.cleanup.folder='restored'}catch(e){report.cleanup.folder=`FAILED: ${e.message}`}}if(assetId&&folder){try{await req(`/admin/visuals/folders/${encodeURIComponent(fid(folder))}/assets/${encodeURIComponent(assetId)}`,{method:'DELETE'});report.cleanup.asset='hidden'}catch(e){report.cleanup.asset=`FAILED: ${e.message}`}}if(uploadedKey){try{execFileSync('aws',['s3api','delete-object','--region',process.env.AWS_REGION,'--bucket',bucket,'--key',uploadedKey],{stdio:'pipe'});report.cleanup.s3='deleted'}catch(e){report.cleanup.s3=`FAILED: ${e.message}`}}report.finishedAt=new Date().toISOString();fs.writeFileSync('canonical-video-library-prod-proof.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));}})().catch(e=>{console.error(e);process.exit(1)});
          NODE

          cleanup_status=0
          if [ "$HAD_SETTINGS" = "0" ]; then
            CLEAN="$(jq -nc --arg nonce "$MIGRATION_NONCE" --arg song "$TEST_SONG" '{__stashboxDirectMigration:"VE-10B",nonce:$nonce,action:"cleanup-proof-song",songKey:$song}')"
            aws lambda invoke --function-name "$PROD_FUNCTION" --region "$AWS_REGION" --cli-binary-format raw-in-base64-out --payload "$CLEAN" /tmp/cleanup.json > /tmp/cleanup-meta.json || cleanup_status=$?
            if [ "$cleanup_status" = "0" ] && [ -n "$(jq -r '.FunctionError // empty' /tmp/cleanup-meta.json)" ]; then cleanup_status=1; fi
            if [ "$cleanup_status" = "0" ]; then jq -e '.ok == true' /tmp/cleanup.json >/dev/null || cleanup_status=$?; fi
          fi

          # Restore handler first so the bridge file can then be removed safely.
          aws lambda update-function-configuration --function-name "$PROD_FUNCTION" --handler index.handler --region "$AWS_REGION" >/dev/null
          aws lambda wait function-updated --function-name "$PROD_FUNCTION" --region "$AWS_REGION"
          handler_changed=0
          aws lambda update-function-code --function-name "$PROD_FUNCTION" --zip-file fileb:///tmp/prod-original.zip --region "$AWS_REGION" >/dev/null
          aws lambda wait function-updated --function-name "$PROD_FUNCTION" --region "$AWS_REGION"
          code_changed=0

          FINAL_HANDLER="$(aws lambda get-function-configuration --function-name "$PROD_FUNCTION" --region "$AWS_REGION" --query Handler --output text)"
          FINAL_SHA="$(aws lambda get-function-configuration --function-name "$PROD_FUNCTION" --region "$AWS_REGION" --query CodeSha256 --output text)"
          test "$FINAL_HANDLER" = "index.handler"
          test "$FINAL_SHA" = "$ORIGINAL_SHA"
          STATUS="$(curl -sS -o /tmp/post-restore.json -w '%{http_code}' "$PROD_API/radio/songs/$TEST_SONG/visual-settings")"
          test "$STATUS" = "200"
          if [ "$cleanup_status" != "0" ]; then echo 'Proof mapping cleanup failed.' >&2; exit 1; fi
          if [ "$proof_status" != "0" ]; then echo 'Controlled PROD Video Library proof failed.' >&2; exit "$proof_status"; fi
          jq -e '.success == true' canonical-video-library-prod-proof.json >/dev/null
          echo 'VE-10B + controlled PROD Video Library proof PASSED; exact original Lambda restored.'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-video-library-prod-proof
          path: |
            prod-lambda-before-safe.json
            ve10b-prod-migration-result.json
            canonical-video-library-prod-proof.json
          if-no-files-found: warn
