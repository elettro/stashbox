name: Canonical Video Library Backend Audit

on:
  push:
    branches: [feature/canonical-video-library-1077]
    paths:
      - '.github/workflows/canonical-video-library-backend-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-prod-route:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      PROD_FUNCTION: stashbox-radio-api-prod-v2
      PROD_API: https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2
      TEST_SONG: petty-fuck-02b-stashbox
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Patch deployed package minimally and verify all contracts
        shell: bash
        run: |
          set -euo pipefail
          aws lambda get-function --function-name "$PROD_FUNCTION" --region "$AWS_REGION" > /tmp/before.json
          test "$(jq -r '.Configuration.Handler' /tmp/before.json)" = index.handler
          ORIGINAL_SHA="$(jq -r '.Configuration.CodeSha256' /tmp/before.json)"
          curl -fsSL "$(jq -r '.Code.Location' /tmp/before.json)" -o /tmp/original.zip
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg && unzip -q /tmp/original.zip -d /tmp/pkg
          export TARGET=""
          if [ -f /tmp/pkg/index-core.mjs ]; then TARGET=/tmp/pkg/index-core.mjs; elif [ -f /tmp/pkg/index.mjs ]; then TARGET=/tmp/pkg/index.mjs; else echo 'No Lambda source entry file found' >&2; exit 1; fi
          export TARGET
          python3 <<'PY'
          import os,re
          from pathlib import Path
          p=Path(os.environ['TARGET']); text=p.read_text()
          block="""  if (routeStartsWith(segments, ['radio', 'songs']) && isVisualSettingsRoute(event)) {\n    return handlePublicSongVisualSettingsRoute(event);\n  }\n\n"""
          generic="""  if ((method === 'GET') && (routeStartsWith(segments, ['radio', 'songs']) || routeStartsWith(segments, ['songs']))) {\n    return getSongs({ includeArchived: false });\n  }\n\n"""
          if block not in text or generic not in text: raise SystemExit('Expected deployed route blocks not found; refusing patch')
          if text.index(block)>text.index(generic):
              text=text.replace(block,'',1); text=text.replace(generic,block+generic,1); p.write_text(text)
              print('Moved public visual-settings route before generic songs route.')
          else: print('Route order already correct.')
          if text.count(block)!=1 or text.index(block)>text.index(generic): raise SystemExit('Route-order verification failed')
          PY
          node --check "$TARGET"
          (cd /tmp/pkg && zip -qr /tmp/patched.zip .)
          changed=0
          rollback(){ set +e; if [ "$changed" = 1 ]; then echo 'Verification failed; restoring exact original PROD Lambda package.'; aws lambda update-function-code --function-name "$PROD_FUNCTION" --zip-file fileb:///tmp/original.zip --region "$AWS_REGION" >/dev/null; aws lambda wait function-updated --function-name "$PROD_FUNCTION" --region "$AWS_REGION" >/dev/null 2>&1; fi; }
          trap rollback EXIT
          aws lambda update-function-code --function-name "$PROD_FUNCTION" --zip-file fileb:///tmp/patched.zip --region "$AWS_REGION" >/dev/null; changed=1
          aws lambda wait function-updated --function-name "$PROD_FUNCTION" --region "$AWS_REGION"
          sleep 2
          node <<'NODE'
          (async()=>{const API=process.env.PROD_API,song=process.env.TEST_SONG;const get=async p=>{const r=await fetch(API+p,{headers:{accept:'application/json','cache-control':'no-cache'},cache:'no-store'});const t=await r.text();let b;try{b=JSON.parse(t);if(typeof b?.body==='string')b=JSON.parse(b.body)}catch{b=t}if(!r.ok)throw new Error(`${p} -> ${r.status}`);return b};
          const catalog=await get('/radio/songs?limit=1');if(!Array.isArray(catalog.songs)&&!Array.isArray(catalog))throw new Error('Generic song catalog contract changed');
          const visual=await get(`/radio/songs/${encodeURIComponent(song)}/visual-settings`);if(visual.success!==true||visual.song_key!==song||!Array.isArray(visual.assets))throw new Error(`Visual-settings route not fixed: ${JSON.stringify(visual).slice(0,500)}`);
          const recipe=await get(`/radio/vec/recipe?song_key=${encodeURIComponent(song)}`);if(recipe?.success===false)throw new Error('VEC recipe regression');
          const assets=await get(`/radio/vec/song-assets?song_key=${encodeURIComponent(song)}`);if(assets?.success===false)throw new Error('VEC song-assets regression');
          console.log(JSON.stringify({success:true,visualSettings:{song_key:visual.song_key,assetCount:visual.assets.length},songCatalog:'PASS',vecRecipe:'PASS',vecSongAssets:'PASS'}));})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          changed=0
          FINAL_SHA="$(aws lambda get-function-configuration --function-name "$PROD_FUNCTION" --region "$AWS_REGION" --query CodeSha256 --output text)"
          test "$FINAL_SHA" != "$ORIGINAL_SHA"
          echo 'Surgical PROD visual-settings route-order patch is LIVE and verified.'
