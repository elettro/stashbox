name: Canonical Video Library Backend Audit

on:
  push:
    branches: [feature/canonical-video-library-1077]
    paths:
      - '.github/workflows/canonical-video-library-backend-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-wiring:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      PROD_FUNCTION: stashbox-radio-api-prod-v2
      API_ID: je3zud66nb
      PROD_API: https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Verify PROD is restored and inspect integration target
        shell: bash
        run: |
          set +e
          echo '=== function ==='
          aws lambda get-function-configuration --function-name "$PROD_FUNCTION" --region "$AWS_REGION" --query '{Handler:Handler,Runtime:Runtime,Version:Version,RevisionId:RevisionId,LastUpdateStatus:LastUpdateStatus}' --output json
          echo '=== normal public API ==='
          curl -sS -o /tmp/public.json -w 'HTTP=%{http_code}\n' "$PROD_API/radio/songs?limit=1"
          head -c 200 /tmp/public.json; echo
          echo '=== aliases ==='
          aws lambda list-aliases --function-name "$PROD_FUNCTION" --region "$AWS_REGION" --query 'Aliases[].{Name:Name,FunctionVersion:FunctionVersion}' --output json
          echo "aliases_exit=$?"
          echo '=== integrations ==='
          aws apigatewayv2 get-integrations --api-id "$API_ID" --region "$AWS_REGION" --query 'Items[].{IntegrationId:IntegrationId,IntegrationUri:IntegrationUri,PayloadFormatVersion:PayloadFormatVersion}' --output json
          echo "integrations_exit=$?"
          echo '=== stages ==='
          aws apigatewayv2 get-stages --api-id "$API_ID" --region "$AWS_REGION" --query 'Items[].{StageName:StageName,AutoDeploy:AutoDeploy,DeploymentId:DeploymentId}' --output json
          echo "stages_exit=$?"
          exit 0
