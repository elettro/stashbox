name: Canonical Video Library Parity

on:
  push:
    branches: [feature/canonical-video-library-1077]
    paths:
      - '.github/workflows/canonical-video-library-parity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build clean release from current main
        shell: bash
        run: |
          set -euo pipefail
          FEATURE=feature/canonical-video-library-1077
          RELEASE=release/canonical-video-library-1077
          git fetch origin main "$FEATURE"
          git checkout -B "$RELEASE" origin/main
          files=(
            radio-admin/admin-env.js
            radio-admin/video-library/index.html
            radio-admin/video-library/video-library.js
            radio-admin/video-library/duplicate-upload-safety.js
            radio/canonical-visual-source.js
            radio/index.html
            radio/desktop/index.html
            radio/dev/v2/index.html
            radio/dev/v2/desktop/index.html
            radio-api/index-core.mjs
          )
          git checkout "origin/$FEATURE" -- "${files[@]}"
          expected="$(printf '%s\n' "${files[@]}" | sort)"
          actual="$(git diff --name-only origin/main | sort)"
          echo 'Release diff:'; printf '%s\n' "$actual"
          test "$actual" = "$expected"
          test "$(git diff --name-only origin/main | grep -c '^\.github/' || true)" -eq 0
          node --check radio/canonical-visual-source.js
          node --check radio-admin/admin-env.js
          node --check radio-admin/video-library/video-library.js
          node --check radio-admin/video-library/duplicate-upload-safety.js
          grep -q 'CANONICAL LIVE VISUALS' radio-admin/video-library/index.html
          grep -q 'One LIVE visual library · PROD + DEV/V2' radio-admin/video-library/index.html
          grep -q 'productionVisualWritesApproved: true' radio-admin/admin-env.js
          grep -q 'productionWritesApproved: false' radio-admin/admin-env.js
          grep -q 'stagingProdWritesAllowed: false' radio-admin/admin-env.js
          if grep -Eq 'MIGRATION STAGING|DEV visual folders|New DEV Folder|PROD locked|hard-bound to TRUE DEV' radio-admin/video-library/index.html; then echo 'Stale DEV UI in release' >&2; exit 1; fi
          python3 <<'PY'
          from pathlib import Path
          text=Path('radio-api/index-core.mjs').read_text()
          visual="if (routeStartsWith(segments, ['radio', 'songs']) && isVisualSettingsRoute(event))"
          generic="if ((method === 'GET') && (routeStartsWith(segments, ['radio', 'songs']) || routeStartsWith(segments, ['songs'])))"
          assert text.count(visual)==1
          assert text.index(visual)<text.index(generic)
          for p in ['radio/index.html','radio/desktop/index.html','radio/dev/v2/index.html','radio/dev/v2/desktop/index.html']:
              h=Path(p).read_text(); assert h.count('/radio/canonical-visual-source.js')==1, p
          print('Release source invariants PASS')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'Canonical Video Library: one LIVE PROD library for both players'
          git push --force-with-lease origin "$RELEASE"
