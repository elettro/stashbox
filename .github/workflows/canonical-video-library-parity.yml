name: Canonical Video Library Parity

on:
  push:
    branches: [feature/canonical-video-library-1077]
    paths:
      - '.github/workflows/canonical-video-library-parity.yml'
      - 'radio-admin/video-library/**'
      - 'radio-api/**'
      - 'radio/canonical-visual-source.js'
      - 'radio/**/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      DEV_FUNCTION: stashbox-radio-api-dev-v2
      PROD_FUNCTION: stashbox-radio-api-prod-v2
      DEV_API: https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev
      PROD_API: https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Audit deployed Lambda boundaries and protected visual APIs
        shell: bash
        run: |
          set -euo pipefail
          aws lambda get-function-configuration --function-name "$DEV_FUNCTION" --region "$AWS_REGION" > /tmp/dev.json
          aws lambda get-function-configuration --function-name "$PROD_FUNCTION" --region "$AWS_REGION" > /tmp/prod.json
          DEV_TOKEN="$(jq -r '.Environment.Variables.ADMIN_TOKEN // .Environment.Variables.RADIO_ADMIN_TOKEN // empty' /tmp/dev.json)"
          PROD_TOKEN="$(jq -r '.Environment.Variables.ADMIN_TOKEN // .Environment.Variables.RADIO_ADMIN_TOKEN // empty' /tmp/prod.json)"
          test -n "$DEV_TOKEN"; test -n "$PROD_TOKEN"
          export DEV_TOKEN PROD_TOKEN
          node <<'NODE'
          (async()=>{
            const fs=require('fs');
            const devCfg=JSON.parse(fs.readFileSync('/tmp/dev.json','utf8'));
            const prodCfg=JSON.parse(fs.readFileSync('/tmp/prod.json','utf8'));
            const safe=cfg=>{const e=cfg.Environment?.Variables||{};return {functionName:cfg.FunctionName,codeSha256:cfg.CodeSha256,lastModified:cfg.LastModified,runtime:cfg.Runtime,handler:cfg.Handler,revisionId:cfg.RevisionId,appEnv:e.APP_ENV||e.STAGE||e.ENVIRONMENT||'',pgSchema:e.PGSCHEMA||'',uploadBucket:e.UPLOAD_BUCKET||e.S3_BUCKET||e.RADIO_UPLOAD_BUCKET||'',uploadPublicBaseUrl:e.UPLOAD_PUBLIC_BASE_URL||''}};
            const DEV=process.env.DEV_API, PROD=process.env.PROD_API, tokens={DEV:process.env.DEV_TOKEN,PROD:process.env.PROD_TOKEN};
            function unwrap(v){for(let i=0;i<3;i++){if(v&&typeof v==='object'&&typeof v.body==='string'){try{v=JSON.parse(v.body);continue}catch{}}break}return v}
            async function req(label,base,path){const r=await fetch(base+path,{headers:{'x-admin-token':tokens[label],'accept':'application/json','cache-control':'no-cache'}});const t=await r.text();let b;try{b=unwrap(JSON.parse(t))}catch{b=t}return {status:r.status,body:b}}
            const rows=(b,ks)=>{if(Array.isArray(b))return b;for(const k of ks)if(Array.isArray(b?.[k]))return b[k];return[]};
            const devFoldersR=await req('DEV',DEV,'/admin/visuals/folders');
            const prodFoldersR=await req('PROD',PROD,'/admin/visuals/folders');
            const devFolders=rows(devFoldersR.body,['folders','visuals_folders','items','rows','data']);
            const prodFolders=rows(prodFoldersR.body,['folders','visuals_folders','items','rows','data']);
            let devAssets=0; const assetCounts=[];
            for(const f of devFolders){const id=String(f?.id||f?.folder_id||'');if(!id)continue;const r=await req('DEV',DEV,`/admin/visuals/folders/${encodeURIComponent(id)}/assets`);const a=rows(r.body,['assets','items','rows','data']);devAssets+=a.length;assetCounts.push({folderId:id,count:a.length,status:r.status});}
            const songsR=await req('DEV',DEV,'/admin/songs');const songs=rows(songsR.body,['songs','items','rows','data']);const sampleSong=String(songs[0]?.song_key||'');
            const devMap=sampleSong?await req('DEV',DEV,`/admin/visuals/song-folders/${encodeURIComponent(sampleSong)}`):{status:0};
            const prodMap=sampleSong?await req('PROD',PROD,`/admin/visuals/song-folders/${encodeURIComponent(sampleSong)}`):{status:0};
            const report={devLambda:safe(devCfg),prodLambda:safe(prodCfg),dev:{foldersStatus:devFoldersR.status,folderCount:devFolders.length,totalAssets:devAssets,assetCounts,mappingStatus:devMap.status},prod:{foldersStatus:prodFoldersR.status,folderCount:prodFolders.length,mappingStatus:prodMap.status},sampleSong,prodFoldersError:prodFoldersR.status>=400?prodFoldersR.body:null,prodMappingError:prodMap.status>=400?prodMap.body:null};
            fs.writeFileSync('canonical-video-library-backend-audit.json',JSON.stringify(report,null,2)+'\n');
            console.log(JSON.stringify(report,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-video-library-backend-audit
          path: canonical-video-library-backend-audit.json
