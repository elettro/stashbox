name: Canonical Video Library Parity

on:
  push:
    branches: [feature/canonical-video-library-1077]
    paths:
      - '.github/workflows/canonical-video-library-parity.yml'
      - 'radio-admin/video-library/**'
      - 'radio-admin/admin-env.js'
      - 'radio/canonical-visual-source.js'
      - 'radio/**/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject canonical visual guard into all player entry points
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('radio/index.html'),
              Path('radio/desktop/index.html'),
              Path('radio/dev/v2/index.html'),
              Path('radio/dev/v2/desktop/index.html'),
          ]
          visual = '<script src="/radio/canonical-visual-source.js"></script>'
          song_re = re.compile(r'(<script\s+src="/radio/canonical-song-source\.js[^\"]*"\s*></script>)')
          for path in files:
              text = path.read_text()
              if visual not in text:
                  new, count = song_re.subn(r'\1\n  ' + visual, text, count=1)
                  if count != 1:
                      raise SystemExit(f'{path}: canonical song source insertion anchor not found exactly once')
                  text = new
                  path.write_text(text)
              if text.count('/radio/canonical-visual-source.js') != 1:
                  raise SystemExit(f'{path}: expected exactly one canonical visual guard')
              song_pos = text.find('/radio/canonical-song-source.js')
              visual_pos = text.find('/radio/canonical-visual-source.js')
              vec_positions = [p for p in [text.find('v2-vec-player-controller.js'), text.find('v2-desktop-vec-core-loader.js'), text.find('v2-desktop.js')] if p >= 0]
              if song_pos < 0 or visual_pos < song_pos:
                  raise SystemExit(f'{path}: canonical visual guard is not after canonical song source')
              if vec_positions and visual_pos > min(vec_positions):
                  raise SystemExit(f'{path}: canonical visual guard loads after VEC runtime')
              print(f'{path}: canonical visual guard OK')
          PY

      - name: Static safety checks
        shell: bash
        run: |
          set -euo pipefail
          node --check radio/canonical-visual-source.js
          node --check radio-admin/admin-env.js
          node --check radio-admin/video-library/video-library.js
          node --check radio-admin/video-library/duplicate-upload-safety.js
          grep -q "getCanonicalVisualEnvironment" radio-admin/video-library/video-library.js
          grep -q "assertCanonicalVisualWriteApproved" radio-admin/video-library/video-library.js
          grep -q "radio_admin_token_prod" radio-admin/admin-env.js
          grep -q "productionVisualWritesApproved: true" radio-admin/admin-env.js
          grep -q "productionWritesApproved: false" radio-admin/admin-env.js
          grep -q "stagingProdWritesAllowed: false" radio-admin/admin-env.js
          if grep -q "getEnvironment('dev')" radio-admin/video-library/video-library.js; then
            echo 'Video Library still binds to DEV environment.' >&2; exit 1
          fi
          if grep -q '/admin/visuals/song-folders' radio-admin/video-library/video-library.js; then
            echo 'Removed/unsupported song-folders shim is still referenced.' >&2; exit 1
          fi
          grep -q '/admin/songs/.*visual-settings' radio-admin/video-library/video-library.js
          grep -q 'stashbox-radio-media-prod-us-east-1' radio-admin/video-library/video-library.js
          grep -q 'd34ez960394y8w.cloudfront.net' radio-admin/video-library/video-library.js
          grep -q 'stashbox-radio-media-dev-us-east-1' radio-admin/video-library/video-library.js
          grep -q 'Blocked Video Library upload because PROD presign returned a DEV media target' radio-admin/video-library/video-library.js
          for f in radio/index.html radio/desktop/index.html radio/dev/v2/index.html radio/dev/v2/desktop/index.html; do
            test "$(grep -o '/radio/canonical-visual-source.js' "$f" | wc -l)" -eq 1
          done

      - name: Prove canonical visual fetch routing
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const calls = [];
          const nativeFetch = async (input, init={}) => {
            const url = typeof input === 'string' ? input : input.url;
            calls.push({url, method:String(init.method || input?.method || 'GET').toUpperCase()});
            return new Response(JSON.stringify({success:true,url}), {status:200, headers:{'content-type':'application/json'}});
          };
          const window = {fetch:nativeFetch};
          const context = {window, location:{href:'https://stashbox.com/radio/dev/v2/'}, URL, AbortController, Headers, Response, setTimeout, clearTimeout, console};
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('radio/canonical-visual-source.js','utf8'), context);
          (async()=>{
            await window.fetch('https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev/radio/vec/recipe?song_key=test-song');
            if (!calls.at(-1).url.startsWith('https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2/radio/vec/recipe?')) throw new Error('DEV recipe did not route to PROD');
            await window.fetch('https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev/radio/visuals/folders/folder-1/assets');
            if (!calls.at(-1).url.includes('/prod-v2/radio/visuals/folders/folder-1/assets')) throw new Error('DEV folder assets did not route to PROD');
            await window.fetch('https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev/radio/songs/test-song/visual-settings');
            if (!calls.at(-1).url.includes('/prod-v2/radio/songs/test-song/visual-settings')) throw new Error('DEV visual settings did not route to PROD');
            const before = calls.length;
            await window.fetch('https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev/admin/stats/summary');
            if (calls.length !== before + 1 || !calls.at(-1).url.includes('/dev/admin/stats/summary')) throw new Error('Nonvisual DEV request was unexpectedly rewritten');
            let blocked = false;
            try { await window.fetch('https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev/radio/vec/recipe', {method:'POST'}); }
            catch (e) { blocked = /Blocked non-read visual player request/.test(String(e.message)); }
            if (!blocked) throw new Error('Non-read visual player request was not blocked');
            console.log('Canonical visual routing proof passed.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit player entry-point materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio/index.html radio/desktop/index.html radio/dev/v2/index.html radio/dev/v2/desktop/index.html
          if git diff --cached --quiet; then
            echo 'Player entry points already materialized.'
            exit 0
          fi
          git commit -m "Route both players through canonical PROD visuals"
          git push origin HEAD:feature/canonical-video-library-1077
