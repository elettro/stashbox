name: Canonical Video Library Parity

on:
  push:
    branches: [feature/canonical-video-library-1077]
    paths:
      - '.github/workflows/canonical-video-library-parity.yml'
      - 'radio-admin/video-library/**'
      - 'radio/canonical-visual-source.js'
      - 'radio/**/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit public DEV and PROD visual libraries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const DEV = 'https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev';
          const PROD = 'https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2';

          function unwrap(value) {
            let v = value;
            for (let i = 0; i < 3; i++) {
              if (v && typeof v === 'object' && typeof v.body === 'string') {
                try { v = JSON.parse(v.body); continue; } catch {}
              }
              break;
            }
            return v;
          }
          async function get(base, path) {
            const res = await fetch(base + path, {headers: {'cache-control':'no-cache'}});
            const text = await res.text();
            let body;
            try { body = JSON.parse(text); } catch { body = text; }
            body = unwrap(body);
            if (!res.ok) throw new Error(`${base}${path} -> ${res.status} ${String(text).slice(0,200)}`);
            return body;
          }
          function rows(body, keys) {
            if (Array.isArray(body)) return body;
            for (const key of keys) if (Array.isArray(body?.[key])) return body[key];
            return [];
          }
          const folderId = f => String(f?.id || f?.folder_id || f?.visual_folder_id || '');
          const folderSlug = f => String(f?.folder_slug || f?.slug || f?.folder_name || f?.name || '').toLowerCase();
          const songKey = s => String(s?.song_key || s?.songKey || s?.key || s?.id || '');
          const recipeFolders = r => {
            r = unwrap(r) || {};
            const recipe = r.recipe || r.vec_recipe || r.data?.recipe || r.data || r;
            const list = Array.isArray(recipe?.folders) ? recipe.folders : [];
            return list.map(folderId).filter(Boolean).sort();
          };

          const [devFoldersBody, prodFoldersBody, songsBody] = await Promise.all([
            get(DEV, '/radio/visuals/folders'),
            get(PROD, '/radio/visuals/folders'),
            get(PROD, '/radio/songs')
          ]);
          const devFolders = rows(devFoldersBody, ['folders','items','rows','data']);
          const prodFolders = rows(prodFoldersBody, ['folders','items','rows','data']);
          const songs = rows(songsBody, ['songs','items','rows','data']).map(songKey).filter(Boolean);

          async function inventory(base, folders) {
            const result = [];
            for (const folder of folders) {
              const id = folderId(folder);
              if (!id) continue;
              const body = await get(base, `/radio/visuals/folders/${encodeURIComponent(id)}/assets`);
              const assets = rows(body, ['assets','items','rows','data']);
              result.push({id, slug: folderSlug(folder), name: folder.folder_name || folder.name || '', assetCount: assets.length,
                assetIds: assets.map(a => String(a?.id || a?.asset_id || a?.s3_key || a?.public_url || '')).filter(Boolean).sort(),
                urls: assets.map(a => String(a?.public_url || a?.url || a?.asset_url || '')).filter(Boolean).sort()});
            }
            return result;
          }

          const [devInventory, prodInventory] = await Promise.all([
            inventory(DEV, devFolders), inventory(PROD, prodFolders)
          ]);

          const devBySlug = new Map(devInventory.map(f => [f.slug, f]));
          const prodBySlug = new Map(prodInventory.map(f => [f.slug, f]));
          const allSlugs = [...new Set([...devBySlug.keys(), ...prodBySlug.keys()])].sort();
          const folderDiff = allSlugs.map(slug => {
            const d = devBySlug.get(slug), p = prodBySlug.get(slug);
            return {slug, devId:d?.id||null, prodId:p?.id||null, devAssets:d?.assetCount??null, prodAssets:p?.assetCount??null,
              sameId:!!d&&!!p&&d.id===p.id, sameAssetIds:!!d&&!!p&&JSON.stringify(d.assetIds)===JSON.stringify(p.assetIds), sameUrls:!!d&&!!p&&JSON.stringify(d.urls)===JSON.stringify(p.urls)};
          });

          const recipeDiffs = [];
          for (const key of songs) {
            const [d,p] = await Promise.all([
              get(DEV, `/radio/vec/recipe?song_key=${encodeURIComponent(key)}`).catch(e => ({__error:e.message})),
              get(PROD, `/radio/vec/recipe?song_key=${encodeURIComponent(key)}`).catch(e => ({__error:e.message}))
            ]);
            const df = d?.__error ? [] : recipeFolders(d);
            const pf = p?.__error ? [] : recipeFolders(p);
            if (JSON.stringify(df) !== JSON.stringify(pf) || d?.__error || p?.__error) recipeDiffs.push({songKey:key, devFolders:df, prodFolders:pf, devError:d?.__error||null, prodError:p?.__error||null});
          }

          const report = {
            generatedAt: new Date().toISOString(),
            dev: {folderCount: devFolders.length, totalAssets: devInventory.reduce((n,f)=>n+f.assetCount,0)},
            prod:{folderCount: prodFolders.length, totalAssets: prodInventory.reduce((n,f)=>n+f.assetCount,0)},
            sharedFolderSlugs: allSlugs.filter(s=>devBySlug.has(s)&&prodBySlug.has(s)).length,
            devOnlyFolderSlugs: allSlugs.filter(s=>devBySlug.has(s)&&!prodBySlug.has(s)),
            prodOnlyFolderSlugs: allSlugs.filter(s=>!devBySlug.has(s)&&prodBySlug.has(s)),
            folderDiff,
            songCount: songs.length,
            recipeDiffCount: recipeDiffs.length,
            recipeDiffs
          };
          fs.writeFileSync('canonical-video-library-parity.json', JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify({
            dev: report.dev, prod: report.prod, sharedFolderSlugs:report.sharedFolderSlugs,
            devOnlyFolderSlugs:report.devOnlyFolderSlugs, prodOnlyFolderSlugs:report.prodOnlyFolderSlugs,
            songCount:report.songCount, recipeDiffCount:report.recipeDiffCount
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-video-library-parity
          path: canonical-video-library-parity.json
