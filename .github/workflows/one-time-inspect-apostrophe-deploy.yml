name: Inspect Apostrophe Fix Deployment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-inspect-apostrophe-deploy.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      TARGET_WORKFLOW: one-time-deploy-apostrophe-fix-and-retry-social-render.yml
      REPORT_PATH: deployment-reports/apostrophe-fix-deploy-status.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Wait for deployment workflow and capture status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${REPORT_PATH}")"

          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28')
          DEADLINE=$(( $(date +%s) + 4500 ))
          RUN_ID=""

          while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
            curl --fail --silent --show-error "${AUTH[@]}" \
              "${API}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=5" \
              > /tmp/target-runs.json

            RUN_ID=$(jq -r '.workflow_runs[0].id // empty' /tmp/target-runs.json)
            STATUS=$(jq -r '.workflow_runs[0].status // empty' /tmp/target-runs.json)
            if [ -n "${RUN_ID}" ] && [ "${STATUS}" = 'completed' ]; then
              break
            fi
            sleep 15
          done

          test -n "${RUN_ID}" || { echo 'Target deployment workflow run was not found.' >&2; exit 1; }

          curl --fail --silent --show-error "${AUTH[@]}" \
            "${API}/actions/runs/${RUN_ID}/jobs?per_page=20" \
            > /tmp/target-jobs.json

          RECORDED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg recorded_at "${RECORDED_AT}" \
            --slurpfile runs /tmp/target-runs.json \
            --slurpfile jobs /tmp/target-jobs.json '
              ($runs[0].workflow_runs[0] // null) as $run |
              {
                recorded_at: $recorded_at,
                workflow_found: ($run != null),
                latest_run: (if $run then {
                  id: $run.id,
                  status: $run.status,
                  conclusion: $run.conclusion,
                  event: $run.event,
                  head_sha: $run.head_sha,
                  run_number: $run.run_number,
                  created_at: $run.created_at,
                  updated_at: $run.updated_at,
                  html_url: $run.html_url
                } else null end),
                jobs: [($jobs[0].jobs // [])[] | {
                  id,
                  name,
                  status,
                  conclusion,
                  started_at,
                  completed_at,
                  html_url,
                  steps: [.steps[]? | {name, status, conclusion, number}]
                }]
              }
            ' > "${REPORT_PATH}"

      - name: Commit deployment status report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${REPORT_PATH}" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "${REPORT_PATH}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record apostrophe fix deployment status [skip ci]'
          git push origin HEAD:main
