name: One-time publish desktop controls to prod and dev

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-publish-desktop-controls-both.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh PROD and DEV desktop control loaders
        run: |
          python - <<'PY'
          from pathlib import Path

          prod = Path('radio/desktop/index.html')
          text = prod.read_text()
          text = text.replace('v2-desktop-video-fit-toggle.css?v=20260824-controlswap1', 'v2-desktop-video-fit-toggle.css?v=20260824-controls2')
          text = text.replace('v2-desktop-video-fit-toggle.js?v=20260821-fitfull5', 'v2-desktop-video-fit-toggle.js?v=20260824-controls2')
          text = text.replace('desktop-persistent-controls.js?v=20260824-playlist1', 'desktop-persistent-controls.js?v=20260824-controls2')
          text = text.replace('profilefavorites2-playlist1-controlswap1', 'profilefavorites2-playlist1-controlswap1-controls2')
          prod.write_text(text)

          dev = Path('radio/dev/v2/desktop/index.html')
          text = dev.read_text()
          text = text.replace('v2-desktop-video-fit-toggle.css?v=20260821-fitfull5', 'v2-desktop-video-fit-toggle.css?v=20260824-controls2')
          text = text.replace('v2-desktop-video-fit-toggle.js?v=20260821-fitfull5', 'v2-desktop-video-fit-toggle.js?v=20260824-controls2')
          text = text.replace('desktop-persistent-controls.js?v=20260818-boundary2', 'desktop-persistent-controls.js?v=20260824-controls2')
          text = text.replace('notificationsrepair4-profilefavorites2', 'notificationsrepair4-profilefavorites2-controls2')
          dev.write_text(text)
          PY
      - name: Commit both environments
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio/desktop/index.html radio/dev/v2/desktop/index.html
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'Publish desktop controls to prod and dev'
            git push origin main
          fi
