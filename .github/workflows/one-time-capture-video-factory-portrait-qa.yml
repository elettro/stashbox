name: One-Time Capture Video Factory Portrait QA

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-capture-video-factory-portrait-qa.yml'
      - 'radio-api/scripts/capture-video-factory-portrait-qa.mjs'

permissions:
  contents: write

jobs:
  capture-portrait-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_BASE: https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev
      ADMIN_TOKEN: ${{ secrets.STASHBOX_DEV_ADMIN_TOKEN }}
      OUTPUT_DIR: /tmp/video-factory-portrait-qa
      REPORT_PATH: radio-api/docs/VIDEO_FACTORY_PORTRAIT_VISUAL_QA.md
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Locate FFmpeg tools
        run: |
          set -euo pipefail
          FFMPEG_PATH="$(command -v ffmpeg)"
          FFPROBE_PATH="$(command -v ffprobe)"
          test -x "${FFMPEG_PATH}"
          test -x "${FFPROBE_PATH}"
          echo "FFMPEG_PATH=${FFMPEG_PATH}" >> "${GITHUB_ENV}"
          echo "FFPROBE_PATH=${FFPROBE_PATH}" >> "${GITHUB_ENV}"
          "${FFMPEG_PATH}" -version | head -1
          "${FFPROBE_PATH}" -version | head -1

      - name: Check capture script syntax
        run: node --check radio-api/scripts/capture-video-factory-portrait-qa.mjs

      - name: Download renders and extract QA frames
        run: node radio-api/scripts/capture-video-factory-portrait-qa.mjs

      - name: Upload visual QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-factory-portrait-visual-qa
          path: /tmp/video-factory-portrait-qa
          if-no-files-found: error
          retention-days: 14

      - name: Commit visual QA report
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${REPORT_PATH}"
          if ! git diff --cached --quiet; then
            git commit -m 'Record Video Factory portrait visual QA artifact'
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Require completed capture
        run: grep -q -- '- Status: completed' "${REPORT_PATH}"
