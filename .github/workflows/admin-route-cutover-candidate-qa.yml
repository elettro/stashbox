name: Unified Admin Route Candidate QA

on:
  push:
    branches:
      - feature/admin-unification-1077-cutover-candidate
    paths:
      - '.github/workflows/admin-route-cutover-candidate-qa.yml'
      - 'radio-admin/**'

permissions:
  contents: read

jobs:
  unified-admin-route-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out materialized route candidate
        uses: actions/checkout@v4
        with:
          ref: feature/admin-unification-1077-cutover-candidate
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify protected route trees and exact legacy preservation
        shell: bash
        run: |
          set -euo pipefail
          PRE_ROUTE_SHA='936e82885b00aaf392a9071f5cdf345a735c8e5e'

          git cat-file -e "${PRE_ROUTE_SHA}^{commit}"
          git diff --quiet "$PRE_ROUTE_SHA" HEAD -- radio-admin/dev

          # Staging functional files remain frozen. QA-test refinements are allowed
          # because those tests are what validate the materialized candidate.
          staging_functional_changes="$(git diff --name-only "$PRE_ROUTE_SHA" HEAD -- radio-admin/staging | grep -v '^radio-admin/staging/tests/' || true)"
          if [ -n "$staging_functional_changes" ]; then
            echo 'Unexpected staging functional changes since route materialization:' >&2
            echo "$staging_functional_changes" >&2
            exit 1
          fi

          git ls-tree -r "$PRE_ROUTE_SHA" radio-admin \
            | awk '$4 !~ /^radio-admin\/(dev|staging)\//' \
            | sed 's#radio-admin/#radio-admin/legacy/#' \
            | sort > /tmp/expected-legacy.txt
          git ls-tree -r HEAD radio-admin/legacy | sort > /tmp/actual-legacy.txt
          diff -u /tmp/expected-legacy.txt /tmp/actual-legacy.txt

          # Nested DEV fallbacks that historically lived below old root modules
          # must remain byte-for-byte available at their original URLs.
          diff -qr radio-admin/legacy/songs/dev radio-admin/songs/dev
          diff -qr radio-admin/legacy/artists/dev radio-admin/artists/dev
          diff -qr radio-admin/legacy/notifications/dev radio-admin/notifications/dev

      - name: Verify unified root shape and production write locks
        shell: bash
        run: |
          set -euo pipefail
          test -f radio-admin/index.html
          test -f radio-admin/admin-env.js
          for route in songs video-library vec video-factory ads notifications artists social-factory bugs system-health; do
            test -f "radio-admin/$route/index.html"
          done
          test -f radio-admin/legacy/index.html
          test -f radio-admin/dev/index.html
          test -f radio-admin/staging/index.html
          test -f radio-admin/songs/dev/index.html
          test -f radio-admin/artists/dev/index.html
          test -f radio-admin/notifications/dev/index.html

          test ! -e radio-admin/tests
          test ! -e radio-admin/cutover
          test ! -e radio-admin/CUTOVER-CHECKPOINT.md

          grep -q "mode: 'cutover-candidate'" radio-admin/admin-env.js
          grep -q "stagingRoot: '/radio-admin/'" radio-admin/admin-env.js
          grep -q "canonicalEnvironment: 'prod'" radio-admin/admin-env.js
          grep -q "currentAncientProd: '/radio-admin/legacy/'" radio-admin/admin-env.js
          grep -q 'productionCutoverApproved: false' radio-admin/admin-env.js
          grep -q 'productionWritesApproved: false' radio-admin/admin-env.js
          grep -q 'stagingProdWritesAllowed: false' radio-admin/admin-env.js
          grep -q 'writesAllowedInStaging: false' radio-admin/admin-env.js
          grep -q 'tokenStorageKey: '\''radio_admin_token_prod'\''' radio-admin/admin-env.js

          prod_block="$(sed -n '/prod: Object.freeze({/,/}),/p' radio-admin/admin-env.js)"
          echo "$prod_block" | grep -q 'legacyTokenStorageKeys: Object.freeze(\[\])'
          if echo "$prod_block" | grep -q 'stashbox_admin_token_dev'; then
            echo 'Canonical PROD Admin reintroduced the legacy DEV token fallback.' >&2
            exit 1
          fi

          if grep -R -n --exclude-dir=dev --exclude-dir=staging --exclude-dir=legacy '/radio-admin/staging/' radio-admin; then
            echo 'Unified root contains stale staging route links.' >&2
            exit 1
          fi

          if grep -E 'DEV ONLY|create and edit songs in DEV only|Upload Audio to DEV|DEV SONG CATALOG|Migration Staging' radio-admin/songs/index.html; then
            echo 'Promoted canonical Song CMS contains stale DEV-only copy.' >&2
            exit 1
          fi
          grep -q 'Canonical LIVE catalog' radio-admin/songs/index.html

          node --check radio-admin/admin-env.js
          node --check radio-admin/staging.js
          node --check radio-admin/songs/songs.js
          node --check radio-admin/songs/media.js
          node --check radio-admin/songs/artwork.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated candidate server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/admin-route-http.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/radio-admin/ >/dev/null && \
            curl --fail --silent http://127.0.0.1:4173/radio-admin/legacy/ >/dev/null && \
            curl --fail --silent http://127.0.0.1:4173/radio-admin/dev/ >/dev/null && \
            curl --fail --silent http://127.0.0.1:4173/radio-admin/songs/dev/ >/dev/null && \
            curl --fail --silent http://127.0.0.1:4173/radio-admin/artists/dev/ >/dev/null && \
            curl --fail --silent http://127.0.0.1:4173/radio-admin/notifications/dev/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/admin-route-http.log
          exit 1

      - name: Verify unified root operational modules start safely
        env:
          STAGING_QA_ROOT: http://127.0.0.1:4173/radio-admin
        run: node radio-admin/staging/tests/module-smoke.mjs

      - name: Verify root Song CMS reads canonical PROD and keeps writes locked
        env:
          ADMIN_QA_ROOT: http://127.0.0.1:4173/radio-admin
        run: node radio-admin/staging/tests/canonical-song-admin-cutover-smoke.mjs

      - name: Verify root, legacy, and DEV route navigation in browser
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));

          await page.goto('http://127.0.0.1:4173/radio-admin/', { waitUntil: 'domcontentloaded' });
          await page.locator('nav.topnav').waitFor();
          const rootHrefs = await page.locator('nav.topnav a').evaluateAll(nodes => nodes.map(node => node.getAttribute('href')));
          const expected = [
            '/radio-admin/',
            '/radio-admin/songs/',
            '/radio-admin/video-library/',
            '/radio-admin/vec/',
            '/radio-admin/video-factory/',
            '/radio-admin/ads/',
            '/radio-admin/notifications/',
            '/radio-admin/artists/',
            '/radio-admin/social-factory/',
            '/radio-admin/bugs/',
            '/radio-admin/system-health/'
          ];
          for (const href of expected) {
            if (!rootHrefs.includes(href)) throw new Error(`Unified root nav missing ${href}`);
          }
          if (rootHrefs.some(href => String(href).includes('/radio-admin/staging/'))) {
            throw new Error('Unified root nav still contains a staging link.');
          }

          await page.goto('http://127.0.0.1:4173/radio-admin/legacy/', { waitUntil: 'domcontentloaded' });
          const legacyTitle = await page.title();
          if (!legacyTitle.includes('Stashbox Radio Admin')) throw new Error(`Unexpected legacy title: ${legacyTitle}`);
          const adsHref = await page.locator('a.dev-admin-link').getAttribute('href');
          const resolvedAds = new URL(adsHref, page.url()).pathname;
          if (resolvedAds !== '/radio-admin/legacy/ads/') throw new Error(`Legacy Ads link resolves to ${resolvedAds}`);

          const fallbackRoutes = [
            '/radio-admin/dev/',
            '/radio-admin/songs/dev/',
            '/radio-admin/artists/dev/',
            '/radio-admin/notifications/dev/'
          ];
          for (const route of fallbackRoutes) {
            await page.goto(`http://127.0.0.1:4173${route}`, { waitUntil: 'domcontentloaded' });
            const body = (await page.locator('body').innerText()).trim();
            if (body.length < 100) throw new Error(`${route} rendered too little content.`);
          }

          if (errors.length) throw new Error(`Route page errors: ${errors.join(' | ')}`);
          await browser.close();
          console.log(JSON.stringify({ pass: true, rootHrefs, legacyAds: resolvedAds, fallbackRoutes }, null, 2));
          NODE
