name: Inspect Social Factory V05 Trigger Runs
# Refresh after the robust smoke-repair attempt.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-inspect-social-factory-v05-trigger-runs.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      REPORT_PATH: deployment-reports/social-factory-v05-trigger-runs.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Inspect target workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${REPORT_PATH}")"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          fetch_workflow() {
            local workflow="$1"
            local output="$2"
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${API}/actions/workflows/${workflow}/runs?per_page=5" \
              > "${output}"
          }

          fetch_workflow 'one-time-apply-social-factory-v05-smoke.yml' /tmp/smoke-runs.json
          fetch_workflow 'one-time-verify-social-factory-content-review.yml' /tmp/verify-runs.json
          fetch_workflow 'deploy-social-factory-api-dev.yml' /tmp/deploy-runs.json

          for target in smoke verify deploy; do
            RUN_ID=$(jq -r '.workflow_runs[0].id // empty' "/tmp/${target}-runs.json")
            if [ -n "${RUN_ID}" ]; then
              curl --fail --silent --show-error \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "${API}/actions/runs/${RUN_ID}/jobs?per_page=30" \
                > "/tmp/${target}-jobs.json"
            else
              printf '{"jobs":[]}' > "/tmp/${target}-jobs.json"
            fi
          done

          RECORDED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg recorded_at "${RECORDED_AT}" \
            --slurpfile smoke_runs /tmp/smoke-runs.json \
            --slurpfile smoke_jobs /tmp/smoke-jobs.json \
            --slurpfile verify_runs /tmp/verify-runs.json \
            --slurpfile verify_jobs /tmp/verify-jobs.json \
            --slurpfile deploy_runs /tmp/deploy-runs.json \
            --slurpfile deploy_jobs /tmp/deploy-jobs.json '
              def normalized($runs; $jobs):
                ($runs[0].workflow_runs[0] // null) as $run |
                {
                  run: (if $run then {
                    id: $run.id,
                    status: $run.status,
                    conclusion: $run.conclusion,
                    event: $run.event,
                    head_sha: $run.head_sha,
                    created_at: $run.created_at,
                    updated_at: $run.updated_at,
                    html_url: $run.html_url
                  } else null end),
                  jobs: [($jobs[0].jobs // [])[] | {
                    id,
                    name,
                    status,
                    conclusion,
                    steps: [.steps[]? | {name, status, conclusion, number}]
                  }]
                };
              {
                recorded_at: $recorded_at,
                smoke_patch: normalized($smoke_runs; $smoke_jobs),
                live_verification: normalized($verify_runs; $verify_jobs),
                social_factory_deploy: normalized($deploy_runs; $deploy_jobs)
              }
            ' > "${REPORT_PATH}"

      - name: Commit workflow inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "${REPORT_PATH}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Social Factory 0.5 workflow trigger status [skip ci]'
          git push origin HEAD:main
