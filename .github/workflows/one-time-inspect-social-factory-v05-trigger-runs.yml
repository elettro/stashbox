name: Inspect Social Factory V05 Trigger Runs
# Capture sanitized failure details for the latest smoke and verification runs.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-inspect-social-factory-v05-trigger-runs.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      REPORT_PATH: deployment-reports/social-factory-v05-trigger-runs.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Inspect target workflow runs and failure diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${REPORT_PATH}")"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28')

          fetch_workflow() {
            curl --fail --silent --show-error "${AUTH[@]}" \
              "${API}/actions/workflows/$1/runs?per_page=5" > "$2"
          }

          fetch_workflow 'one-time-apply-social-factory-v05-smoke.yml' /tmp/smoke-runs.json
          fetch_workflow 'one-time-verify-social-factory-content-review.yml' /tmp/verify-runs.json
          fetch_workflow 'deploy-social-factory-api-dev.yml' /tmp/deploy-runs.json

          for target in smoke verify deploy; do
            RUN_ID=$(jq -r '.workflow_runs[0].id // empty' "/tmp/${target}-runs.json")
            if [ -n "${RUN_ID}" ]; then
              curl --fail --silent --show-error "${AUTH[@]}" \
                "${API}/actions/runs/${RUN_ID}/jobs?per_page=30" > "/tmp/${target}-jobs.json"
              JOB_ID=$(jq -r '.jobs[0].id // empty' "/tmp/${target}-jobs.json")
              if [ -n "${JOB_ID}" ]; then
                curl --fail --location --silent --show-error "${AUTH[@]}" \
                  "${API}/actions/jobs/${JOB_ID}/logs" > "/tmp/${target}-logs.bin" || true
              fi
            else
              printf '{"jobs":[]}' > "/tmp/${target}-jobs.json"
            fi
          done

          python <<'PY'
          import io
          import re
          import zipfile
          from pathlib import Path

          def extract(name):
              source = Path(f'/tmp/{name}-logs.bin')
              target = Path(f'/tmp/{name}-diagnostic.txt')
              if not source.exists():
                  target.write_text('', encoding='utf-8')
                  return
              raw = source.read_bytes()
              if raw.startswith(b'PK'):
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                      text = '\n'.join(
                          archive.read(item).decode('utf-8', errors='replace')
                          for item in archive.namelist()
                          if not item.endswith('/')
                      )
              else:
                  text = raw.decode('utf-8', errors='replace')
              pattern = re.compile(
                  r'error|failed|failure|not found|expected|timed out|version|unauthorized|HTTP [45][0-9][0-9]|process completed',
                  re.IGNORECASE
              )
              lines = [line for line in text.splitlines() if pattern.search(line)]
              cleaned = '\n'.join(lines[-80:])
              cleaned = re.sub(r'(?i)(x-admin-token|authorization):?\s+\S+', r'\1: [REDACTED]', cleaned)
              cleaned = re.sub(r'(?<![A-Za-z0-9])[A-Za-z0-9_-]{40,}(?![A-Za-z0-9])', '[REDACTED]', cleaned)
              target.write_text(cleaned[:16000], encoding='utf-8')

          for name in ('smoke', 'verify', 'deploy'):
              extract(name)
          PY

          RECORDED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg recorded_at "${RECORDED_AT}" \
            --slurpfile smoke_runs /tmp/smoke-runs.json \
            --slurpfile smoke_jobs /tmp/smoke-jobs.json \
            --rawfile smoke_diagnostic /tmp/smoke-diagnostic.txt \
            --slurpfile verify_runs /tmp/verify-runs.json \
            --slurpfile verify_jobs /tmp/verify-jobs.json \
            --rawfile verify_diagnostic /tmp/verify-diagnostic.txt \
            --slurpfile deploy_runs /tmp/deploy-runs.json \
            --slurpfile deploy_jobs /tmp/deploy-jobs.json \
            --rawfile deploy_diagnostic /tmp/deploy-diagnostic.txt '
              def normalized($runs; $jobs; $diagnostic):
                ($runs[0].workflow_runs[0] // null) as $run |
                {
                  run: (if $run then {
                    id: $run.id,
                    status: $run.status,
                    conclusion: $run.conclusion,
                    event: $run.event,
                    head_sha: $run.head_sha,
                    created_at: $run.created_at,
                    updated_at: $run.updated_at,
                    html_url: $run.html_url
                  } else null end),
                  jobs: [($jobs[0].jobs // [])[] | {
                    id,
                    name,
                    status,
                    conclusion,
                    steps: [.steps[]? | {name, status, conclusion, number}]
                  }],
                  sanitized_diagnostic: $diagnostic
                };
              {
                recorded_at: $recorded_at,
                smoke_patch: normalized($smoke_runs; $smoke_jobs; $smoke_diagnostic),
                live_verification: normalized($verify_runs; $verify_jobs; $verify_diagnostic),
                social_factory_deploy: normalized($deploy_runs; $deploy_jobs; $deploy_diagnostic)
              }
            ' > "${REPORT_PATH}"

      - name: Commit workflow inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "${REPORT_PATH}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Social Factory 0.5 workflow trigger status [skip ci]'
          git push origin HEAD:main
