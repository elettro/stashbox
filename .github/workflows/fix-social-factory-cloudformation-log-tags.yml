name: Fix Social Factory CloudFormation Permissions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-social-factory-cloudformation-log-tags.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: fix-social-factory-cloudformation-permissions
  cancel-in-progress: false

jobs:
  fix-and-redeploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      STACK_NAME: stashbox-social-api-dev
      ROLE_NAME: stashbox-social-cloudformation-dev-role
      POLICY_NAME: StashboxSocialCloudFormationDev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Add scoped CloudFormation permissions to service role
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          LOG_GROUP_ARN="arn:aws:logs:${AWS_REGION}:${ACCOUNT_ID}:log-group:/aws/lambda/stashbox-social-*"
          LOG_STREAM_ARN="${LOG_GROUP_ARN}:*"
          SAM_TRANSFORM_ARN="arn:aws:cloudformation:${AWS_REGION}:aws:transform/Serverless-2016-10-31"

          aws iam get-role-policy \
            --role-name "${ROLE_NAME}" \
            --policy-name "${POLICY_NAME}" \
            --query PolicyDocument \
            --output json > /tmp/current-social-cfn-policy.json

          jq \
            --arg log_group "${LOG_GROUP_ARN}" \
            --arg log_stream "${LOG_STREAM_ARN}" \
            --arg sam_transform "${SAM_TRANSFORM_ARN}" '
              .Statement |= (
                map(
                  if .Sid == "ManageSocialFactoryLogs" then
                    .Resource = [$log_group, $log_stream]
                  else . end
                )
                | if any(.[]; .Sid == "UseServerlessTransform") then .
                  else . + [{
                    Sid: "UseServerlessTransform",
                    Effect: "Allow",
                    Action: "cloudformation:CreateChangeSet",
                    Resource: $sam_transform
                  }]
                  end
              )
            ' /tmp/current-social-cfn-policy.json > /tmp/updated-social-cfn-policy.json

          aws iam put-role-policy \
            --role-name "${ROLE_NAME}" \
            --policy-name "${POLICY_NAME}" \
            --policy-document file:///tmp/updated-social-cfn-policy.json

          sleep 10

      - name: Recover failed rollback when needed
        run: |
          set -euo pipefail

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          if [ "${STACK_STATUS}" = 'UPDATE_ROLLBACK_FAILED' ]; then
            aws cloudformation continue-update-rollback --stack-name "${STACK_NAME}"
            aws cloudformation wait stack-rollback-complete --stack-name "${STACK_NAME}"
          fi

          FINAL_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].StackStatus' \
            --output text)
          case "${FINAL_STATUS}" in
            UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE|CREATE_COMPLETE) ;;
            *) echo "Stack is not ready for deployment: ${FINAL_STATUS}" >&2; exit 1 ;;
          esac

      - name: Trigger Social Factory deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-social-factory-api-dev.yml --ref main
