name: Desktop V2 Pool Exhaustion Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-v2-pool-exhaustion-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch pool identity and exhaustion behavior
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'radio/dev/v2/desktop/desktop-vec2.js';
          let source = fs.readFileSync(path, 'utf8');
          const edits = [
            [
              "const key = `${asset.type}:${asset.id || asset.url}`.toLowerCase();",
              "const key = `${asset.type}:${canonical(asset.url) || asset.id}`.toLowerCase();"
            ],
            [
              "function assetKey(asset) { return asset ? `${asset.type}:${asset.id || asset.url}` : ''; }",
              "function assetKey(asset) { return asset ? `${asset.type}:${canonical(asset.url) || asset.id}` : ''; }"
            ],
            [
              "    const folder = state.currentAsset?.folderId || '';\n    if (folder) {",
              "    const currentKey = assetKey(state.currentAsset);\n    const withoutCurrent = currentKey ? candidates.filter(asset => assetKey(asset) !== currentKey) : candidates;\n    if (withoutCurrent.length) candidates = withoutCurrent;\n    const folder = state.currentAsset?.folderId || '';\n    if (folder) {"
            ],
            [
              "    const asset = pickNext();\n    if (!asset || assetKey(asset) === assetKey(state.currentAsset)) return null;",
              "    const asset = pickNext();\n    if (!asset) return null;"
            ]
          ];
          for (const [from, to] of edits) {
            if (!source.includes(from)) throw new Error(`Expected patch target missing: ${from}`);
            source = source.replace(from, to);
          }
          fs.writeFileSync(path, source);
          NODE
          node --check radio/dev/v2/desktop/desktop-vec2.js
          node radio/dev/v2/desktop/smoke-test.mjs
      - name: Commit pool exhaustion repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio/dev/v2/desktop/desktop-vec2.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix desktop VEC pool exhaustion and URL dedupe"
          git push
