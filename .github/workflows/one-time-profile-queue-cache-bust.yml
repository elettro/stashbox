name: One-time profile playlist queue cache bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-profile-queue-cache-bust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Cache bust persistent profile queue everywhere
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
            'radio/index.html': [
              ('/radio/v2-profile-queue.js?v=20260724-player66', '/radio/v2-profile-queue.js?v=20260824-profilequeue2'),
              ('profileoverlay1-profilefavorites2', 'profileoverlay1-profilefavorites2-profilequeue2'),
            ],
            'radio/desktop/index.html': [
              ('/radio/v2-profile-queue.js?v=20260819-profilequeue1', '/radio/v2-profile-queue.js?v=20260824-profilequeue2'),
              ('controlswap1-controls2', 'controlswap1-controls2-profilequeue2'),
            ],
            'radio/dev/v2/index.html': [
              ('/radio/dev/v2/v2-profile-queue.js?v=20260724-player66', '/radio/dev/v2/v2-profile-queue.js?v=20260824-profilequeue2'),
              ('profileoverlay1-profilefavorites2', 'profileoverlay1-profilefavorites2-profilequeue2'),
            ],
            'radio/dev/v2/desktop/index.html': [
              ('/radio/dev/v2/v2-profile-queue.js?v=20260819-profilequeue1', '/radio/dev/v2/v2-profile-queue.js?v=20260824-profilequeue2'),
              ('profilefavorites2-controls2', 'profilefavorites2-controls2-profilequeue2'),
            ],
          }

          for filename, replacements in changes.items():
              path = Path(filename)
              text = path.read_text()
              for before, after in replacements:
                  if before not in text and after not in text:
                      raise SystemExit(f'Missing expected cache-bust anchor in {filename}: {before}')
                  text = text.replace(before, after)
              path.write_text(text)
          PY
      - name: Commit player entry points
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio/index.html radio/desktop/index.html radio/dev/v2/index.html radio/dev/v2/desktop/index.html
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'Publish persistent profile playlist queue'
            git push origin main
          fi
