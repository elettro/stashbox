name: Radio V2 production access probe and rollback package

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.release-radio-v2-prod-access-probe'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      FUNCTION_NAME: stashbox-radio-api-prod-v2
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Capture current production Lambda package
        shell: bash
        run: |
          set -euo pipefail
          aws lambda get-function \
            --function-name "$FUNCTION_NAME" \
            --region "$AWS_REGION" > /tmp/get-function.json

          location="$(jq -r '.Code.Location // empty' /tmp/get-function.json)"
          test -n "$location"
          curl --fail --location --silent --show-error "$location" \
            -o /tmp/stashbox-radio-api-prod-v2-pre-v2.zip
          test -s /tmp/stashbox-radio-api-prod-v2-pre-v2.zip
          unzip -t /tmp/stashbox-radio-api-prod-v2-pre-v2.zip >/dev/null

          jq '{
            FunctionName:.Configuration.FunctionName,
            Runtime:.Configuration.Runtime,
            Handler:.Configuration.Handler,
            CodeSha256:.Configuration.CodeSha256,
            LastModified:.Configuration.LastModified,
            CodeSize:.Configuration.CodeSize,
            MemorySize:.Configuration.MemorySize,
            Timeout:.Configuration.Timeout,
            State:.Configuration.State,
            LastUpdateStatus:.Configuration.LastUpdateStatus
          }' /tmp/get-function.json > /tmp/stashbox-radio-api-prod-v2-pre-v2.json

      - name: Probe production Cognito read access
        id: cognito
        shell: bash
        run: |
          set +e
          aws cognito-idp list-user-pools --max-results 1 --region "$AWS_REGION" >/tmp/cognito-list.json 2>/tmp/cognito-error.txt
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "read_access=true" >> "$GITHUB_OUTPUT"
            echo "Cognito read access: PASS"
          else
            echo "read_access=false" >> "$GITHUB_OUTPUT"
            echo "Cognito read access: DENIED"
            cat /tmp/cognito-error.txt
          fi

      - name: Probe CloudFormation read access
        id: cfn
        shell: bash
        run: |
          set +e
          aws cloudformation describe-stacks --region "$AWS_REGION" --max-items 1 >/tmp/cfn-list.json 2>/tmp/cfn-error.txt
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "read_access=true" >> "$GITHUB_OUTPUT"
            echo "CloudFormation read access: PASS"
          else
            echo "read_access=false" >> "$GITHUB_OUTPUT"
            echo "CloudFormation read access: DENIED"
            cat /tmp/cfn-error.txt
          fi

      - name: Upload production rollback package
        uses: actions/upload-artifact@v4
        with:
          name: radio-v2-prod-lambda-pre-release-rollback
          path: |
            /tmp/stashbox-radio-api-prod-v2-pre-v2.zip
            /tmp/stashbox-radio-api-prod-v2-pre-v2.json
          retention-days: 90

      - name: Probe summary
        run: |
          echo "Production Lambda rollback package: CAPTURED"
          echo "Cognito read access: ${{ steps.cognito.outputs.read_access }}"
          echo "CloudFormation read access: ${{ steps.cfn.outputs.read_access }}"
