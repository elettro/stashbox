name: Run First Social Factory Orchestrated Render

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-run-first-social-factory-orchestrated-render.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: first-social-factory-orchestrated-render
  cancel-in-progress: false

jobs:
  select-render-and-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: us-east-1
      SOCIAL_CONFIG_SECRET: stashbox/social-factory/dev/youtube-oauth/config
      SOCIAL_API_BASE: https://tnrca1ff32.execute-api.us-east-1.amazonaws.com/dev
      REPORT_PATH: deployment-reports/social-factory-first-orchestrated-render.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run first controlled Social Factory render
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$(dirname "${REPORT_PATH}")"

          aws secretsmanager get-secret-value \
            --secret-id "${SOCIAL_CONFIG_SECRET}" \
            --query SecretString \
            --output text > /tmp/social-config.json

          node <<'NODE'
          const fs = require('node:fs');

          const api = String(process.env.SOCIAL_API_BASE || '').replace(/\/+$/, '');
          const reportPath = process.env.REPORT_PATH;
          const config = JSON.parse(fs.readFileSync('/tmp/social-config.json', 'utf8'));
          const token = String(config.admin_token || '').trim();

          if (!token) throw new Error('Social Factory admin token is missing.');

          const headers = {
            accept: 'application/json',
            'x-admin-token': token
          };

          async function request(pathname, options = {}) {
            const response = await fetch(`${api}${pathname}`, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) }
            });
            const text = await response.text();
            let body = null;
            try { body = text ? JSON.parse(text) : null; }
            catch { body = { raw: text.slice(0, 500) }; }
            return { ok: response.ok, status: response.status, body };
          }

          function safeCandidate(song) {
            if (!song) return null;
            return {
              song_key: song.song_key || '',
              title: song.title || '',
              artist: song.artist || '',
              album_name: song.album_name || '',
              genre: song.genre || '',
              public_visibility: song.public_visibility || '',
              visual_readiness: song.visual_readiness || '',
              candidate_score: Number(song.candidate_score || 0),
              reasons: Array.isArray(song.reasons) ? song.reasons : []
            };
          }

          function safeJob(job) {
            if (!job) return null;
            const outputs = Array.isArray(job.outputs) ? job.outputs : [];
            return {
              id: job.id || '',
              batch_id: job.batch_id || '',
              song_key: job.song_key || '',
              song_title: job.song_title || '',
              artist: job.artist || '',
              status: job.status || '',
              active: Boolean(job.active),
              ready_for_staging: Boolean(job.ready_for_staging),
              duration_mode: job.duration_mode || '',
              duration_seconds: job.duration_seconds == null ? null : Number(job.duration_seconds),
              aspect_ratio: job.aspect_ratio || '',
              width: Number(job.width || 0),
              height: Number(job.height || 0),
              fps: Number(job.fps || 0),
              output_filename: job.output_filename || '',
              output_url: job.output_url || outputs[0]?.output_url || '',
              thumbnail_url: job.thumbnail_url || outputs[0]?.thumbnail_url || '',
              error_message: job.error_message || '',
              created_at: job.created_at || '',
              started_at: job.started_at || '',
              completed_at: job.completed_at || ''
            };
          }

          const report = {
            status: 'started',
            recorded_at: new Date().toISOString(),
            source_commit: process.env.GITHUB_SHA || '',
            social_api_base: api,
            selection_mode: 'highest-ranked-visible-song-with-visuals',
            requested_render: {
              duration_mode: 'promo',
              duration_seconds: 30,
              aspect_ratio: '9:16',
              fps: 30
            },
            selected_song: null,
            draft_job: null,
            launch: null,
            final_job: null,
            youtube_published: false,
            error: ''
          };

          try {
            const candidatesResult = await request('/social/orchestration/candidates?limit=25');
            if (!candidatesResult.ok || candidatesResult.body?.ok !== true) {
              throw new Error(`Candidate read failed: HTTP ${candidatesResult.status} ${JSON.stringify(candidatesResult.body)}`);
            }

            const candidates = Array.isArray(candidatesResult.body?.candidates)
              ? candidatesResult.body.candidates
              : [];

            const selected = candidates.find(song =>
              song.eligible === true &&
              song.public_visibility === 'visible' &&
              song.visual_readiness === 'indicated'
            ) || candidates.find(song =>
              song.eligible === true && song.public_visibility === 'visible'
            ) || candidates[0];

            if (!selected?.song_key) throw new Error('No eligible candidate song was returned.');
            report.selected_song = safeCandidate(selected);

            const draftResult = await request('/social/orchestration/render-jobs', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                song_key: selected.song_key,
                batch_name: `Social Factory First Orchestrated Render - ${selected.title || selected.song_key}`,
                client_name: 'Stashbox',
                project_name: 'Social Factory',
                campaign_name: 'First Orchestrated Render',
                duration_mode: 'promo',
                duration_seconds: 30,
                aspect_ratio: '9:16',
                fps: 30,
                intro_enabled: true,
                outro_enabled: true,
                corner_bug_enabled: true,
                include_artist: true,
                include_song: true,
                include_album: true,
                metadata_comment: 'Selected and prepared by Stashbox Social Factory'
              })
            });

            if (!draftResult.ok || !draftResult.body?.job?.id) {
              throw new Error(`Render draft failed: HTTP ${draftResult.status} ${JSON.stringify(draftResult.body)}`);
            }

            const jobId = draftResult.body.job.id;
            report.draft_job = safeJob(draftResult.body.job);

            const launchResult = await request(`/social/orchestration/render-jobs/${encodeURIComponent(jobId)}/launch`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ confirm_render: true })
            });

            report.launch = {
              http_status: launchResult.status,
              launched: launchResult.body?.launched === true,
              job_id: jobId,
              downstream_success: launchResult.body?.downstream?.success === true,
              message: launchResult.body?.downstream?.message || '',
              error: launchResult.body?.error || launchResult.body?.details?.downstream_error || ''
            };

            if (!launchResult.ok || launchResult.body?.launched !== true) {
              throw new Error(`Render launch failed: HTTP ${launchResult.status} ${JSON.stringify(launchResult.body)}`);
            }

            const terminal = new Set(['completed', 'failed', 'cancelled']);
            const deadline = Date.now() + 45 * 60 * 1000;

            while (Date.now() < deadline) {
              await new Promise(resolve => setTimeout(resolve, 15000));
              const jobResult = await request(`/social/orchestration/render-jobs/${encodeURIComponent(jobId)}`);
              if (!jobResult.ok || !jobResult.body?.job) continue;
              report.final_job = safeJob(jobResult.body.job);
              console.log(`Social Factory render status: ${report.final_job.status}`);
              if (terminal.has(report.final_job.status)) break;
            }

            if (!report.final_job) throw new Error('The render job could not be read after launch.');
            if (report.final_job.status !== 'completed') {
              throw new Error(`Render ended with status ${report.final_job.status}: ${report.final_job.error_message || 'No error message returned.'}`);
            }

            report.status = 'success';
          } catch (error) {
            report.status = 'failure';
            report.error = error.message;
          } finally {
            report.recorded_at = new Date().toISOString();
            fs.writeFileSync(reportPath, `${JSON.stringify(report, null, 2)}\n`);
            fs.rmSync('/tmp/social-config.json', { force: true });
          }

          if (report.error) process.exitCode = 1;
          NODE

      - name: Commit sanitized render report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${REPORT_PATH}" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "${REPORT_PATH}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record first Social Factory orchestrated render [skip ci]'
          git push origin HEAD:main
