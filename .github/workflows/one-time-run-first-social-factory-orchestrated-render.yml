name: Run First Social Factory Orchestrated Render

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-run-first-social-factory-orchestrated-render.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: first-social-factory-orchestrated-render
  cancel-in-progress: false

jobs:
  select-render-and-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: us-east-1
      SOCIAL_CONFIG_SECRET: stashbox/social-factory/dev/youtube-oauth/config
      SOCIAL_API_BASE: https://tnrca1ff32.execute-api.us-east-1.amazonaws.com/dev
      REPORT_PATH: deployment-reports/social-factory-first-orchestrated-render.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check controlled render runner syntax
        run: node --check social-factory-api/scripts/run-first-orchestrated-render.mjs

      - name: Run first controlled Social Factory render
        run: node social-factory-api/scripts/run-first-orchestrated-render.mjs

      - name: Commit sanitized render report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${REPORT_PATH}" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "${REPORT_PATH}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record first Social Factory orchestrated render [skip ci]'
          git push origin HEAD:main
