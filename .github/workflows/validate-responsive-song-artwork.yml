name: Validate Responsive Song Artwork

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-responsive-song-artwork.yml'
      - 'radio/dev/v2/v2-mobile-vec-flicker-guard.js'
      - 'radio/dev/v2/v2-mobile-vec-motion-override.js'
      - 'radio/dev/v2/v2-smart-player-title.js'
      - 'radio/dev/v2/index.html'
      - 'radio-api/scripts/audit-live-9x16-artwork.mjs'
      - 'radio-api/song-artwork-routes.mjs'
  schedule:
    - cron: '47 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  validate:
    name: Validate exact mobile artwork
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check current mobile presentation syntax
        run: |
          set -euo pipefail
          node --check radio/dev/v2/v2-mobile-vec-flicker-guard.js
          node --check radio/dev/v2/v2-mobile-vec-motion-override.js
          node --check radio/dev/v2/v2-smart-player-title.js
          node --check radio-api/scripts/audit-live-9x16-artwork.mjs

      - name: Verify strict no-fallback mobile policy
        run: |
          set -euo pipefail
          grep -q "mobile-exact-artwork-loading" radio/dev/v2/v2-mobile-vec-flicker-guard.js
          grep -q "mobileVecArtworkRatio = '9x16'" radio/dev/v2/v2-mobile-vec-flicker-guard.js
          grep -q "source_ratio.*9x16" radio/dev/v2/v2-mobile-vec-flicker-guard.js
          grep -q "v2-mobile-vec-flicker-guard.js?v=20260807-exact9x16-2" radio/dev/v2/index.html
          grep -q "mobile-vec-strict-9x16-20260807-130" radio/dev/v2/index.html
          if grep -Eq "PORTRAIT_ORDER|3x4.*4x5.*1x1|4x5.*3x4.*1x1" radio/dev/v2/v2-mobile-vec-flicker-guard.js; then
            echo 'Mobile exact artwork authority contains a forbidden fallback chain.' >&2
            exit 1
          fi

      - name: Audit exact 9x16 artwork for every live song
        env:
          VEC_API_BASE: https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev
          VEC_ORIGIN: https://stashbox.com
          ARTWORK_AUDIT_CONCURRENCY: '8'
        run: node radio-api/scripts/audit-live-9x16-artwork.mjs

      - name: Open or update exact-artwork incident
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Artwork Health] Exact mobile 9x16 coverage failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The strict mobile 9x16 validation failed on ${new Date().toISOString()}.\n\nEvidence: ${runUrl}`;
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
            const existing = found.data.items.find(item => item.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Close recovered exact-artwork incident
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Artwork Health] Exact mobile 9x16 coverage failure';
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
            const existing = found.data.items.find(item => item.title === title);
            if (!existing) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `Exact mobile 9x16 coverage recovered on ${new Date().toISOString()}.\n\nPassing evidence: ${runUrl}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            });
