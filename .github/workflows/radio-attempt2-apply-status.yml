name: Check Radio Attempt 2 data apply status

on:
  push:
    branches: [main]
    paths:
      - '.radio-attempt2-check-apply'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Read latest data apply workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/radio-attempt2-data-apply.yml/runs?per_page=5" \
            > /tmp/runs.json
          node <<'NODE' > /tmp/status.txt
          const fs=require('fs');
          const runs=JSON.parse(fs.readFileSync('/tmp/runs.json','utf8')).workflow_runs||[];
          console.log(`checked_utc=${new Date().toISOString()}`);
          for(const r of runs){
            console.log(`run_id=${r.id} status=${r.status} conclusion=${r.conclusion||''} head_sha=${r.head_sha} created_at=${r.created_at} updated_at=${r.updated_at}`);
          }
          NODE
          cat /tmp/status.txt
      - name: Record status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p radio/docs/diagnostics
            cp /tmp/status.txt radio/docs/diagnostics/ATTEMPT2_DATA_APPLY_STATUS.txt
            git add radio/docs/diagnostics/ATTEMPT2_DATA_APPLY_STATUS.txt
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record Radio Attempt 2 data apply status [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
