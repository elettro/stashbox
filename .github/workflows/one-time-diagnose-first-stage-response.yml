name: Diagnose First Stage Response

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-diagnose-first-stage-response.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      SOCIAL_CONFIG_SECRET: stashbox/social-factory/dev/youtube-oauth/config
      SOCIAL_API_BASE: https://tnrca1ff32.execute-api.us-east-1.amazonaws.com/dev
      JOB_ID: cc50acd7-014d-492f-89ac-682c8894240e
      REPORT_PATH: deployment-reports/social-factory-first-stage-diagnostic.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Capture stage response
        shell: bash
        run: |
          set -uo pipefail
          umask 077
          mkdir -p "$(dirname "${REPORT_PATH}")"

          aws secretsmanager get-secret-value \
            --secret-id "${SOCIAL_CONFIG_SECRET}" \
            --query SecretString \
            --output text > /tmp/social-config.json
          SOCIAL_ADMIN_TOKEN=$(jq -r '.admin_token' /tmp/social-config.json)

          HTTP_STATUS=$(curl --silent --show-error --max-time 300 \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "x-admin-token: ${SOCIAL_ADMIN_TOKEN}" \
            -d '{"confirm_stage":true}' \
            -o /tmp/stage-response.json \
            -w '%{http_code}' \
            "${SOCIAL_API_BASE}/social/orchestration/render-jobs/${JOB_ID}/stage")

          RECORDED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg recorded_at "${RECORDED_AT}" \
            --arg http_status "${HTTP_STATUS}" \
            --slurpfile response /tmp/stage-response.json '
              {
                recorded_at: $recorded_at,
                http_status: $http_status,
                response: $response[0],
                youtube_published: false
              }
            ' > "${REPORT_PATH}"

          rm -f /tmp/social-config.json /tmp/stage-response.json
          unset SOCIAL_ADMIN_TOKEN

      - name: Commit diagnostic response
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "${REPORT_PATH}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record first stage response diagnostic [skip ci]'
          git push origin HEAD:main
