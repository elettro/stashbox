name: Cut over Radio V2 production

on:
  push:
    branches: [main]
    paths:
      - '.release-radio-v2-cutover'

permissions:
  contents: write

concurrency:
  group: radio-v2-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    env:
      APPROVED_SOURCE_BRANCH: release/radio-v2-approved-20260822
      SITE: https://stashbox.com/radio
      API: https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2
    steps:
      - name: Checkout live main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Create immutable frontend rollback branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rollback_branch="rollback/radio-pre-v2-20260822-${GITHUB_SHA::7}"
          git branch "$rollback_branch" "$GITHUB_SHA"
          git push origin "$rollback_branch"
          echo "ROLLBACK_BRANCH=$rollback_branch" >> "$GITHUB_ENV"
          echo "Frontend rollback branch: $rollback_branch"

      - name: Overlay approved V2 candidate onto /radio/
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$APPROVED_SOURCE_BRANCH"
          rm -rf /tmp/radio-v2-approved
          git worktree add --detach /tmp/radio-v2-approved "origin/$APPROVED_SOURCE_BRANCH"
          test -f /tmp/radio-v2-approved/radio/v2/index.html
          test -f /tmp/radio-v2-approved/radio/v2/desktop/index.html
          test -f /tmp/radio-v2-approved/radio/v2/v2.js

          cp -a /tmp/radio-v2-approved/radio/v2/. radio/
          rm -f radio/PRODUCTION_BUILD_REPORT.txt

          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/radio-v2-approved/radio/v2')
          target = Path('radio')
          text_suffixes = {
              '.html', '.htm', '.js', '.mjs', '.cjs', '.css', '.json', '.md',
              '.txt', '.webmanifest', '.xml', '.sh', '.yml', '.yaml'
          }

          changed = 0
          for src in source.rglob('*'):
              if not src.is_file() or src.name == 'PRODUCTION_BUILD_REPORT.txt':
                  continue
              rel = src.relative_to(source)
              dst = target / rel
              if not dst.exists() or dst.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = dst.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              text = text.replace('/radio/v2/', '/radio/')
              text = text.replace('radio/v2/', 'radio/')
              if text != original:
                  dst.write_text(text, encoding='utf-8')
                  changed += 1

          Path('radio/V2_LIVE_RELEASE.txt').write_text(
              'Stashbox Radio V2 live release\n'
              'Approved source: release/radio-v2-approved-20260822\n'
              'Public path: /radio/\n'
              'API: https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2\n'
              f'Root-path rewrites: {changed}\n',
              encoding='utf-8'
          )
          PY

      - name: Run pre-push production safety scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/radio-v2-approved/radio/v2')
          target = Path('radio')
          text_suffixes = {
              '.html', '.htm', '.js', '.mjs', '.cjs', '.css', '.json', '.md',
              '.txt', '.webmanifest', '.xml', '.sh', '.yml', '.yaml'
          }
          forbidden = [
              'd21fbe6u80.execute-api.us-east-1.amazonaws.com/dev',
              '/radio/dev/',
              'stashbox_radio_dev_cognito_tokens',
              'stashbox-radio-rds-dev-session-id',
          ]
          errors = []
          for src in source.rglob('*'):
              if not src.is_file() or src.name == 'PRODUCTION_BUILD_REPORT.txt':
                  continue
              rel = src.relative_to(source)
              dst = target / rel
              if not dst.exists() or dst.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = dst.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for token in forbidden:
                  if token in text:
                      errors.append(f'{dst}: forbidden token {token}')
              if '/radio/v2/' in text or 'radio/v2/' in text:
                  errors.append(f'{dst}: candidate path remains after root cutover')
          if errors:
              raise SystemExit('\n'.join(errors[:100]))
          PY

          grep -q '<link rel="canonical" href="https://stashbox.com/radio/">' radio/index.html
          grep -q "https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2" radio/v2.js
          test -f radio/desktop/index.html
          test -f radio/profile/index.html
          test -f radio/artist/index.html
          echo 'Pre-push Radio V2 root safety scan: PASS'

      - name: Commit and push live cutover
        shell: bash
        run: |
          set -euo pipefail
          git add radio
          if git diff --cached --quiet; then
            echo 'No live Radio changes were produced.' >&2
            exit 1
          fi
          git commit -m 'Release Stashbox Radio V2 at /radio/'
          cutover_commit="$(git rev-parse HEAD)"
          echo "CUTOVER_COMMIT=$cutover_commit" >> "$GITHUB_ENV"
          git push origin HEAD:main
          echo "Cutover commit: $cutover_commit"

      - name: Wait for live /radio/ publication
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            code="$(curl -L -sS -o /tmp/live-root.html -w '%{http_code}' "${SITE}/?v2_live=${GITHUB_RUN_ID}" || true)"
            if [ "$code" = '200' ] \
              && grep -q 'stashbox-v2-build' /tmp/live-root.html \
              && ! grep -q '/radio/v2/' /tmp/live-root.html; then
              echo 'Live V2 root published.'
              exit 0
            fi
            echo "Waiting for live root, attempt ${i}, HTTP ${code}"
            sleep 5
          done
          echo 'Live V2 root did not publish correctly in time.' >&2
          exit 1

      - name: Smoke live Radio V2
        shell: bash
        run: |
          set -euo pipefail

          check_200() {
            local url="$1"
            local code
            code="$(curl -L -sS -o /tmp/live-response -w '%{http_code}' "$url")"
            echo "$url -> $code"
            test "$code" = '200'
          }

          for path in '/' '/desktop/' '/profile/' '/artist/' '/offline/'; do
            check_200 "${SITE}${path}?v2_live=${GITHUB_RUN_ID}"
          done

          for asset in \
            '/v2.js' \
            '/v2-session-manager.js' \
            '/v2-ads-cms-runtime.js' \
            '/v2-ads-fit-guard.js' \
            '/desktop/desktop-vec2.js' \
            '/profile/profile.js' \
            '/artist/artist.js'; do
            check_200 "${SITE}${asset}?v2_live=${GITHUB_RUN_ID}"
            if grep -q 'd21fbe6u80.execute-api.us-east-1.amazonaws.com/dev' /tmp/live-response; then
              echo "DEV API leaked into live asset ${asset}" >&2
              exit 1
            fi
            if grep -q '/radio/dev/' /tmp/live-response; then
              echo "DEV path leaked into live asset ${asset}" >&2
              exit 1
            fi
            if grep -q '/radio/v2/' /tmp/live-response; then
              echo "Candidate path leaked into live root asset ${asset}" >&2
              exit 1
            fi
          done

          for path in /radio/songs /radio/ad-settings /radio/ads /radio/auth/config; do
            code="$(curl -sS -o /tmp/api-response -w '%{http_code}' "${API}${path}")"
            echo "${path} -> ${code}"
            test "$code" = '200'
          done

          for path in /radio/me /radio/me/preferences; do
            code="$(curl -sS -o /tmp/api-response -w '%{http_code}' "${API}${path}")"
            echo "${path} -> ${code}"
            test "$code" = '401' -o "$code" = '403'
          done

          echo 'Live Radio V2 smoke: PASS'

      - name: Automatic rollback on failed live smoke
        if: ${{ failure() && env.CUTOVER_COMMIT != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B rollback-live origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit "$CUTOVER_COMMIT"
          git push origin HEAD:main
          echo "Live cutover failed and was automatically reverted. Rollback branch: $ROLLBACK_BRANCH"
