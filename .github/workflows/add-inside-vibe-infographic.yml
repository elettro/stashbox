name: Add Inside the Vibe Infographic

on:
  push:
    paths:
      - '.github/workflows/add-inside-vibe-infographic.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update blog
        run: python .github/scripts/add_inside_vibe_infographic.py
      - name: Commit change
        run: |
          git config user.name "elettro"
          git config user.email "dpalermo@elettro.com"
          git add radio/blog/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add Inside the Vibe Ecosystem infographic to blog"
          git pull --rebase origin main
          git push origin main
