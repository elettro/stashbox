name: Validate Social Factory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'social-factory-api/**'
      - '.github/workflows/deploy-social-factory-api-dev.yml'
      - '.github/workflows/diagnose-social-factory-validation.yml'
  push:
    paths:
      - 'social-factory-api/**'
      - '.github/workflows/deploy-social-factory-api-dev.yml'
      - '.github/workflows/diagnose-social-factory-validation.yml'

permissions:
  contents: read

concurrency:
  group: validate-social-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Check JavaScript syntax
        working-directory: social-factory-api
        run: npm run check

      - name: Run Social Factory tests
        working-directory: social-factory-api
        run: npm test

      - name: Validate SAM template
        working-directory: social-factory-api
        run: sam validate --template-file infrastructure/template.yaml --lint

      - name: Validate deployment policy JSON
        run: jq -e . aws-policies/StashboxSocialFactoryDevDeploy.json >/dev/null
