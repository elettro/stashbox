name: Desktop V2 Clean Live Health

on:
  push:
    branches: [main]
    paths:
      - 'radio/dev/v2/index.html'
      - 'radio/dev/v2/desktop/**'
      - 'radio-api/scripts/smoke-test-v2-desktop-clean-live.mjs'
      - '.github/workflows/desktop-v2-clean-live-health.yml'
  workflow_dispatch:

concurrency:
  group: desktop-v2-clean-live-health
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  desktop-clean-live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run structural smoke guard
        run: node radio/dev/v2/desktop/smoke-test.mjs

      - name: Install Playwright Chromium and Firefox
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium firefox

      - name: Allow DEV static deployment to settle
        if: github.event_name == 'push'
        run: sleep 90

      - name: Test deployed clean desktop runtime
        id: health
        continue-on-error: true
        env:
          V2_URL: https://stashbox.com/radio/dev/v2/
          VEC_API_BASE: https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev
          DESKTOP_HEALTH_SONG_TITLE: Freedom Street
          DESKTOP_HEALTH_OUTPUT_DIR: artifacts/desktop-v2-clean-health
          DESKTOP_HEALTH_TIMEOUT_MS: '60000'
        shell: bash
        run: |
          set +e
          code=1
          for attempt in 1 2 3; do
            echo "Desktop clean live-health attempt ${attempt}/3"
            rm -rf artifacts/desktop-v2-clean-health
            node radio-api/scripts/smoke-test-v2-desktop-clean-live.mjs
            code=$?
            if [ "$code" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 60
            fi
          done
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-v2-clean-health-${{ github.run_id }}
          path: artifacts/desktop-v2-clean-health
          if-no-files-found: warn
          retention-days: 14

      - name: Record passing live-health receipt
        if: steps.health.outputs.exit_code == '0'
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          mkdir -p radio/docs/ci
          node <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('artifacts/desktop-v2-clean-health/summary.json', 'utf8'));
          const receipt = {
            desktop_v2_clean_live_health: 'PASS',
            source_commit: process.env.SOURCE_SHA,
            passed_at_utc: new Date().toISOString(),
            build: summary.results?.[0]?.build || '',
            api: {
              ok: Boolean(summary.api?.ok),
              songKey: summary.api?.songKey || '',
              songTitle: summary.api?.songTitle || '',
              catalogCount: Number(summary.api?.catalogCount || 0),
              directAssetCount: Number(summary.api?.directAssetCount || 0),
              statuses: summary.api?.statuses || {},
            },
            browsers: (summary.results || []).map(result => ({
              browser: result.browser,
              ok: Boolean(result.grade?.ok),
              failures: result.grade?.failures || [],
              finalVecStatus: result.finalVec?.status || '',
              finalSongKey: result.finalVec?.songKey || '',
            })),
          };
          fs.writeFileSync('radio/docs/ci/desktop-v2-clean-live-health.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE
          git add radio/docs/ci/desktop-v2-clean-live-health.json
          git diff --cached --quiet && exit 0
          git commit -m "Record desktop V2 live health pass [skip ci]"
          git push

      - name: Open or update desktop clean health incident
        if: steps.health.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[Desktop V2 Health] Clean runtime failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let summary = {};
            try { summary = JSON.parse(fs.readFileSync('artifacts/desktop-v2-clean-health/summary.json', 'utf8')); } catch (_) {}
            const failures = [
              ...(summary.api?.failures || []).map(message => `- **DEV API:** ${message}`),
              ...(summary.results || []).flatMap(result => (result.grade?.failures || []).map(message => `- **${result.browser || 'browser'}:** ${message}`)),
            ];
            if (!failures.length) failures.push('- Live-health runner failed before producing a complete browser summary.');
            const body = [
              `Clean desktop V2 live health failed on ${new Date().toISOString()}.`,
              '',
              `Source commit: \`${context.sha}\``,
              ...failures,
              '',
              `Evidence: ${runUrl}`,
            ].join('\n');
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
            const existing = found.data.items.find(item => item.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Close recovered desktop clean health incident
        if: steps.health.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[Desktop V2 Health] Clean runtime failure';
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
            const existing = found.data.items.find(item => item.title === title);
            if (!existing) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `Clean desktop V2 live health recovered on ${new Date().toISOString()}.\n\nPassing evidence: ${runUrl}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Fail unhealthy live desktop runtime
        if: steps.health.outputs.exit_code != '0'
        run: exit 1
