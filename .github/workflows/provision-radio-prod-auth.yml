name: Provision Radio production auth

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.release-radio-v2-prod-auth'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      FUNCTION_NAME: stashbox-radio-api-prod-v2
      STACK_NAME: stashbox-radio-listener-auth-prod
      CFN_ROLE_NAME: stashbox-radio-cloudformation-prod-auth-role
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Capture production Lambda rollback package
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          aws lambda get-function --function-name "$FUNCTION_NAME" --region "$AWS_REGION" > /tmp/get-function.json
          location="$(jq -r '.Code.Location // empty' /tmp/get-function.json)"
          test -n "$location"
          curl --fail --location --silent --show-error "$location" -o /tmp/stashbox-radio-api-prod-v2-pre-v2.zip
          test -s /tmp/stashbox-radio-api-prod-v2-pre-v2.zip
          unzip -t /tmp/stashbox-radio-api-prod-v2-pre-v2.zip >/dev/null
          current_sha="$(jq -r '.Configuration.CodeSha256' /tmp/get-function.json)"
          echo "code_sha=$current_sha" >> "$GITHUB_OUTPUT"
          jq '{FunctionName:.Configuration.FunctionName,Runtime:.Configuration.Runtime,Handler:.Configuration.Handler,CodeSha256:.Configuration.CodeSha256,LastModified:.Configuration.LastModified,CodeSize:.Configuration.CodeSize,MemorySize:.Configuration.MemorySize,Timeout:.Configuration.Timeout,State:.Configuration.State,LastUpdateStatus:.Configuration.LastUpdateStatus}' /tmp/get-function.json > /tmp/stashbox-radio-api-prod-v2-pre-v2.json

      - name: Upload production Lambda rollback package
        uses: actions/upload-artifact@v4
        with:
          name: radio-v2-prod-lambda-pre-release-rollback
          path: |
            /tmp/stashbox-radio-api-prod-v2-pre-v2.zip
            /tmp/stashbox-radio-api-prod-v2-pre-v2.json
          retention-days: 90

      - name: Validate production Cognito template
        run: aws cloudformation validate-template --template-body file://infra/user-accounts/prod-cognito.yml --region "$AWS_REGION" >/dev/null

      - name: Deploy production Cognito stack through scoped service role
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          role_arn="arn:aws:iam::${account_id}:role/${CFN_ROLE_NAME}"
          test "$(aws iam get-role --role-name "$CFN_ROLE_NAME" --query 'Role.Arn' --output text)" = "$role_arn"

          current_status="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)"
          if [ "$current_status" = 'ROLLBACK_COMPLETE' ]; then
            aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "$AWS_REGION" --role-arn "$role_arn"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" --region "$AWS_REGION"
          fi

          aws cloudformation deploy \
            --template-file infra/user-accounts/prod-cognito.yml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --role-arn "$role_arn" \
            --no-fail-on-empty-changeset

      - name: Read production Cognito outputs through CloudFormation
        id: cognito
        shell: bash
        run: |
          set -euo pipefail
          status="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].StackStatus' --output text)"
          role_arn="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query 'Stacks[0].RoleARN' --output text)"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "$role_arn" = "arn:aws:iam::${account_id}:role/${CFN_ROLE_NAME}"
          case "$status" in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *) echo "Unexpected auth stack status: $status" >&2; exit 1 ;;
          esac
          pool_id="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue | [0]" --output text)"
          client_id="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='AppClientId'].OutputValue | [0]" --output text)"
          region="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" --query "Stacks[0].Outputs[?OutputKey=='CognitoRegion'].OutputValue | [0]" --output text)"
          test -n "$pool_id" && test "$pool_id" != "None"
          test -n "$client_id" && test "$client_id" != "None"
          test "$region" = "$AWS_REGION"
          echo "pool_id=$pool_id" >> "$GITHUB_OUTPUT"
          echo "client_id=$client_id" >> "$GITHUB_OUTPUT"
          echo "region=$region" >> "$GITHUB_OUTPUT"

      - name: Wire production Lambda to production Cognito
        shell: bash
        env:
          POOL_ID: ${{ steps.cognito.outputs.pool_id }}
          CLIENT_ID: ${{ steps.cognito.outputs.client_id }}
          COGNITO_REGION: ${{ steps.cognito.outputs.region }}
        run: |
          set -euo pipefail
          aws lambda get-function-configuration --function-name "$FUNCTION_NAME" --region "$AWS_REGION" > /tmp/prod-config-current.json
          jq --arg pool "$POOL_ID" --arg client "$CLIENT_ID" --arg region "$COGNITO_REGION" '.Environment.Variables + {COGNITO_USER_POOL_ID:$pool,COGNITO_APP_CLIENT_ID:$client,COGNITO_REGION:$region,COGNITO_ACCESS_TOKEN_MINUTES:"15",COGNITO_REFRESH_TOKEN_DAYS:"365"}' /tmp/prod-config-current.json > /tmp/prod-env-vars.json
          jq -n --slurpfile vars /tmp/prod-env-vars.json '{Variables:$vars[0]}' > /tmp/prod-environment.json
          aws lambda update-function-configuration --function-name "$FUNCTION_NAME" --region "$AWS_REGION" --environment file:///tmp/prod-environment.json >/tmp/lambda-auth-update.json
          aws lambda wait function-updated --function-name "$FUNCTION_NAME" --region "$AWS_REGION"

      - name: Verify production auth wiring
        shell: bash
        env:
          POOL_ID: ${{ steps.cognito.outputs.pool_id }}
          CLIENT_ID: ${{ steps.cognito.outputs.client_id }}
        run: |
          set -euo pipefail
          aws lambda get-function-configuration --function-name "$FUNCTION_NAME" --region "$AWS_REGION" > /tmp/prod-config-after-auth.json
          test "$(jq -r '.Environment.Variables.COGNITO_USER_POOL_ID' /tmp/prod-config-after-auth.json)" = "$POOL_ID"
          test "$(jq -r '.Environment.Variables.COGNITO_APP_CLIENT_ID' /tmp/prod-config-after-auth.json)" = "$CLIENT_ID"
          test "$(jq -r '.Environment.Variables.COGNITO_REGION' /tmp/prod-config-after-auth.json)" = "$AWS_REGION"
          test "$(jq -r '.Environment.Variables.PGSCHEMA // "radio"' /tmp/prod-config-after-auth.json)" = "radio"
          test "$(jq -r '.State' /tmp/prod-config-after-auth.json)" = "Active"
          test "$(jq -r '.LastUpdateStatus' /tmp/prod-config-after-auth.json)" = "Successful"

      - name: Production auth provisioned
        run: |
          echo "Production Cognito stack and Lambda wiring passed."
          echo "Rollback code SHA: ${{ steps.snapshot.outputs.code_sha }}"
