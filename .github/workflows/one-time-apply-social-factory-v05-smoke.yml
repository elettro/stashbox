name: Apply Social Factory V05 Deploy Smoke
# Robust health-contract repair. This version avoids multiline matching around shell continuations.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-apply-social-factory-v05-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Update Social Factory deployment health contract to version 0.5
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/deploy-social-factory-api-dev.yml')
          text = path.read_text(encoding='utf-8')

          text, version_count = re.subn(
              r'\.version == "0\.[0-9]+\.0" and',
              '.version == "0.5.0" and',
              text,
              count=1
          )
          if version_count != 1 and '.version == "0.5.0" and' not in text:
              raise SystemExit('Social Factory version assertion was not found.')

          old_scope = '.isolation.executionRoleScope == "cloudwatch-youtube-oauth-secrets-and-social-publish-bucket"'
          new_scope = '.isolation.executionRoleScope == "cloudwatch-youtube-oauth-secrets-social-publish-and-video-factory-read"'
          if old_scope in text:
              text = text.replace(old_scope, new_scope, 1)
          elif new_scope not in text:
              raise SystemExit('Social Factory execution role assertion was not found.')

          required_lines = [
              '            .isolation.radioApiBridgeSupported == true and',
              '            .isolation.renderStagingSupported == true and',
              '            .isolation.contentReviewSupported == true and',
              '            .isolation.reviewEditingSupported == true and',
              '            .isolation.securePreviewSupported == true and'
          ]
          anchor = '            .isolation.mainRadioApiDependency == false and'
          if anchor not in text:
              raise SystemExit('Social Factory isolation anchor was not found.')

          missing = [line for line in required_lines if line not in text]
          if missing:
              insertion = anchor + '\n' + '\n'.join(missing)
              text = text.replace(anchor, insertion, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -F '.version == "0.5.0"' .github/workflows/deploy-social-factory-api-dev.yml
          grep -F '.isolation.reviewEditingSupported == true' .github/workflows/deploy-social-factory-api-dev.yml
          grep -F '.isolation.securePreviewSupported == true' .github/workflows/deploy-social-factory-api-dev.yml
          grep -F 'cloudwatch-youtube-oauth-secrets-social-publish-and-video-factory-read' .github/workflows/deploy-social-factory-api-dev.yml

      - name: Commit corrected deployment health contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-social-factory-api-dev.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Social Factory deploy smoke to Content Review 0.5'
          git pull --rebase origin main
          git push origin HEAD:main
