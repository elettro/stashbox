name: Desktop V2 Media Probe

on:
  push:
    branches: [main]
    paths:
      - 'radio-api/scripts/probe-v2-desktop-media-live.mjs'
      - '.github/workflows/desktop-v2-media-probe.yml'
  workflow_dispatch:

concurrency:
  group: desktop-v2-media-probe
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  media-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Firefox support
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps firefox
      - name: Allow DEV static deployment to settle
        run: sleep 45
      - name: Probe live desktop media
        id: probe
        continue-on-error: true
        env:
          V2_URL: https://stashbox.com/radio/dev/v2/
          DESKTOP_HEALTH_SONG_TITLE: Freedom Street
          DESKTOP_MEDIA_PROBE_OUTPUT_DIR: artifacts/desktop-v2-media-probe
          DESKTOP_HEALTH_TIMEOUT_MS: '60000'
        run: node radio-api/scripts/probe-v2-desktop-media-live.mjs
      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-v2-media-probe-${{ github.run_id }}
          path: artifacts/desktop-v2-media-probe
          if-no-files-found: warn
          retention-days: 14
      - name: Publish media probe issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[Desktop V2 Probe] Browser media decoder';
            let text = '';
            try { text = fs.readFileSync('artifacts/desktop-v2-media-probe/summary.json', 'utf8'); } catch (_) { text = 'Probe did not produce summary JSON.'; }
            if (text.length > 55000) text = text.slice(0, 55000) + '\n...truncated';
            const body = `Source commit: \`${context.sha}\`\n\n\`\`\`json\n${text}\n\`\`\``;
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
            const existing = found.data.items.find(item => item.title === title);
            if (existing) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
      - name: Fail when probe fails
        if: steps.probe.outcome == 'failure'
        run: exit 1
