name: Radio share cache bump

on:
  push:
    branches: [main]
    paths:
      - '.radio-share-cache-bump'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bump share controller cache version
        shell: bash
        run: |
          set -euo pipefail
          for file in radio/dev/v2/desktop/index.html radio/desktop/index.html radio/attempt2/desktop/index.html; do
            sed -i 's/sharecopy3-hotkeyc1/sharecopy4-hotkeyc2-sharefix1/g' "$file"
          done
          grep -q 'sharecopy4-hotkeyc2-sharefix1' radio/dev/v2/desktop/index.html
          grep -q 'sharecopy4-hotkeyc2-sharefix1' radio/desktop/index.html
          grep -q 'sharecopy4-hotkeyc2-sharefix1' radio/attempt2/desktop/index.html
      - name: Commit cache bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio/dev/v2/desktop/index.html radio/desktop/index.html radio/attempt2/desktop/index.html
          git commit -m 'Bump desktop share controller cache after C/share repair [skip ci]'
          git push origin HEAD:main
