name: Refresh Video Factory Task Definition and Retry
# Trigger retry after confirming the prior Lambda task-definition revision is inactive.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-refresh-video-factory-task-definition-and-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-video-factory-task-definition-and-retry
  cancel-in-progress: false

jobs:
  refresh-and-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      AWS_REGION: us-east-1
      STACK_NAME: stashbox-video-factory-dev
      TRUE_DEV_LAMBDA_FUNCTION_NAME: stashbox-radio-api-dev-v2
      SOCIAL_CONFIG_SECRET: stashbox/social-factory/dev/youtube-oauth/config
      SOCIAL_API_BASE: https://tnrca1ff32.execute-api.us-east-1.amazonaws.com/dev
      REPORT_PATH: deployment-reports/social-factory-first-orchestrated-render.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Refresh Lambda with the active renderer task definition
        shell: bash
        run: |
          set -euo pipefail

          ACTIVE_TASK_DEFINITION=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='RenderTaskDefinitionArn'].OutputValue" \
            --output text)

          test -n "${ACTIVE_TASK_DEFINITION}" || { echo 'Active render task definition output is missing.' >&2; exit 1; }

          TASK_STATUS=$(aws ecs describe-task-definition \
            --task-definition "${ACTIVE_TASK_DEFINITION}" \
            --query 'taskDefinition.status' \
            --output text)
          test "${TASK_STATUS}" = 'ACTIVE' || { echo "Task definition is not active: ${TASK_STATUS}" >&2; exit 1; }

          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name "${TRUE_DEV_LAMBDA_FUNCTION_NAME}" \
            --query 'Environment.Variables' \
            --output json)
          if [ -z "${CURRENT_ENV}" ] || [ "${CURRENT_ENV}" = 'null' ]; then CURRENT_ENV='{}'; fi

          MERGED_ENV=$(printf '%s' "${CURRENT_ENV}" | jq -c \
            --arg task "${ACTIVE_TASK_DEFINITION}" \
            '. + {VIDEO_FACTORY_ECS_TASK_DEFINITION: $task}')
          jq -n --argjson variables "${MERGED_ENV}" '{Variables: $variables}' > /tmp/video-factory-lambda-env.json

          aws lambda update-function-configuration \
            --function-name "${TRUE_DEV_LAMBDA_FUNCTION_NAME}" \
            --environment file:///tmp/video-factory-lambda-env.json >/dev/null
          aws lambda wait function-updated --function-name "${TRUE_DEV_LAMBDA_FUNCTION_NAME}"

          EFFECTIVE_TASK_DEFINITION=$(aws lambda get-function-configuration \
            --function-name "${TRUE_DEV_LAMBDA_FUNCTION_NAME}" \
            --query 'Environment.Variables.VIDEO_FACTORY_ECS_TASK_DEFINITION' \
            --output text)
          test "${EFFECTIVE_TASK_DEFINITION}" = "${ACTIVE_TASK_DEFINITION}" || {
            echo 'Lambda task definition environment value did not update.' >&2
            exit 1
          }

          echo "ACTIVE_TASK_DEFINITION=${ACTIVE_TASK_DEFINITION}" >> "${GITHUB_ENV}"
          echo "Lambda now points to active task definition: ${ACTIVE_TASK_DEFINITION}"

      - name: Retry controlled Social Factory render
        shell: bash
        run: |
          set -euo pipefail
          node --check social-factory-api/scripts/run-first-orchestrated-render.mjs
          node social-factory-api/scripts/run-first-orchestrated-render.mjs

      - name: Commit sanitized render report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${REPORT_PATH}" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "${REPORT_PATH}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record task-definition-refreshed Social Factory render [skip ci]'
          git push origin HEAD:main

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Video Factory active task refresh'
            echo ''
            echo "- Active task definition: \`${ACTIVE_TASK_DEFINITION:-not-resolved}\`"
            echo '- YouTube publishing was not requested.'
            if [ -f "${REPORT_PATH}" ]; then
              echo "- Render status: \`$(jq -r '.status // "unknown"' "${REPORT_PATH}")\`"
              echo "- Song: \`$(jq -r '.selected_song.title // .final_job.song_title // "unknown"' "${REPORT_PATH}")\`"
              echo "- Output: \`$(jq -r '.final_job.output_url // ""' "${REPORT_PATH}")\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
