name: Admin Migration Staging QA

on:
  push:
    branches:
      - feature/admin-unification-1077
    paths:
      - 'radio-admin/staging/**'
      - '.github/workflows/admin-migration-staging-qa.yml'
  pull_request:
    paths:
      - 'radio-admin/staging/**'
      - '.github/workflows/admin-migration-staging-qa.yml'

permissions:
  contents: read

jobs:
  song-cms-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check staging JavaScript
        run: |
          node --check radio-admin/staging/admin-env.js
          node --check radio-admin/staging/staging.js
          node --check radio-admin/staging/songs/songs.js
          node --check radio-admin/staging/songs/media.js
          node --check radio-admin/staging/songs/artwork.js
          node --check radio-admin/staging/songs/editor-sync.js
          node --check radio-admin/staging/video-library/video-library.js
          node --check radio-admin/staging/vec/vec-controller.js
          node --check radio-admin/staging/video-factory/video-factory.js
          node --check radio-admin/staging/video-factory/video-factory-archive.js
          node --check radio-admin/staging/video-factory/video-factory-resolution-preview.js
          node --check radio-admin/staging/ads/ads.js
          node --check radio-admin/staging/notifications/app.js
          node --check radio-admin/staging/artists/artists.js
          node --check radio-admin/staging/system-health/dashboard-summary-freeze.js
          node --check radio-admin/staging/system-health/system-health.js
          node --check radio-admin/staging/tests/song-cms-smoke.mjs
          node --check radio-admin/staging/tests/module-smoke.mjs
          node --check radio-admin/staging/tests/ads-write-smoke.mjs
          node --check radio-admin/staging/tests/ads-upload-smoke.mjs
          node --check radio-admin/staging/tests/artists-write-smoke.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/admin-staging-http.log 2>&1 &
          echo $! > /tmp/admin-staging-http.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/radio-admin/staging/songs/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/radio-admin/staging/video-library/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/radio-admin/staging/vec/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/radio-admin/staging/video-factory/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/radio-admin/staging/ads/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/radio-admin/staging/notifications/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/radio-admin/staging/artists/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/radio-admin/staging/social-factory/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/radio-admin/staging/bugs/ >/dev/null \
              && curl --fail --silent http://127.0.0.1:4173/radio-admin/staging/system-health/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/admin-staging-http.log
          exit 1

      - name: Run Song CMS browser smoke test with mocked DEV API
        run: node radio-admin/staging/tests/song-cms-smoke.mjs

      - name: Run migrated module browser smoke test with mocked DEV APIs
        run: node radio-admin/staging/tests/module-smoke.mjs

      - name: Run DEV Ads settings and CRUD browser smoke test
        run: node radio-admin/staging/tests/ads-write-smoke.mjs

      - name: Run DEV Ads video upload browser smoke test
        run: node radio-admin/staging/tests/ads-upload-smoke.mjs

      - name: Run DEV Artist metadata browser smoke test
        run: node radio-admin/staging/tests/artists-write-smoke.mjs

      - name: Assert staging source has no direct PROD Song CMS write target
        run: |
          if grep -R "je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2/admin/songs" radio-admin/staging; then
            echo 'Direct PROD Song CMS target found in staging source.'
            exit 1
          fi

      - name: Assert Ads staging remains DEV-only and no fallback inventory is used
        run: |
          grep -q "d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev" radio-admin/staging/admin-env.js
          grep -q "assertWriteAllowed('dev', 'ads')" radio-admin/staging/ads/ads.js
          grep -q "stashbox-radio-media-dev-us-east-1" radio-admin/staging/ads/ads.js
          grep -q "Blocked Ads upload because DEV presign returned a PROD media target" radio-admin/staging/ads/ads.js
          if grep -R "stashbox_radio_dev_ads_v1\|stashbox_radio_dev_ads_settings_v1" radio-admin/staging/ads; then
            echo 'Legacy Ads browser fallback key found in staging Ads module.'
            exit 1
          fi

      - name: Assert Artist staging writes are DEV metadata only
        run: |
          grep -q "assertWriteAllowed('dev', 'artists')" radio-admin/staging/artists/artists.js
          if grep -R "prod-v2\|radio_admin_token_prod\|stashbox_radio_dev_cognito_tokens\|X-Cognito-Id-Token\|/admin/uploads/presign\|/access" radio-admin/staging/artists; then
            echo 'Artist staging contains a PROD, Cognito, upload, or delegated-access binding that is not approved in this pass.'
            exit 1
          fi

      - name: Assert Video Library staging stays DEV read-only
        run: |
          grep -q "/admin/visuals/folders" radio-admin/staging/video-library/video-library.js
          if grep -E "method:[[:space:]]*['\"](POST|PATCH|PUT|DELETE)['\"]" radio-admin/staging/video-library/video-library.js; then
            echo 'Write method found in read-only Video Library staging module.'
            exit 1
          fi
          if grep -R "je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2" radio-admin/staging/video-library; then
            echo 'PROD API target found in Video Library staging module.'
            exit 1
          fi

      - name: Assert Social Factory remains a separate DEV bridge
        run: |
          grep -q "/radio-admin/dev/social-factory/" radio-admin/staging/social-factory/index.html
          grep -q "separate DEV-only service" radio-admin/staging/social-factory/index.html
          if grep -R "prod-v2\|radio_admin_token_prod" radio-admin/staging/social-factory; then
            echo 'PROD binding found in Social Factory staging bridge.'
            exit 1
          fi

      - name: Upload QA screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-staging-song-cms-qa
          path: artifacts/admin-staging-song-cms-smoke.png
          if-no-files-found: ignore
          retention-days: 7
