name: Add Industry Usage Examples to Radio Blog

on:
  push:
    paths:
      - '.github/workflows/add-industry-usage-blog.yml'

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add Industry Usage Examples filter and cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import json

          path = Path('radio/blog/index.html')
          text = path.read_text(encoding='utf-8')

          filter_button = '<button class="filter" data-filter="industry-usage">Industry Usage Examples</button>'
          if filter_button not in text:
              old = '<button class="filter" data-filter="one-sheet">One-Sheets</button></div>'
              new = '<button class="filter" data-filter="one-sheet">One-Sheets</button>' + filter_button + '</div>'
              if old not in text:
                  raise SystemExit('Could not find One-Sheets filter insertion point')
              text = text.replace(old, new, 1)

          meta = [
              ('Industry Usage Ecosystem Overview','A high-level one-sheet showing industry applications for the Stashbox Radio ecosystem.','Industry-Uses-of-Stashbox-Radio-Ecosystem- (3).jpeg','industry ecosystem overview use cases'),
              ('Billboard Seasonal Campaign Mixer','A seasonal campaign example showing how a billboard-driven brand activation connects music, media and promotion.','Industry-Uses-of-Stashbox-Radio-Ecosystem- Billaboard Seasonal Campaign-mixer (18).jpeg','billboard seasonal campaign mixer advertising brand activation'),
              ('Billabong Event','An event-focused example showing how Stashbox Radio supports branded experiences, music and audience engagement.','Industry-Uses-of-Stashbox-Radio-Ecosystem- Billabong Event (19).jpeg','billabong event surf brand activation'),
              ('Billabong Surf Shop','A surf retail example connecting in-store music, branded content and commerce.','Industry-Uses-of-Stashbox-Radio-Ecosystem- Billabong surf Shop(17).jpeg','billabong surf shop retail music commerce'),
              ('Restaurant Franchise','A franchise restaurant example for centralized music, promotions and localized customer communication.','Industry-Uses-of-Stashbox-Radio-Ecosystem- Restaurant-franchise (12).jpeg','restaurant franchise multi location hospitality'),
              ('Local Store Campaign','A local retail campaign example built around targeted music, promotions and customer engagement.','Industry-Uses-of-Stashbox-Radio-Ecosystem- local store campaign(20).jpeg','local store campaign retail promotion'),
              ('Multi-Location Restaurant','A multi-location restaurant example showing centralized content with location-level flexibility.','Industry-Uses-of-Stashbox-Radio-Ecosystem- multi-locatin-restaurant-(15).jpeg','multi location restaurant hospitality franchise'),
              ('Restaurant','A restaurant use case for branded music, guest communication, offers and in-location media.','Industry-Uses-of-Stashbox-Radio-Ecosystem- restaurant(13).jpeg','restaurant hospitality dining branded radio'),
              ('Solar Sales','A solar sales example showing how a focused branded media channel supports education, leads and campaigns.','Industry-Uses-of-Stashbox-Radio-Ecosystem- solar-sales(8).jpeg','solar sales energy leads campaign'),
              ('Solar Campaign 3','A solar industry example for campaign content, sales education and branded customer engagement.','Industry-Uses-of-Stashbox-Radio-Ecosystem- solar3(11).jpeg','solar campaign energy sales marketing'),
              ('Corporate Video','A corporate video use case showing how the ecosystem distributes and reuses branded video content.','Industry-Uses-of-Stashbox-Radio-Ecosystem-Corp video (2).jpeg','corporate video enterprise content communication'),
              ('Forever 21 Example','A fashion retail example connecting music, promotions, content and commerce inside one branded channel.','Industry-Uses-of-Stashbox-Radio-Ecosystem-Forever 21 Example (16).jpeg','forever 21 fashion retail music commerce'),
              ('Single-Resort Guest TV','A resort guest-TV example for property programming, promotions, events and branded entertainment.','Industry-Uses-of-Stashbox-Radio-Ecosystem-Single-Resort-Guest-TV (10).jpeg','single resort guest tv hotel hospitality'),
              ('Hotel','A hotel use case for guest-facing music, video, property information and promotions.','Industry-Uses-of-Stashbox-Radio-Ecosystem-hotel (6).jpeg','hotel hospitality guest media radio'),
              ('Multi-Location Retail','A multi-location retail example showing centralized campaigns with store-level content and promotions.','Industry-Uses-of-Stashbox-Radio-Ecosystem-multi-location-retail (14).jpeg','multi location retail stores campaign'),
              ('Multi-Resort','A multi-resort example showing centralized brand programming across multiple hospitality properties.','Industry-Uses-of-Stashbox-Radio-Ecosystem-multi-resort (5).jpeg','multi resort hotel hospitality properties'),
              ('Retail Corporate','A corporate retail example connecting brand media, campaigns, products and customer communication.','Industry-Uses-of-Stashbox-Radio-Ecosystem-retail-corp (7).jpeg','retail corporate brand media commerce'),
              ('Solar Campaign 2','A second solar industry example focused on branded education, sales messaging and campaign delivery.','Industry-Uses-of-Stashbox-Radio-Ecosystem-solar2 (9).jpeg','solar campaign energy sales'),
              ('Venues','A venue-focused use case for event promotion, music programming, sponsor messaging and audience communication.','Industry-Uses-of-Stashbox-Radio-Ecosystem-venues (4).jpeg','venues events sponsor music programming'),
              ('Fashion','A fashion industry example connecting branded music, visual content, campaigns and commerce.','fashion.jpeg','fashion retail apparel brand music commerce'),
          ]

          if "type:'industry-usage'" not in text and '"type":"industry-usage"' not in text:
              rows = []
              for title, description, filename, search in meta:
                  url = '/onesheets/industry-examples/' + quote(filename)
                  item = {
                      'type': 'industry-usage',
                      'title': title,
                      'description': description,
                      'image': url,
                      'url': url,
                      'search': search,
                  }
                  rows.append('      ' + json.dumps(item, ensure_ascii=False, separators=(',', ':')) + ',')
              marker = '    const items = [\n'
              if marker not in text:
                  raise SystemExit('Could not find items array insertion point')
              text = text.replace(marker, marker + '\n'.join(rows) + '\n', 1)

          old_labels = "const labels={infographic:'Infographic',article:'Article',audio:'Audio Podcast',video:'Video Clip','one-sheet':'One-Sheet'};"
          new_labels = "const labels={infographic:'Infographic',article:'Article',audio:'Audio Podcast',video:'Video Clip','one-sheet':'One-Sheet','industry-usage':'Industry Usage Example'};"
          if old_labels in text:
              text = text.replace(old_labels, new_labels, 1)
          elif "'industry-usage':'Industry Usage Example'" not in text:
              raise SystemExit('Could not find labels map insertion point')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit blog update
        shell: bash
        run: |
          if git diff --quiet -- radio/blog/index.html; then
            echo "No blog changes required"
            exit 0
          fi
          git config user.name "elettro"
          git config user.email "dpalermo@elettro.com"
          git add radio/blog/index.html
          git commit -m "Add Industry Usage Examples to Radio blog"
          git push origin main
