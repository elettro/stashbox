name: V2 VEC Live Health

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'
      timezone: 'America/New_York'
    - cron: '0 18 * * *'
      timezone: 'America/New_York'

concurrency:
  group: v2-vec-live-health
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  vec-live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Allow live DEV deployment to settle
        if: github.event_name == 'push'
        run: sleep 90

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Test live mobile, tablet, and desktop VEC motion
        id: health
        continue-on-error: true
        env:
          V2_URL: https://stashbox.com/radio/dev/v2/
          VEC_HEALTH_SONG_TITLE: Freedom Street
          VEC_HEALTH_OUTPUT_DIR: artifacts/vec-live-health
          V2_COGNITO_TOKENS_JSON: ${{ secrets.V2_COGNITO_TOKENS_JSON }}
        run: |
          set +e
          node radio-api/scripts/smoke-test-v2-vec-live.mjs
          code=$?
          api_ok=$(node -e "const fs=require('fs');try{const s=JSON.parse(fs.readFileSync('artifacts/vec-live-health/summary.json','utf8'));process.stdout.write(s.api?.ok?'true':'false')}catch(e){process.stdout.write('false')}")
          if [ -n "$V2_COGNITO_TOKENS_JSON" ]; then auth_configured=true; else auth_configured=false; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "api_ok=$api_ok" >> "$GITHUB_OUTPUT"
          echo "auth_configured=$auth_configured" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Warn when authenticated VEC health credentials are missing
        if: steps.health.outputs.auth_configured != 'true'
        run: |
          echo "::warning::V2_COGNITO_TOKENS_JSON is not configured. Public VEC API health is enforced, but authenticated VEC motion is not treated as an outage until health credentials are configured."

      - name: Upload screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-vec-live-health-${{ github.run_id }}
          path: artifacts/vec-live-health
          if-no-files-found: warn
          retention-days: 14

      - name: Open or update VEC incident
        if: steps.health.outputs.api_ok != 'true' || (steps.health.outputs.auth_configured == 'true' && steps.health.outputs.exit_code != '0')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[VEC Health] Live responsive video failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let summary = {};
            try { summary = JSON.parse(fs.readFileSync('artifacts/vec-live-health/summary.json', 'utf8')); } catch (_) {}
            const apiFailures = summary.api?.failures || [];
            const browserFailures = (summary.results || []).flatMap(result =>
              (result.grade?.failures || []).map(message => `- **${result.profile}:** ${message}`)
            );
            const failures = [
              ...apiFailures.map(message => `- **Public VEC API:** ${message}`),
              ...browserFailures,
            ];
            const body = [`Live VEC health failed on ${new Date().toISOString()}.`, '', ...failures, '', `Evidence: ${runUrl}`].join('\n');
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
            const existing = found.data.items.find(item => item.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Close recovered VEC incident
        if: steps.health.outputs.api_ok == 'true' && (steps.health.outputs.auth_configured != 'true' || steps.health.outputs.exit_code == '0')
        uses: actions/github-script@v7
        env:
          AUTH_CONFIGURED: ${{ steps.health.outputs.auth_configured }}
        with:
          script: |
            const title = '[VEC Health] Live responsive video failure';
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
            const existing = found.data.items.find(item => item.title === title);
            if (!existing) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const authenticated = process.env.AUTH_CONFIGURED === 'true';
            const message = authenticated
              ? `Live VEC playback recovered on ${new Date().toISOString()}.\n\nPassing evidence: ${runUrl}`
              : `Public VEC API health is passing on ${new Date().toISOString()}. The previous failure was produced by the health runner using synthetic auth while VEC is login-gated. Authenticated motion coverage remains pending until V2_COGNITO_TOKENS_JSON is configured.\n\nPassing public-health evidence: ${runUrl}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: message,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Fail when live VEC playback is unhealthy
        if: steps.health.outputs.api_ok != 'true' || (steps.health.outputs.auth_configured == 'true' && steps.health.outputs.exit_code != '0')
        run: exit 1
