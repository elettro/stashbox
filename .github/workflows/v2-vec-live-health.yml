name: V2 VEC Live Health

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'radio/dev/v2/**'
      - 'radio-api/index.mjs'
      - 'radio-api/auth.mjs'
      - 'radio-api/rate-limit.mjs'
      - 'radio-api/video-factory/**'
      - 'radio-api/scripts/smoke-test-v2-vec-live.mjs'
      - '.github/workflows/deploy-true-dev-lambda.yml'
      - '.github/workflows/v2-vec-live-health.yml'
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: v2-vec-live-health
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  vec-live-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Allow live DEV deployment to settle
        if: github.event_name == 'push'
        run: sleep 90

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Test live mobile, tablet, and desktop VEC motion
        id: health
        continue-on-error: true
        env:
          V2_URL: https://stashbox.com/radio/dev/v2/
          VEC_HEALTH_SONG_TITLE: Freedom Street
          VEC_HEALTH_OUTPUT_DIR: artifacts/vec-live-health
          V2_COGNITO_TOKENS_JSON: ${{ secrets.V2_COGNITO_TOKENS_JSON }}
        run: |
          set +e
          node radio-api/scripts/smoke-test-v2-vec-live.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-vec-live-health-${{ github.run_id }}
          path: artifacts/vec-live-health
          if-no-files-found: warn
          retention-days: 14

      - name: Open or update VEC incident
        if: steps.health.outputs.exit_code != '0' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[VEC Health] Live responsive video failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let summary = {};
            try { summary = JSON.parse(fs.readFileSync('artifacts/vec-live-health/summary.json', 'utf8')); } catch (_) {}
            const apiFailures = summary.api?.failures || [];
            const browserFailures = (summary.results || []).flatMap(result =>
              (result.grade?.failures || []).map(message => `- **${result.profile}:** ${message}`)
            );
            const failures = [
              ...apiFailures.map(message => `- **Public VEC API:** ${message}`),
              ...browserFailures,
            ];
            const body = [`Live VEC health failed on ${new Date().toISOString()}.`, '', ...failures, '', `Evidence: ${runUrl}`].join('\n');
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
            const existing = found.data.items.find(item => item.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Close recovered VEC incident
        if: steps.health.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[VEC Health] Live responsive video failure';
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
            const existing = found.data.items.find(item => item.title === title);
            if (!existing) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `Live VEC playback recovered on ${new Date().toISOString()}.\n\nPassing evidence: ${runUrl}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            });

      - name: Fail when live VEC playback is unhealthy
        if: steps.health.outputs.exit_code != '0'
        run: exit 1
