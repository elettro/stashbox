name: Wire Radio mobile PROD catalog rescue

on:
  push:
    branches: [main]
    paths:
      - '.radio-mobile-prod-rescue-wire'

permissions:
  contents: write

concurrency:
  group: radio-mobile-prod-rescue-wire
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Wire rescue before recovery
        shell: python
        run: |
          from pathlib import Path
          p = Path('radio/index.html')
          s = p.read_text()
          old_boot = '<script src="/radio/v2-boot-guard.js?v=20260822-mobileboot2-catalogfallback1" defer></script>'
          old_rescue = '<script src="/radio/v2-mobile-catalog-rescue.js?v=20260822-mobileload1" defer></script>'
          new_rescue = '<script src="/radio/v2-mobile-catalog-rescue.js?v=20260822-mobileload2" defer></script>'
          if old_rescue in s:
              s = s.replace(old_rescue, new_rescue, 1)
          elif new_rescue not in s:
              if old_boot not in s:
                  raise SystemExit('boot guard marker not found')
              s = s.replace(old_boot, old_boot + '\n  ' + new_rescue, 1)
          s = s.replace('mobileboot2-catalogfallback1-mobileload1-titlemode2', 'mobileboot2-catalogfallback1-mobileload2-titlemode2', 1)
          p.write_text(s)
      - name: Verify ordering
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'v2-mobile-catalog-rescue.js?v=20260822-mobileload2' radio/index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('radio/index.html').read_text()
          assert s.index('v2-boot-guard.js') < s.index('v2-mobile-catalog-rescue.js') < s.index('v2-recovery.js')
          print('mobile rescue order verified')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bump PROD mobile catalog rescue cache [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
