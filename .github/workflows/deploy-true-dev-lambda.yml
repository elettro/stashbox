name: Deploy TRUE DEV Lambda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-true-dev-lambda.yml'
      - 'radio-api/index.mjs'
      - 'radio-api/index-core.mjs'
      - 'radio-api/db-reuse-hook.mjs'
      - 'radio-api/package.json'
      - 'radio-api/package-lock.json'
      - 'radio-api/auth.mjs'
      - 'radio-api/rate-limit.mjs'
      - 'radio-api/account-routes.mjs'
      - 'radio-api/account-lifecycle.mjs'
      - 'radio-api/artist-routes.mjs'
      - 'radio-api/artist-follow-routes.mjs'
      - 'radio-api/playlist-reorder-routes.mjs'
      - 'radio-api/profile-stats-routes.mjs'
      - 'radio-api/profile-media-routes.mjs'
      - 'radio-api/artist-profile-media-routes.mjs'
      - 'radio-api/notifications.mjs'
      - 'radio-api/notification-activity-feed.mjs'
      - 'radio-api/personalized-notifications.mjs'
      - 'radio-api/video-factory/**'
      - 'radio-api/tests/**'

permissions:
  contents: read

concurrency:
  group: deploy-true-dev-lambda
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, deploy, and verify TRUE DEV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_FUNCTION: stashbox-radio-api-dev-v2
      API_BASE: https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev
      COGNITO_REGION: us-east-1
      COGNITO_POOL: us-east-1_okL8XCVT6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lock deployment target
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          FUNCTION_NAME: ${{ secrets.TRUE_DEV_LAMBDA_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          test "${FUNCTION_NAME}" = "${EXPECTED_FUNCTION}"
          test "${AWS_REGION}" = 'us-east-1'
          test "${COGNITO_REGION}" = 'us-east-1'
          test "${COGNITO_POOL}" = 'us-east-1_okL8XCVT6'

      - name: Install Lambda dependencies before tests
        working-directory: radio-api
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-package-lock
          fi

      - name: Check syntax
        run: |
          set -euo pipefail
          node --check radio-api/index.mjs
          node --check radio-api/index-core.mjs
          node --check radio-api/db-reuse-hook.mjs
          node --check radio-api/auth.mjs
          node --check radio-api/rate-limit.mjs
          node --check radio-api/account-routes.mjs
          node --check radio-api/account-lifecycle.mjs
          node --check radio-api/artist-routes.mjs
          node --check radio-api/artist-follow-routes.mjs
          node --check radio-api/playlist-reorder-routes.mjs
          node --check radio-api/profile-stats-routes.mjs
          node --check radio-api/profile-media-routes.mjs
          node --check radio-api/artist-profile-media-routes.mjs
          node --check radio-api/notifications.mjs
          node --check radio-api/notification-activity-feed.mjs
          node --check radio-api/personalized-notifications.mjs
          node --check radio-api/video-factory/entry.mjs
          node --check radio-api/video-factory/routes.mjs
          node --check radio-api/video-factory/recipe.mjs

      - name: Run backend regression tests
        run: |
          set -euo pipefail
          node --test radio-api/tests/user-accounts-foundation.test.mjs
          node --test radio-api/tests/playlist-reorder.test.mjs
          node --test radio-api/tests/artist-foundation.test.mjs
          node --test radio-api/tests/artist-profile-media-persistence.test.mjs
          node --test radio-api/tests/notifications.test.mjs
          node --test radio-api/tests/notification-activity-feed.test.mjs
          node --test radio-api/tests/personalized-notifications.test.mjs
          node --test radio-api/tests/video-factory-foundation.test.mjs

      - name: Download and validate DEV Cognito JWKS
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 45 \
            "https://cognito-idp.${COGNITO_REGION}.amazonaws.com/${COGNITO_POOL}/.well-known/jwks.json" \
            --output radio-api/cognito-jwks-dev.json
          jq -e '(.keys | type == "array") and (.keys | length >= 2)' radio-api/cognito-jwks-dev.json >/dev/null

      - name: Build Lambda package
        working-directory: radio-api
        run: |
          set -euo pipefail
          npm prune --omit=dev
          rm -rf dist
          mkdir -p dist
          cp index.mjs radio-main.mjs
          cp video-factory/entry.mjs app-entry.mjs
          cat > index.mjs <<'EOF'
          import './db-reuse-hook.mjs';
          const app = await import('./app-entry.mjs');
          export const handler = app.handler;
          EOF
          node --check index.mjs
          node --check app-entry.mjs
          node --check radio-main.mjs
          node --check index-core.mjs
          node --check db-reuse-hook.mjs
          APP_ENV=dev node --input-type=module -e "await import('./index.mjs')"
          test -d node_modules/@aws-sdk/client-s3
          test -s cognito-jwks-dev.json
          zip -r dist/true-dev-lambda.zip . -x 'dist/*' -x '.git/*' -x '*.zip'
          unzip -l dist/true-dev-lambda.zip | grep -q 'radio-main.mjs'
          unzip -l dist/true-dev-lambda.zip | grep -q 'app-entry.mjs'
          unzip -l dist/true-dev-lambda.zip | grep -q 'db-reuse-hook.mjs'
          unzip -l dist/true-dev-lambda.zip | grep -q 'index-core.mjs'
          unzip -l dist/true-dev-lambda.zip | grep -q 'node_modules/@aws-sdk/client-s3'

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy and wait
        env:
          FUNCTION_NAME: ${{ secrets.TRUE_DEV_LAMBDA_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --zip-file fileb://radio-api/dist/true-dev-lambda.zip
          aws lambda wait function-updated --function-name "${FUNCTION_NAME}"

      - name: Run TRUE DEV API smoke test
        run: |
          set -euo pipefail
          node radio-api/scripts/smoke-test-true-dev-light.mjs

      - name: Verify VEC public routes and CORS
        run: |
          set -euo pipefail
          ORIGIN='https://stashbox.com'

          curl --fail --silent --show-error --max-time 45 \
            -H "Origin: ${ORIGIN}" \
            -D /tmp/songs.headers \
            "${API_BASE}/radio/songs?deploy_run=${GITHUB_RUN_ID}" \
            -o /tmp/songs.json
          grep -iq '^access-control-allow-origin:' /tmp/songs.headers

          SONG_KEY=$(jq -r '
            [(.songs // [])[], (.items // [])[], (.data // [])[]]
            | (map(select(((.display_title // .song_name // .title // "") | ascii_downcase) | contains("freedom street"))) | .[0].song_key)
              // .[0].song_key
              // empty
          ' /tmp/songs.json)
          test -n "${SONG_KEY}"

          for ROUTE in radio/vec/recipe radio/vec/song-assets; do
            curl --fail --silent --show-error --max-time 45 \
              -H "Origin: ${ORIGIN}" \
              -D /tmp/vec.headers \
              "${API_BASE}/${ROUTE}?song_key=${SONG_KEY}&deploy_run=${GITHUB_RUN_ID}" \
              -o /tmp/vec.json
            grep -iq '^access-control-allow-origin:' /tmp/vec.headers
            jq -e 'type == "object" or type == "array"' /tmp/vec.json >/dev/null
          done

      - name: Verify protected routes remain protected
        run: |
          set -euo pipefail
          AUTH_STATUS=$(curl --silent --show-error --max-time 45 -o /tmp/auth.json -w '%{http_code}' "${API_BASE}/radio/auth/config")
          test "${AUTH_STATUS}" = '200'
          ME_STATUS=$(curl --silent --show-error --max-time 45 -o /tmp/me.json -w '%{http_code}' "${API_BASE}/radio/me")
          test "${ME_STATUS}" = '401'
