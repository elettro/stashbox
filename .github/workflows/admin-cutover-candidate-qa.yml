name: Admin Cutover Candidate QA

on:
  push:
    branches:
      - feature/admin-unification-1077-cutover-candidate
    paths:
      - '.github/workflows/admin-cutover-candidate-qa.yml'
      - 'radio/canonical-song-source.js'
      - 'radio/index.html'
      - 'radio/desktop/index.html'
      - 'radio/dev/v2/index.html'
      - 'radio/dev/v2/desktop/index.html'
      - 'radio-admin/staging/songs/**'
      - 'radio-admin/staging/admin-env.js'

permissions:
  contents: read

jobs:
  candidate-locked-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out materialized candidate
        uses: actions/checkout@v4
        with:
          ref: feature/admin-unification-1077-cutover-candidate
          fetch-depth: 0

      - name: Fetch migration reference branch
        run: git fetch origin feature/admin-unification-1077:refs/remotes/origin/feature/admin-unification-1077

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check candidate surfaces
        run: |
          node --check radio/canonical-song-source.js
          node --check radio-admin/staging/admin-env.js
          node --check radio-admin/staging/songs/songs.js
          node --check radio-admin/staging/songs/media.js
          node --check radio-admin/staging/songs/artwork.js
          node --check radio-admin/staging/tests/canonical-song-cutover-smoke.mjs
          node --check radio-admin/staging/tests/canonical-song-admin-cutover-smoke.mjs

      - name: Assert candidate production-facing diff is exactly the planned cutover
        run: |
          changed="$(git diff --name-only origin/feature/admin-unification-1077...HEAD -- radio radio-admin/staging/songs | sort)"
          expected="$(printf '%s\n' \
            radio/canonical-song-source.js \
            radio/desktop/index.html \
            radio/dev/v2/desktop/index.html \
            radio/dev/v2/index.html \
            radio/index.html \
            radio-admin/staging/songs/artwork.js \
            radio-admin/staging/songs/index.html \
            radio-admin/staging/songs/media.js \
            radio-admin/staging/songs/songs.js | sort)"
          echo "$changed"
          test "$changed" = "$expected"

      - name: Assert both players are canonical PROD readers
        run: |
          grep -q 'canonicalUrl: PROD_SONGS' radio/canonical-song-source.js
          grep -q 'readOnly: true' radio/canonical-song-source.js
          grep -q 'Blocked non-read song catalog request' radio/canonical-song-source.js
          if grep -q 'DEV_SONGS' radio/canonical-song-source.js; then
            echo 'DEV catalog fallback exists in materialized canonical source.'
            exit 1
          fi
          for file in radio/index.html radio/desktop/index.html radio/dev/v2/index.html radio/dev/v2/desktop/index.html; do
            grep -q '/radio/canonical-song-source.js' "$file"
          done

      - name: Assert canonical Admin is PROD-targeted but write-locked
        run: |
          grep -q 'phase4ProdReadApproved: true' radio-admin/staging/admin-env.js
          grep -q 'productionWritesApproved: false' radio-admin/staging/admin-env.js
          grep -q 'stagingProdWritesAllowed: false' radio-admin/staging/admin-env.js
          grep -q 'writesAllowedInStaging: false' radio-admin/staging/admin-env.js
          grep -q 'prodSongCountValidated: 84' radio-admin/staging/admin-env.js
          grep -q 'devSongCountValidated: 84' radio-admin/staging/admin-env.js
          for file in radio-admin/staging/songs/songs.js radio-admin/staging/songs/media.js radio-admin/staging/songs/artwork.js; do
            if grep -q "getEnvironment('dev')" "$file"; then
              echo "DEV environment remains in canonical candidate Song CMS file: $file"
              exit 1
            fi
            grep -q 'getCanonicalSongEnvironment' "$file"
          done
          grep -q "assertCanonicalSongWriteApproved('songs')" radio-admin/staging/songs/songs.js
          grep -q 'assertCanonicalSongWriteApproved' radio-admin/staging/songs/media.js
          grep -q "assertCanonicalSongWriteApproved('song-artwork')" radio-admin/staging/songs/artwork.js
          grep -q 'stashbox-radio-media-prod-us-east-1' radio-admin/staging/songs/media.js
          grep -q 'stashbox-radio-media-prod-us-east-1' radio-admin/staging/songs/artwork.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated candidate server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/candidate-http.log 2>&1 &
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/radio/canonical-song-source.js >/dev/null && \
            curl --fail --silent http://127.0.0.1:4173/radio-admin/staging/songs/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/candidate-http.log
          exit 1

      - name: Verify both player families route song reads to canonical PROD
        run: node radio-admin/staging/tests/canonical-song-cutover-smoke.mjs

      - name: Verify canonical Admin reads PROD while writes stay blocked before network
        run: node radio-admin/staging/tests/canonical-song-admin-cutover-smoke.mjs
