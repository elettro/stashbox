name: Add Video Factory One-Sheet to Blog

on:
  push:
    paths:
      - '.github/scripts/add_video_factory_onesheet_to_blog.py'
      - '.github/workflows/add-video-factory-onesheet-to-blog.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add one-sheet card
        run: python .github/scripts/add_video_factory_onesheet_to_blog.py
      - name: Commit blog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio/blog/index.html
          git diff --cached --quiet || git commit -m "Add Video Factory one-sheet to Radio blog"
          git push
