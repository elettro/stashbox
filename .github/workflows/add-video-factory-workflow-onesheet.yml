name: Add Video Factory Workflow One-Sheet

on:
  push:
    paths:
      - '.github/scripts/add_video_factory_workflow_onesheet.py'
      - '.github/workflows/add-video-factory-workflow-onesheet.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add dated one-sheet card
        run: python .github/scripts/add_video_factory_workflow_onesheet.py
      - name: Commit blog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio/blog/index.html
          git diff --cached --quiet || git commit -m "Add July 19 Video Factory workflow one-sheet to blog"
          git push
