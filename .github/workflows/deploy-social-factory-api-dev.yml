name: Deploy Social Factory API DEV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-social-factory-api-dev.yml'
      - 'social-factory-api/**'

permissions:
  contents: write

concurrency:
  group: deploy-social-factory-api-dev
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      AWS_REGION: us-east-1
      STACK_NAME: stashbox-social-api-dev
      EXPECTED_API_FUNCTION: stashbox-social-api-dev
      EXPECTED_WORKER_FUNCTION: stashbox-social-publish-worker-dev
      EXPECTED_QUEUE_NAME: stashbox-social-publish-dev.fifo
      EXPECTED_DLQ_NAME: stashbox-social-publish-dev-dlq.fifo
      EXPECTED_SCHEDULE_GROUP: stashbox-social-publish-dev
      REPORT_PATH: deployment-reports/social-factory-api-dev.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Validate source
        working-directory: social-factory-api
        run: |
          set -euo pipefail
          npm install --omit=dev --no-audit --no-fund
          npm run check
          npm test
          sam validate --template-file infrastructure/template.yaml --lint

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare stack and deployment bucket
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ARTIFACT_BUCKET="stashbox-social-deploy-${ACCOUNT_ID}-${AWS_REGION}"
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          if [ "${STACK_STATUS}" = 'UPDATE_ROLLBACK_FAILED' ]; then
            aws cloudformation continue-update-rollback --stack-name "${STACK_NAME}"
            aws cloudformation wait stack-rollback-complete --stack-name "${STACK_NAME}"
          fi

          STACK_ROLE=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].RoleARN' \
            --output text)
          test "${STACK_ROLE}" = "arn:aws:iam::${ACCOUNT_ID}:role/stashbox-social-cloudformation-dev-role"

          if ! aws s3api head-bucket --bucket "${ARTIFACT_BUCKET}" 2>/dev/null; then
            aws s3api create-bucket --bucket "${ARTIFACT_BUCKET}" --region "${AWS_REGION}"
          fi
          aws s3api put-public-access-block \
            --bucket "${ARTIFACT_BUCKET}" \
            --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-encryption \
            --bucket "${ARTIFACT_BUCKET}" \
            --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          printf '%s' "${ACCOUNT_ID}" > /tmp/social-account-id
          printf '%s' "${ARTIFACT_BUCKET}" > /tmp/social-artifact-bucket
          printf '%s' "${STACK_ROLE}" > /tmp/social-stack-role

      - name: Build isolated SAM application
        working-directory: social-factory-api
        run: sam build --template-file infrastructure/template.yaml

      - name: Deploy isolated DEV stack
        working-directory: social-factory-api
        run: |
          set +e
          ARTIFACT_BUCKET=$(cat /tmp/social-artifact-bucket)
          STACK_ROLE=$(cat /tmp/social-stack-role)
          sam deploy \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "${STACK_ROLE}" \
            --s3-bucket "${ARTIFACT_BUCKET}" \
            --s3-prefix "social-factory-api/${GITHUB_SHA}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides EnvironmentName=dev AllowedOrigin=https://stashbox.com \
            2>&1 | tee /tmp/social-sam-deploy.log
          DEPLOY_EXIT=${PIPESTATUS[0]}
          echo "${DEPLOY_EXIT}" > /tmp/social-deploy-exit
          exit 0

      - name: Verify stack resources and protected routes
        run: |
          set +e
          DEPLOY_EXIT=$(cat /tmp/social-deploy-exit)
          if [ "${DEPLOY_EXIT}" != '0' ]; then
            echo 'Deployment did not succeed; verification skipped.' | tee /tmp/social-verify.log
            echo '1' > /tmp/social-verify-exit
            exit 0
          fi

          (
            set -euo pipefail

            check_equal() {
              local label="$1"
              local actual="$2"
              local expected="$3"
              echo "${label}: ${actual}"
              if [ "${actual}" != "${expected}" ]; then
                echo "Expected ${label} to be ${expected}." >&2
                exit 1
              fi
            }

            STACK_STATUS=$(aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query 'Stacks[0].StackStatus' \
              --output text)
            check_equal 'stack_status' "${STACK_STATUS}" 'UPDATE_COMPLETE'

            stack_output() {
              aws cloudformation describe-stacks \
                --stack-name "${STACK_NAME}" \
                --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
                --output text
            }

            API_FUNCTION=$(stack_output SocialApiDevFunctionName)
            WORKER_FUNCTION=$(stack_output SocialScheduledPublishWorkerFunctionName)
            QUEUE_URL=$(stack_output SocialPublishScheduleQueueUrl)
            QUEUE_ARN=$(stack_output SocialPublishScheduleQueueArn)
            DLQ_ARN=$(stack_output SocialPublishScheduleDeadLetterQueueArn)
            SCHEDULE_GROUP=$(stack_output SocialPublishScheduleGroupName)
            BASE_URL=$(stack_output SocialApiDevBaseUrl)

            check_equal 'api_function' "${API_FUNCTION}" "${EXPECTED_API_FUNCTION}"
            check_equal 'worker_function' "${WORKER_FUNCTION}" "${EXPECTED_WORKER_FUNCTION}"
            check_equal 'queue_name' "${QUEUE_ARN##*:}" "${EXPECTED_QUEUE_NAME}"
            check_equal 'dead_letter_queue_name' "${DLQ_ARN##*:}" "${EXPECTED_DLQ_NAME}"
            check_equal 'schedule_group' "${SCHEDULE_GROUP}" "${EXPECTED_SCHEDULE_GROUP}"
            echo "queue_url: ${QUEUE_URL}"
            [[ "${QUEUE_URL}" == *"/${EXPECTED_QUEUE_NAME}" ]]

            for LOGICAL_ID in \
              SocialApiDevFunction \
              SocialScheduledPublishWorkerFunction \
              SocialPublishScheduleQueue \
              SocialPublishScheduleDeadLetterQueue \
              SocialPublishScheduleGroup \
              SocialPublishSchedulerTargetRole \
              SocialScheduledPublishWorkerRole \
              SocialScheduledPublishWorkerLogGroup; do
              RESOURCE_STATUS=$(aws cloudformation describe-stack-resource \
                --stack-name "${STACK_NAME}" \
                --logical-resource-id "${LOGICAL_ID}" \
                --query 'StackResourceDetail.ResourceStatus' \
                --output text)
              echo "resource ${LOGICAL_ID}: ${RESOURCE_STATUS}"
              case "${RESOURCE_STATUS}" in
                *_COMPLETE) ;;
                *)
                  echo "CloudFormation resource ${LOGICAL_ID} is not complete." >&2
                  exit 1
                  ;;
              esac
            done

            HEALTH_STATUS=$(curl --silent --show-error --max-time 60 \
              -o /tmp/social-health.json -w '%{http_code}' \
              "${BASE_URL}/social/health")
            check_equal 'health_http_status' "${HEALTH_STATUS}" '200'
            jq -e '
              .ok == true and
              .environment == "dev" and
              .isolation.queueConfigured == true and
              .isolation.scheduledPublishingConfigured == true and
              .isolation.contentReviewSupported == true and
              .isolation.reviewPublishingSupported == true
            ' /tmp/social-health.json >/dev/null
            echo 'health_contract: passed'

            YOUTUBE_STATUS=$(curl --silent --show-error --max-time 60 \
              -H 'x-admin-token: invalid-deployment-smoke-token' \
              -o /tmp/social-youtube-status.json -w '%{http_code}' \
              "${BASE_URL}/social/youtube/status")
            check_equal 'youtube_protected_http_status' "${YOUTUBE_STATUS}" '401'

            SCHEDULE_STATUS=$(curl --silent --show-error --max-time 60 \
              -X POST -H 'Content-Type: application/json' -d '{}' \
              -o /tmp/social-schedule-status.json -w '%{http_code}' \
              "${BASE_URL}/social/review-items/render-test-12345678/schedule")
            check_equal 'schedule_protected_http_status' "${SCHEDULE_STATUS}" '401'

            CANCEL_STATUS=$(curl --silent --show-error --max-time 60 \
              -X POST -H 'Content-Type: application/json' -d '{}' \
              -o /tmp/social-cancel-status.json -w '%{http_code}' \
              "${BASE_URL}/social/review-items/render-test-12345678/schedule/cancel")
            check_equal 'schedule_cancel_protected_http_status' "${CANCEL_STATUS}" '401'

            printf '%s' "${STACK_STATUS}" > /tmp/social-stack-status
            printf '%s' "${API_FUNCTION}" > /tmp/social-api-function
            printf '%s' "${WORKER_FUNCTION}" > /tmp/social-worker-function
            printf '%s' "${QUEUE_URL}" > /tmp/social-queue-url
            printf '%s' "${QUEUE_ARN}" > /tmp/social-queue-arn
            printf '%s' "${DLQ_ARN}" > /tmp/social-dlq-arn
            printf '%s' "${SCHEDULE_GROUP}" > /tmp/social-schedule-group
            printf '%s' "${BASE_URL}" > /tmp/social-base-url
            printf '%s' "${HEALTH_STATUS}" > /tmp/social-health-status
            printf '%s' "${YOUTUBE_STATUS}" > /tmp/social-youtube-status-code
            printf '%s' "${SCHEDULE_STATUS}" > /tmp/social-schedule-status-code
            printf '%s' "${CANCEL_STATUS}" > /tmp/social-cancel-status-code
            echo 'deployment_verification: passed'
          ) 2>&1 | tee /tmp/social-verify.log
          VERIFY_EXIT=${PIPESTATUS[0]}
          echo "${VERIFY_EXIT}" > /tmp/social-verify-exit
          exit 0

      - name: Record deployment receipt
        if: always()
        run: |
          set -euo pipefail
          DEPLOY_EXIT=$(cat /tmp/social-deploy-exit 2>/dev/null || echo 1)
          VERIFY_EXIT=$(cat /tmp/social-verify-exit 2>/dev/null || echo 1)
          STATUS=failure
          if [ "${DEPLOY_EXIT}" = '0' ] && [ "${VERIFY_EXIT}" = '0' ]; then STATUS=success; fi

          DEPLOY_SUMMARY=$(tail -n 100 /tmp/social-sam-deploy.log 2>/dev/null | tail -c 12000 || true)
          VERIFY_SUMMARY=$(tail -n 100 /tmp/social-verify.log 2>/dev/null | tail -c 12000 || true)
          ACCOUNT_ID=$(cat /tmp/social-account-id 2>/dev/null || true)
          ARTIFACT_BUCKET=$(cat /tmp/social-artifact-bucket 2>/dev/null || true)
          STACK_ROLE=$(cat /tmp/social-stack-role 2>/dev/null || true)

          jq -n \
            --arg status "${STATUS}" \
            --arg recorded_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg region "${AWS_REGION}" \
            --arg stack_name "${STACK_NAME}" \
            --arg stack_status "$(cat /tmp/social-stack-status 2>/dev/null || true)" \
            --arg stack_role "${STACK_ROLE}" \
            --arg artifact_bucket "${ARTIFACT_BUCKET}" \
            --arg api_function "$(cat /tmp/social-api-function 2>/dev/null || true)" \
            --arg worker_function "$(cat /tmp/social-worker-function 2>/dev/null || true)" \
            --arg base_url "$(cat /tmp/social-base-url 2>/dev/null || true)" \
            --arg health_http_status "$(cat /tmp/social-health-status 2>/dev/null || true)" \
            --arg youtube_status_http_status "$(cat /tmp/social-youtube-status-code 2>/dev/null || true)" \
            --arg schedule_http_status "$(cat /tmp/social-schedule-status-code 2>/dev/null || true)" \
            --arg cancel_http_status "$(cat /tmp/social-cancel-status-code 2>/dev/null || true)" \
            --arg queue_url "$(cat /tmp/social-queue-url 2>/dev/null || true)" \
            --arg queue_arn "$(cat /tmp/social-queue-arn 2>/dev/null || true)" \
            --arg dlq_arn "$(cat /tmp/social-dlq-arn 2>/dev/null || true)" \
            --arg schedule_group "$(cat /tmp/social-schedule-group 2>/dev/null || true)" \
            --arg deploy_exit_code "${DEPLOY_EXIT}" \
            --arg verify_exit_code "${VERIFY_EXIT}" \
            --arg deploy_summary "${DEPLOY_SUMMARY}" \
            --arg verify_summary "${VERIFY_SUMMARY}" '
            {
              status:$status,
              recorded_at:$recorded_at,
              commit_sha:$commit_sha,
              run_id:$run_id,
              run_url:$run_url,
              region:$region,
              stack_name:$stack_name,
              stack_status:$stack_status,
              stack_role_arn:$stack_role,
              artifact_bucket:$artifact_bucket,
              function_name:$api_function,
              worker_function_name:$worker_function,
              base_url:$base_url,
              health_http_status:$health_http_status,
              youtube_status_http_status:$youtube_status_http_status,
              scheduled_publish_http_status:$schedule_http_status,
              schedule_cancel_http_status:$cancel_http_status,
              scheduled_publish_queue_url:$queue_url,
              scheduled_publish_queue_arn:$queue_arn,
              scheduled_publish_dlq_arn:$dlq_arn,
              scheduled_publish_group:$schedule_group,
              deploy_exit_code:$deploy_exit_code,
              verify_exit_code:$verify_exit_code,
              deploy_summary:$deploy_summary,
              verify_summary:$verify_summary,
              publishing_triggered:false,
              production_changed:false
            }' > "${REPORT_PATH}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${REPORT_PATH}"
          git commit -m 'Record Social Factory DEV deployment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Require successful deployment
        run: |
          test "$(jq -r '.status' "${REPORT_PATH}")" = 'success'
