name: Deploy Social Factory API DEV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-social-factory-api-dev.yml'
      - 'social-factory-api/**'

permissions:
  contents: write

concurrency:
  group: deploy-social-factory-api-dev
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      STACK_NAME: stashbox-social-api-dev
      EXPECTED_FUNCTION_NAME: stashbox-social-api-dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Validate source
        working-directory: social-factory-api
        run: |
          npm run check
          npm test
          sam validate --template-file infrastructure/template.yaml --lint

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build isolated SAM application
        working-directory: social-factory-api
        run: sam build --template-file infrastructure/template.yaml

      - name: Prepare isolated deployment artifact bucket
        run: |
          set +e
          {
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            ARTIFACT_BUCKET="stashbox-social-deploy-${ACCOUNT_ID}-${AWS_REGION}"
            echo "${ARTIFACT_BUCKET}" > /tmp/social-factory-artifact-bucket

            if ! aws s3api head-bucket --bucket "${ARTIFACT_BUCKET}" 2>/dev/null; then
              aws s3api create-bucket \
                --bucket "${ARTIFACT_BUCKET}" \
                --region "${AWS_REGION}"
            fi

            aws s3api put-public-access-block \
              --bucket "${ARTIFACT_BUCKET}" \
              --public-access-block-configuration \
                BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

            aws s3api put-bucket-encryption \
              --bucket "${ARTIFACT_BUCKET}" \
              --server-side-encryption-configuration \
                '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          } 2>&1 | tee /tmp/social-factory-artifact-bucket.log

          ARTIFACT_EXIT_CODE=${PIPESTATUS[0]}
          echo "${ARTIFACT_EXIT_CODE}" > /tmp/social-factory-artifact-bucket.exit
          exit "${ARTIFACT_EXIT_CODE}"

      - name: Deploy isolated DEV stack
        working-directory: social-factory-api
        run: |
          set +e
          ARTIFACT_BUCKET=$(cat /tmp/social-factory-artifact-bucket)

          sam deploy \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --s3-bucket "${ARTIFACT_BUCKET}" \
            --s3-prefix "social-factory-api/${GITHUB_SHA}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides EnvironmentName=dev AllowedOrigin=https://stashbox.com \
            2>&1 | tee /tmp/social-factory-sam-deploy.log

          DEPLOY_EXIT_CODE=${PIPESTATUS[0]}
          echo "${DEPLOY_EXIT_CODE}" > /tmp/social-factory-sam-deploy.exit
          exit "${DEPLOY_EXIT_CODE}"

      - name: Verify deployed function identity and policy boundary
        run: |
          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='SocialApiDevFunctionName'].OutputValue" \
            --output text)

          test "${FUNCTION_NAME}" = "${EXPECTED_FUNCTION_NAME}"

          ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='SocialApiDevExecutionRoleArn'].OutputValue" \
            --output text)

          ROLE_NAME="${ROLE_ARN##*/}"
          ATTACHED_POLICIES=$(aws iam list-attached-role-policies \
            --role-name "${ROLE_NAME}" \
            --query 'AttachedPolicies[].PolicyName' \
            --output text)

          if [ -n "${ATTACHED_POLICIES}" ]; then
            echo "Unexpected managed policies attached to ${ROLE_NAME}: ${ATTACHED_POLICIES}" >&2
            exit 1
          fi

          INLINE_POLICIES=$(aws iam list-role-policies \
            --role-name "${ROLE_NAME}" \
            --query 'PolicyNames' \
            --output text)

          test -n "${INLINE_POLICIES}"

          for POLICY_NAME in ${INLINE_POLICIES}; do
            DOCUMENT=$(aws iam get-role-policy \
              --role-name "${ROLE_NAME}" \
              --policy-name "${POLICY_NAME}" \
              --query 'PolicyDocument' \
              --output json)

            echo "${DOCUMENT}" | jq -e '
              [.. | objects | select(has("Action")) | .Action] |
              flatten |
              all(. == "logs:CreateLogGroup" or . == "logs:CreateLogStream" or . == "logs:PutLogEvents")
            ' >/dev/null
          done

      - name: Smoke test health endpoint
        run: |
          HEALTH_URL=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='SocialApiDevUrl'].OutputValue" \
            --output text)

          STATUS=$(curl --silent --show-error --max-time 45 \
            -o /tmp/social-health.json \
            -w '%{http_code}' \
            "${HEALTH_URL}")

          test "${STATUS}" = '200'
          jq -e '
            .ok == true and
            .service == "stashbox-social-api" and
            .environment == "dev" and
            .isolation.databaseConfigured == false and
            .isolation.s3Configured == false and
            .isolation.queueConfigured == false and
            .isolation.mainRadioApiDependency == false and
            .isolation.executionRoleScope == "cloudwatch-logs-only"
          ' /tmp/social-health.json >/dev/null

          echo "Social Factory health endpoint: ${HEALTH_URL}"

      - name: Record deployment receipt
        if: always()
        env:
          DEPLOYMENT_STATUS: ${{ job.status }}
        run: |
          set +e

          FUNCTION_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='SocialApiDevFunctionName'].OutputValue" \
            --output text 2>/dev/null)

          ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='SocialApiDevExecutionRoleArn'].OutputValue" \
            --output text 2>/dev/null)

          HEALTH_URL=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='SocialApiDevUrl'].OutputValue" \
            --output text 2>/dev/null)

          ARTIFACT_BUCKET=""
          if [ -f /tmp/social-factory-artifact-bucket ]; then
            ARTIFACT_BUCKET=$(cat /tmp/social-factory-artifact-bucket)
          fi

          HEALTH_HTTP_STATUS=""
          if [ -n "${HEALTH_URL}" ]; then
            HEALTH_HTTP_STATUS=$(curl --silent --show-error --max-time 45 \
              -o /tmp/social-health-receipt.json \
              -w '%{http_code}' \
              "${HEALTH_URL}" 2>/dev/null)
          fi

          ARTIFACT_EXIT_CODE=""
          if [ -f /tmp/social-factory-artifact-bucket.exit ]; then
            ARTIFACT_EXIT_CODE=$(cat /tmp/social-factory-artifact-bucket.exit)
          fi

          ARTIFACT_ERROR_SUMMARY=""
          if [ -s /tmp/social-factory-artifact-bucket.log ]; then
            ARTIFACT_ERROR_SUMMARY=$(tail -n 40 /tmp/social-factory-artifact-bucket.log | tail -c 5000)
          fi

          DEPLOY_EXIT_CODE=""
          if [ -f /tmp/social-factory-sam-deploy.exit ]; then
            DEPLOY_EXIT_CODE=$(cat /tmp/social-factory-sam-deploy.exit)
          fi

          DEPLOY_ERROR_SUMMARY=""
          if [ -s /tmp/social-factory-sam-deploy.log ]; then
            DEPLOY_ERROR_SUMMARY=$(tail -n 60 /tmp/social-factory-sam-deploy.log | tail -c 7000)
          fi

          STACK_EVENT_SUMMARY=$(aws cloudformation describe-stack-events \
            --stack-name "${STACK_NAME}" \
            --query 'StackEvents[?ResourceStatusReason!=`null`].[LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
            --output text 2>/dev/null | head -n 30)

          RECORDED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          jq -n \
            --arg status "${DEPLOYMENT_STATUS}" \
            --arg recorded_at "${RECORDED_AT}" \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_url "${RUN_URL}" \
            --arg region "${AWS_REGION}" \
            --arg stack_name "${STACK_NAME}" \
            --arg artifact_bucket "${ARTIFACT_BUCKET}" \
            --arg artifact_exit_code "${ARTIFACT_EXIT_CODE}" \
            --arg artifact_error_summary "${ARTIFACT_ERROR_SUMMARY}" \
            --arg function_name "${FUNCTION_NAME}" \
            --arg execution_role_arn "${ROLE_ARN}" \
            --arg health_url "${HEALTH_URL}" \
            --arg health_http_status "${HEALTH_HTTP_STATUS}" \
            --arg deploy_exit_code "${DEPLOY_EXIT_CODE}" \
            --arg deploy_error_summary "${DEPLOY_ERROR_SUMMARY}" \
            --arg stack_event_summary "${STACK_EVENT_SUMMARY}" \
            '{
              status: $status,
              recorded_at: $recorded_at,
              commit_sha: $commit_sha,
              run_id: $run_id,
              run_url: $run_url,
              region: $region,
              stack_name: $stack_name,
              artifact_bucket: $artifact_bucket,
              artifact_exit_code: $artifact_exit_code,
              artifact_error_summary: $artifact_error_summary,
              function_name: $function_name,
              execution_role_arn: $execution_role_arn,
              health_url: $health_url,
              health_http_status: $health_http_status,
              deploy_exit_code: $deploy_exit_code,
              deploy_error_summary: $deploy_error_summary,
              stack_event_summary: $stack_event_summary
            }' > /tmp/social-factory-api-dev-deployment.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          mkdir -p deployment-reports
          cp /tmp/social-factory-api-dev-deployment.json deployment-reports/social-factory-api-dev.json
          git add deployment-reports/social-factory-api-dev.json

          if git diff --cached --quiet; then
            echo 'Deployment receipt already current.'
            exit 0
          fi

          git commit -m 'Record Social Factory DEV deployment [skip ci]'
          git push origin main
