name: Smoke Radio V2 production candidate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.release-radio-v2-smoke'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SITE: https://stashbox.com/radio/v2
      API: https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2
    steps:
      - name: Wait for GitHub Pages candidate
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code="$(curl -L -sS -o /tmp/v2.html -w '%{http_code}' "${SITE}/?release_smoke=20260822" || true)"
            if [ "$code" = "200" ] && grep -q 'Stashbox Radio' /tmp/v2.html; then
              echo "Candidate is live."
              exit 0
            fi
            echo "Waiting for candidate publication, attempt ${i}, HTTP ${code}"
            sleep 5
          done
          echo 'Candidate did not publish in time.' >&2
          exit 1

      - name: Verify public candidate pages and production path wiring
        shell: bash
        run: |
          set -euo pipefail
          for path in '/' '/desktop/' '/profile/' '/artist/' '/offline/'; do
            code="$(curl -L -sS -o /tmp/page -w '%{http_code}' "${SITE}${path}?release_smoke=20260822")"
            echo "${path} -> ${code}"
            test "$code" = "200"
          done

          curl -L -sS "${SITE}/?release_smoke=20260822" -o /tmp/root.html
          if grep -q 'd21fbe6u80.execute-api.us-east-1.amazonaws.com/dev' /tmp/root.html; then
            echo 'DEV API leaked into published root HTML.' >&2
            exit 1
          fi
          if grep -q '/radio/dev/' /tmp/root.html; then
            echo 'DEV route leaked into published root HTML.' >&2
            exit 1
          fi
          grep -q 'https://stashbox.com/radio/' /tmp/root.html

      - name: Verify production API routes used by V2
        shell: bash
        run: |
          set -euo pipefail

          check_200() {
            local path="$1"
            local code
            code="$(curl -sS -o /tmp/api-response -w '%{http_code}' "${API}${path}")"
            echo "${path} -> ${code}"
            if [ "$code" != "200" ]; then
              cat /tmp/api-response || true
              return 1
            fi
          }

          check_auth_route() {
            local path="$1"
            local code
            code="$(curl -sS -o /tmp/api-response -w '%{http_code}' "${API}${path}")"
            echo "${path} -> ${code}"
            if [ "$code" != "401" ] && [ "$code" != "403" ]; then
              cat /tmp/api-response || true
              return 1
            fi
          }

          check_200 '/radio/songs'
          check_200 '/radio/ad-settings'
          check_200 '/radio/ads'
          check_200 '/radio/auth/config'
          check_auth_route '/radio/me'
          check_auth_route '/radio/me/preferences'

      - name: Verify representative production JS assets
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            '/v2.js'
            '/v2-session-manager.js'
            '/v2-ads-cms-runtime.js'
            '/v2-ads-fit-guard.js'
            '/desktop/desktop-vec2.js'
            '/profile/profile.js'
            '/artist/artist.js'
          )
          for asset in "${assets[@]}"; do
            url="${SITE}${asset}?release_smoke=20260822"
            code="$(curl -sS -o /tmp/asset -w '%{http_code}' "$url")"
            echo "${asset} -> ${code}"
            test "$code" = "200"
            if grep -q 'd21fbe6u80.execute-api.us-east-1.amazonaws.com/dev' /tmp/asset; then
              echo "DEV API leaked into ${asset}" >&2
              exit 1
            fi
            if grep -q '/radio/dev/' /tmp/asset; then
              echo "DEV route leaked into ${asset}" >&2
              exit 1
            fi
          done

      - name: Smoke gate passed
        run: echo 'Radio V2 production candidate HTTP/API smoke gate passed.'
