name: Inspect Final Content Review Verification

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-inspect-final-content-review-verification.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      TARGET_WORKFLOW: one-time-verify-social-factory-content-review.yml
      REPORT_PATH: deployment-reports/social-factory-final-review-verification-run.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Read current verification run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${REPORT_PATH}")"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28')

          curl --fail --silent --show-error "${AUTH[@]}" \
            "${API}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=3" > /tmp/runs.json
          RUN_ID=$(jq -r '.workflow_runs[0].id // empty' /tmp/runs.json)
          if [ -n "${RUN_ID}" ]; then
            curl --fail --silent --show-error "${AUTH[@]}" \
              "${API}/actions/runs/${RUN_ID}/jobs?per_page=20" > /tmp/jobs.json
          else
            printf '{"jobs":[]}' > /tmp/jobs.json
          fi

          RECORDED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg recorded_at "${RECORDED_AT}" \
            --slurpfile runs /tmp/runs.json \
            --slurpfile jobs /tmp/jobs.json '
              ($runs[0].workflow_runs[0] // null) as $run |
              {
                recorded_at: $recorded_at,
                run: (if $run then {
                  id: $run.id,
                  status: $run.status,
                  conclusion: $run.conclusion,
                  head_sha: $run.head_sha,
                  created_at: $run.created_at,
                  updated_at: $run.updated_at,
                  html_url: $run.html_url
                } else null end),
                jobs: [($jobs[0].jobs // [])[] | {
                  id, name, status, conclusion,
                  steps: [.steps[]? | {name, status, conclusion, number}]
                }],
                youtube_published: false
              }
            ' > "${REPORT_PATH}"

      - name: Commit verification run snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${REPORT_PATH}"
          git commit -m 'Record final Content Review verification run [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
