name: Apply secure preview response contract fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-secure-preview-origin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add schema-required ok field
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          actions = Path('social-factory-api/review-actions.mjs')
          text = actions.read_text()
          old = """      return {
                ...(isStashboxBrowserRequest ? { preview_url: previewUrl } : {}),
                review_page_url: reviewPageUrl,"""
          new = """      return {
                ok: true,
                ...(isStashboxBrowserRequest ? { preview_url: previewUrl } : {}),
                review_page_url: reviewPageUrl,"""
          if old not in text:
              raise SystemExit('preview response target block not found')
          actions.write_text(text.replace(old, new, 1))

          tests = Path('social-factory-api/tests/secure-preview-contract.test.mjs')
          t = tests.read_text()
          old_test = "assert.equal(r.expires_in_seconds,900);"
          new_test = "assert.equal(r.ok,true);assert.equal(r.expires_in_seconds,900);"
          if old_test not in t:
              raise SystemExit('secure preview test target not found')
          tests.write_text(t.replace(old_test, new_test, 1))
          PY

          cd social-factory-api
          npm install --omit=dev --no-audit --no-fund
          npm run check
          npm test
          cd ..

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social-factory-api/review-actions.mjs social-factory-api/tests/secure-preview-contract.test.mjs
          git commit -m 'Add ok field to secure preview response contract'
          git pull --rebase origin main
          git push origin HEAD:main
