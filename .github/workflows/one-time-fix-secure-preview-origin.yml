name: Apply final secure preview client detection fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-secure-preview-origin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch secure preview detection
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          actions = Path('social-factory-api/review-actions.mjs')
          text = actions.read_text()
          old = """      const actorType = getHeader(event, 'x-stashbox-actor-type').toLowerCase();
                const actorId = getHeader(event, 'x-stashbox-actor').toLowerCase();
                const isCustomGptRequest = actorType === 'custom_gpt' || actorId.includes('gpt') || Boolean(getHeader(event, 'authorization'));
                return {
                  ...(isCustomGptRequest ? {} : { preview_url: previewUrl }),"""
          new = """      const origin = getHeader(event, 'origin').toLowerCase();
                const isStashboxBrowserRequest = origin === 'https://stashbox.com';
                return {
                  ...(isStashboxBrowserRequest ? { preview_url: previewUrl } : {}),"""
          if old not in text:
              raise SystemExit('review-actions target block not found')
          actions.write_text(text.replace(old, new))

          contract_tests = Path('social-factory-api/tests/secure-preview-contract.test.mjs')
          t = contract_tests.read_text()
          t = t.replace(
              "r=await x.s.preview(event(),id);",
              "r=await x.s.preview(event({origin:'https://stashbox.com'}),id);",
              1
          )
          contract_tests.write_text(t)

          action_tests = Path('social-factory-api/tests/review-actions.test.mjs')
          a = action_tests.read_text()
          old_test = """  const { service } = fixture();
            const result = await service.preview(event(), 'render-job-12345678');"""
          new_test = """  const { service } = fixture();
            const browserEvent = event();
            browserEvent.headers.origin = 'https://stashbox.com';
            const result = await service.preview(browserEvent, 'render-job-12345678');"""
          if old_test not in a:
              raise SystemExit('review-actions browser preview test block not found')
          action_tests.write_text(a.replace(old_test, new_test, 1))
          PY

          cd social-factory-api
          npm install --omit=dev --no-audit --no-fund
          npm run check
          npm test
          cd ..

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social-factory-api/review-actions.mjs social-factory-api/tests/secure-preview-contract.test.mjs social-factory-api/tests/review-actions.test.mjs
          git commit -m 'Finalize secure preview GPT response contract'
          git pull --rebase origin main
          git push origin HEAD:main
