name: Diagnose DEV vs PROD VEC parity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-dev-prod-vec-parity.yml'
      - '.github/scripts/diagnose-dev-prod-vec-parity.mjs'
      - '.diagnose-dev-prod-vec-parity'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mark VEC parity probe started
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p radio/docs/diagnostics
          printf 'started_utc=%s\nrun_id=%s\ncommit=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" "$GITHUB_SHA" > radio/docs/diagnostics/DEV_PROD_VEC_PARITY_STARTED.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio/docs/diagnostics/DEV_PROD_VEC_PARITY_STARTED.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Mark DEV PROD VEC parity probe started [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Probe VEC parity
        run: node .github/scripts/diagnose-dev-prod-vec-parity.mjs
      - name: Record parity report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f radio/docs/diagnostics/DEV_PROD_VEC_PARITY_LATEST.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add radio/docs/diagnostics/DEV_PROD_VEC_PARITY_LATEST.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record DEV PROD VEC parity diagnostic [skip ci]'
          git push origin HEAD:main
