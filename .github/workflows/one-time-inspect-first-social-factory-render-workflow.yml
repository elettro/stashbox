name: Inspect First Social Factory Render Workflow

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-inspect-first-social-factory-render-workflow.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      TARGET_WORKFLOW: one-time-run-first-social-factory-orchestrated-render.yml
      REPORT_PATH: deployment-reports/social-factory-first-orchestrated-render-workflow-status.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Read workflow status and sanitized failure details
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${REPORT_PATH}")"

          curl \
            --fail \
            --silent \
            --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=5" \
            > /tmp/render-workflow-runs.json

          LATEST_RUN_ID=$(jq -r '.workflow_runs[0].id // empty' /tmp/render-workflow-runs.json)

          if [ -n "${LATEST_RUN_ID}" ]; then
            curl \
              --fail \
              --silent \
              --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${LATEST_RUN_ID}/jobs?per_page=20" \
              > /tmp/render-workflow-jobs.json
          else
            printf '{"jobs":[]}' > /tmp/render-workflow-jobs.json
          fi

          LATEST_JOB_ID=$(jq -r '.jobs[0].id // empty' /tmp/render-workflow-jobs.json)
          : > /tmp/render-workflow-diagnostic.txt

          if [ -n "${LATEST_JOB_ID}" ]; then
            curl \
              --fail \
              --location \
              --silent \
              --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${LATEST_JOB_ID}/logs" \
              > /tmp/render-workflow-job-logs.bin

            python <<'PY'
          import io
          import re
          import zipfile
          from pathlib import Path

          raw = Path('/tmp/render-workflow-job-logs.bin').read_bytes()
          if raw.startswith(b'PK'):
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  text = '\n'.join(
                      archive.read(name).decode('utf-8', errors='replace')
                      for name in archive.namelist()
                      if not name.endswith('/')
                  )
          else:
              text = raw.decode('utf-8', errors='replace')

          pattern = re.compile(
              r'error|failed|failure|HTTP|SyntaxError|ReferenceError|AccessDenied|not configured|missing',
              re.IGNORECASE
          )
          lines = [line for line in text.splitlines() if pattern.search(line)]
          diagnostic = '\n'.join(lines[-50:])
          diagnostic = re.sub(r'(?i)(x-admin-token:|authorization:)[^\s]+', r'\1 [REDACTED]', diagnostic)
          diagnostic = re.sub(r'(?<![A-Za-z0-9])[A-Za-z0-9_-]{40,}(?![A-Za-z0-9])', '[REDACTED]', diagnostic)
          Path('/tmp/render-workflow-diagnostic.txt').write_text(diagnostic[:12000], encoding='utf-8')
          PY
          fi

          RECORDED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg recorded_at "${RECORDED_AT}" \
            --slurpfile runs /tmp/render-workflow-runs.json \
            --slurpfile jobs /tmp/render-workflow-jobs.json \
            --rawfile diagnostic /tmp/render-workflow-diagnostic.txt '
              ($runs[0].workflow_runs[0] // null) as $run |
              {
                recorded_at: $recorded_at,
                workflow_found: ($run != null),
                latest_run: (if $run then {
                  id: $run.id,
                  status: $run.status,
                  conclusion: $run.conclusion,
                  event: $run.event,
                  head_sha: $run.head_sha,
                  run_number: $run.run_number,
                  created_at: $run.created_at,
                  updated_at: $run.updated_at,
                  run_started_at: $run.run_started_at,
                  html_url: $run.html_url
                } else null end),
                jobs: [($jobs[0].jobs // [])[] | {
                  id,
                  name,
                  status,
                  conclusion,
                  started_at,
                  completed_at,
                  html_url,
                  steps: [.steps[]? | {name, status, conclusion, number}]
                }],
                sanitized_diagnostic: $diagnostic
              }
            ' > "${REPORT_PATH}"

      - name: Commit workflow status report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "${REPORT_PATH}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record first Social Factory render workflow status [skip ci]'
          git push origin HEAD:main
