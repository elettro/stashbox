name: One-Time Diagnose Social Scheduled Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-diagnose-social-scheduled-infra.yml'

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REPORT_PATH: deployment-reports/no-title-default-runs.json

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Capture no-title and deployment runs
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${REPORT_PATH}")"
          gh api "repos/${REPOSITORY}/actions/runs?per_page=100" > /tmp/all-runs.json

          jq '
            [.workflow_runs[] |
              select(.path == ".github/workflows/one-time-default-video-renders-no-titles.yml" or
                     .path == ".github/workflows/deploy-true-dev-lambda.yml" or
                     .path == ".github/workflows/deploy-social-factory-api-dev.yml") |
              {id, name, path, event, status, conclusion, created_at, updated_at, head_sha, html_url}
            ]
          ' /tmp/all-runs.json > /tmp/selected-runs.json

          NO_TITLE_RUN_ID=$(jq -r '[.[] | select(.path == ".github/workflows/one-time-default-video-renders-no-titles.yml")][0].id // empty' /tmp/selected-runs.json)
          if [ -n "${NO_TITLE_RUN_ID}" ]; then
            gh api "repos/${REPOSITORY}/actions/runs/${NO_TITLE_RUN_ID}/jobs?per_page=100" > /tmp/no-title-jobs.json
          else
            printf '%s\n' '{"jobs":[]}' > /tmp/no-title-jobs.json
          fi

          jq -n \
            --arg recorded_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --slurpfile runs /tmp/selected-runs.json \
            --slurpfile jobs /tmp/no-title-jobs.json '
            {
              recorded_at:$recorded_at,
              runs:$runs[0],
              latest_no_title_jobs:($jobs[0].jobs | map({id,name,status,conclusion,started_at,completed_at,steps:(.steps | map({name,status,conclusion,number}))}))
            }' > "${REPORT_PATH}"

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${REPORT_PATH}"
          git commit -m 'Record no-title default workflow status [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

# No-title workflow diagnostic snapshot refresh.
