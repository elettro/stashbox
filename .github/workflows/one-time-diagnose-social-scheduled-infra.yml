name: One-Time Diagnose Social Scheduled Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-diagnose-social-scheduled-infra.yml'

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REPORT_PATH: deployment-reports/social-factory-repair-runs.md

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Capture repair and deploy runs
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${REPORT_PATH}")"
          {
            echo '# Social Factory Repair Workflow Runs'
            echo
            echo "Captured: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            for WORKFLOW in \
              one-time-repair-social-scheduled-infra.yml \
              one-time-repair-social-scheduled-infra-v2.yml \
              deploy-social-factory-api-dev.yml; do
              echo "## ${WORKFLOW}"
              gh run list \
                --repo "${REPOSITORY}" \
                --workflow "${WORKFLOW}" \
                --limit 5 \
                --json databaseId,status,conclusion,createdAt,updatedAt,url,event,headSha \
                --jq '.[] | "- Run ID: \(.databaseId) | status=\(.status) | conclusion=\(.conclusion // \"pending\") | event=\(.event) | created=\(.createdAt) | head=\(.headSha) | url=\(.url)"' || true
              echo
            done
          } > "${REPORT_PATH}"

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${REPORT_PATH}"
          git commit -m 'Record Social Factory repair workflow runs [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
