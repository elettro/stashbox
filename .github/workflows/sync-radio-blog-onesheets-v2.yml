name: Sync Radio Blog One-Sheets V2

on:
  push:
    paths:
      - '.github/workflows/sync-radio-blog-onesheets-v2.yml'
      - '.github/scripts/sync_radio_blog_onesheets.py'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update blog
        run: python .github/scripts/sync_radio_blog_onesheets.py
      - name: Commit changes
        run: |
          git config user.name "elettro"
          git config user.email "dpalermo@elettro.com"
          git add radio/blog/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Sync Radio blog one-sheet collection"
          git pull --rebase origin main
          git push origin main
