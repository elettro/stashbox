name: Admin Migration Video Factory QA

on:
  push:
    branches:
      - feature/admin-unification-1077
    paths:
      - 'radio-admin/staging/video-factory/**'
      - 'radio-admin/staging/tests/video-factory-write-smoke.mjs'
      - 'radio-admin/staging/admin-env.js'
      - '.github/workflows/admin-migration-video-factory-qa.yml'
  pull_request:
    paths:
      - 'radio-admin/staging/video-factory/**'
      - 'radio-admin/staging/tests/video-factory-write-smoke.mjs'
      - 'radio-admin/staging/admin-env.js'
      - '.github/workflows/admin-migration-video-factory-qa.yml'

permissions:
  contents: read

jobs:
  video-factory-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check Video Factory staging JavaScript
        run: |
          node --check radio-admin/staging/admin-env.js
          node --check radio-admin/staging/video-factory/migration-guard.js
          node --check radio-admin/staging/video-factory/video-factory.js
          node --check radio-admin/staging/video-factory/video-factory-resolution-preview.js
          node --check radio-admin/staging/video-factory/video-factory-archive.js
          node --check radio-admin/staging/tests/video-factory-write-smoke.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/video-factory-staging-http.log 2>&1 &
          echo $! > /tmp/video-factory-staging-http.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/radio-admin/staging/video-factory/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/video-factory-staging-http.log
          exit 1

      - name: Run DEV Video Factory lifecycle and boundary browser smoke test
        run: node radio-admin/staging/tests/video-factory-write-smoke.mjs

      - name: Assert Video Factory staging boundary
        run: |
          grep -q './migration-guard.js' radio-admin/staging/video-factory/index.html
          grep -q "assertWriteAllowed('dev', 'video-factory')" radio-admin/staging/video-factory/migration-guard.js
          grep -q 'stashbox-radio-video-factory-dev-' radio-admin/staging/video-factory/migration-guard.js
          grep -q 'Blocked Video Factory request to PROD API' radio-admin/staging/video-factory/migration-guard.js
          grep -q 'Blocked Video Factory signed asset URL outside the expected DEV private render bucket' radio-admin/staging/video-factory/migration-guard.js
          if grep -E "je3zud66nb\.execute-api|radio_admin_token_prod|getEnvironment\(['\"]prod['\"]\)" radio-admin/staging/video-factory/video-factory.js radio-admin/staging/video-factory/video-factory-archive.js radio-admin/staging/video-factory/index.html; then
            echo 'Video Factory staging contains an unapproved PROD API, PROD environment, or PROD token binding.'
            exit 1
          fi
