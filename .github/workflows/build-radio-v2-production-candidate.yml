name: Build Radio V2 production candidate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.release-radio-v2-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/radio-v2-live-2026-08-22

      - name: Build production-wired V2 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf radio/v2
          cp -a radio/dev/v2 radio/v2

          python3 - <<'PY'
          from pathlib import Path

          root = Path('radio/v2')
          text_suffixes = {
              '.html', '.htm', '.js', '.mjs', '.cjs', '.css', '.json', '.md',
              '.txt', '.webmanifest', '.xml', '.sh', '.yml', '.yaml'
          }

          replacements = [
              ('https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev',
               'https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2'),
              ('d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev',
               'je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2'),
              ('/radio/dev/v2/', '/radio/v2/'),
              ('radio/dev/v2/', 'radio/v2/'),
              ('/radio/dev/', '/radio/'),
              ('radio/dev/', 'radio/'),
              ('stashbox_radio_dev_cognito_tokens', 'stashbox_radio_prod_cognito_tokens'),
              ('stashbox-radio-rds-dev-session-id', 'stashbox-radio-rds-prod-session-id'),
              ('stashbox-radio-offline', 'stashbox-radio-offline-prod'),
          ]

          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # Health diagnostics should report the production catalog as production,
          # not carry forward the DEV source label after endpoint substitution.
          health = root / 'v2-health.js'
          text = health.read_text(encoding='utf-8')
          text = text.replace(
              "if (names.some(name => name.includes('je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2/radio/songs'))) return 'dev';",
              "if (names.some(name => name.includes('je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2/radio/songs'))) return 'production';"
          )
          health.write_text(text, encoding='utf-8')

          public = root / 'index.html'
          text = public.read_text(encoding='utf-8')
          text = text.replace('<meta name="robots" content="noindex,nofollow">\n', '')
          text = text.replace('<meta name="robots" content="noindex,nofollow">', '')
          text = text.replace('https://stashbox.com/radio/v2/', 'https://stashbox.com/radio/')
          text = text.replace('<title>Stashbox Radio DEV V2</title>', '<title>Stashbox Radio | Streaming Player</title>')
          text = text.replace('The mobile-first Stashbox Radio V2 public discovery feed and full-screen player.',
                              'Stashbox Radio music discovery, full-screen playback, visual experiences, artist profiles, and playlists.')
          public.write_text(text, encoding='utf-8')

          desktop = root / 'desktop' / 'index.html'
          text = desktop.read_text(encoding='utf-8')
          text = text.replace('<meta name="robots" content="noindex,nofollow">\n', '')
          text = text.replace('<meta name="robots" content="noindex,nofollow">', '')
          text = text.replace('<title>Stashbox Radio DEV V2</title>', '<title>Stashbox Radio | Streaming Player</title>')
          text = text.replace('Stashbox Radio DEV V2 clean desktop runtime.', 'Stashbox Radio desktop streaming player.')
          if 'rel="canonical"' not in text:
              text = text.replace('</title>', '</title>\n  <link rel="canonical" href="https://stashbox.com/radio/">', 1)
          desktop.write_text(text, encoding='utf-8')

          Path('radio/v2/PRODUCTION_BUILD_REPORT.txt').write_text(
              'Stashbox Radio V2 production candidate\n'
              'Source: radio/dev/v2\n'
              'Public runtime: radio/v2\n'
              'API: https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2\n'
              f'Text files rewritten: {len(changed)}\n',
              encoding='utf-8'
          )
          PY

      - name: Production safety scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude='PRODUCTION_BUILD_REPORT.txt' 'd21fbe6u80.execute-api.us-east-1.amazonaws.com/dev' radio/v2; then
            echo 'ERROR: DEV API endpoint remains in production candidate.'
            exit 1
          fi
          if grep -RIn --exclude='PRODUCTION_BUILD_REPORT.txt' '/radio/dev/' radio/v2; then
            echo 'ERROR: /radio/dev/ route remains in production candidate.'
            exit 1
          fi
          if grep -RIn --exclude='PRODUCTION_BUILD_REPORT.txt' 'stashbox_radio_dev_cognito_tokens' radio/v2; then
            echo 'ERROR: DEV Cognito storage key remains in production candidate.'
            exit 1
          fi
          echo 'Production candidate safety scan passed.'

      - name: Commit converted candidate to release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio/v2
          if git diff --cached --quiet; then
            echo 'Production candidate already current.'
            exit 0
          fi
          git commit -m 'Build production-wired Stashbox Radio V2 candidate'
          git push origin HEAD:release/radio-v2-live-2026-08-22
