name: Convert Social Factory Scheduled Queue to FIFO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/convert-social-factory-scheduled-queue-to-fifo.yml'

permissions:
  contents: write

concurrency:
  group: convert-social-factory-scheduled-queue-to-fifo
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Apply FIFO queue conversion
        run: |
          set +e
          (
            set -euo pipefail
            python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'social-factory-api/schedule-publish.mjs',
              "          RoleArn: targetRoleArn,\n          Input: JSON.stringify({",
              "          RoleArn: targetRoleArn,\n          SqsParameters: { MessageGroupId: 'scheduled-publish' },\n          Input: JSON.stringify({"
          )

          replace_once(
              'social-factory-api/infrastructure/template.yaml',
              "      QueueName: stashbox-social-publish-dev-dlq\n      MessageRetentionPeriod: 1209600",
              "      QueueName: stashbox-social-publish-dev-dlq.fifo\n      FifoQueue: true\n      ContentBasedDeduplication: true\n      MessageRetentionPeriod: 1209600"
          )
          replace_once(
              'social-factory-api/infrastructure/template.yaml',
              "      QueueName: stashbox-social-publish-dev\n      VisibilityTimeout: 960",
              "      QueueName: stashbox-social-publish-dev.fifo\n      FifoQueue: true\n      ContentBasedDeduplication: true\n      VisibilityTimeout: 960"
          )
          replace_once(
              'social-factory-api/infrastructure/template.yaml',
              "      ReservedConcurrentExecutions: 1\n",
              ""
          )

          replace_once(
              '.github/workflows/deploy-social-factory-api-dev.yml',
              "      EXPECTED_SCHEDULE_QUEUE_NAME: stashbox-social-publish-dev\n      EXPECTED_SCHEDULE_DLQ_NAME: stashbox-social-publish-dev-dlq",
              "      EXPECTED_SCHEDULE_QUEUE_NAME: stashbox-social-publish-dev.fifo\n      EXPECTED_SCHEDULE_DLQ_NAME: stashbox-social-publish-dev-dlq.fifo"
          )
          replace_once(
              '.github/workflows/deploy-social-factory-api-dev.yml',
              "--attribute-names QueueArn VisibilityTimeout RedrivePolicy SqsManagedSseEnabled)",
              "--attribute-names QueueArn VisibilityTimeout RedrivePolicy SqsManagedSseEnabled FifoQueue ContentBasedDeduplication)"
          )
          replace_once(
              '.github/workflows/deploy-social-factory-api-dev.yml',
              ".Attributes.SqsManagedSseEnabled == \"true\" and\n              ((.Attributes.RedrivePolicy | fromjson).deadLetterTargetArn == $dlq)",
              ".Attributes.SqsManagedSseEnabled == \"true\" and\n              .Attributes.FifoQueue == \"true\" and\n              .Attributes.ContentBasedDeduplication == \"true\" and\n              ((.Attributes.RedrivePolicy | fromjson).deadLetterTargetArn == $dlq)"
          )
          PY
          ) 2>&1 | tee /tmp/fifo-apply.log
          APPLY_EXIT_CODE=${PIPESTATUS[0]}
          echo "${APPLY_EXIT_CODE}" > /tmp/fifo-apply.exit
          exit "${APPLY_EXIT_CODE}"

      - name: Validate converted source
        working-directory: social-factory-api
        run: |
          set +e
          (
            set -euo pipefail
            npm run check
            npm test
            sam validate --template-file infrastructure/template.yaml --lint
          ) 2>&1 | tee /tmp/fifo-validation.log
          VALIDATION_EXIT_CODE=${PIPESTATUS[0]}
          echo "${VALIDATION_EXIT_CODE}" > /tmp/fifo-validation.exit
          exit "${VALIDATION_EXIT_CODE}"

      - name: Commit FIFO queue conversion
        run: |
          set +e
          (
            set -euo pipefail
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            git add \
              social-factory-api/schedule-publish.mjs \
              social-factory-api/infrastructure/template.yaml \
              .github/workflows/deploy-social-factory-api-dev.yml

            if git diff --cached --quiet; then
              echo 'FIFO queue conversion already applied.'
              exit 0
            fi

            git commit -m 'Serialize Social Factory scheduled publishing with FIFO [skip ci]'
            git push origin main
          ) 2>&1 | tee /tmp/fifo-commit.log
          COMMIT_EXIT_CODE=${PIPESTATUS[0]}
          echo "${COMMIT_EXIT_CODE}" > /tmp/fifo-commit.exit
          exit "${COMMIT_EXIT_CODE}"

      - name: Record FIFO conversion receipt
        if: always()
        env:
          CONVERSION_STATUS: ${{ job.status }}
        run: |
          set +e

          APPLY_EXIT_CODE=$(cat /tmp/fifo-apply.exit 2>/dev/null)
          VALIDATION_EXIT_CODE=$(cat /tmp/fifo-validation.exit 2>/dev/null)
          COMMIT_EXIT_CODE=$(cat /tmp/fifo-commit.exit 2>/dev/null)
          APPLY_SUMMARY=$(tail -n 40 /tmp/fifo-apply.log 2>/dev/null | tail -c 5000)
          VALIDATION_SUMMARY=$(tail -n 80 /tmp/fifo-validation.log 2>/dev/null | tail -c 9000)
          COMMIT_SUMMARY=$(tail -n 40 /tmp/fifo-commit.log 2>/dev/null | tail -c 5000)
          RECORDED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          jq -n \
            --arg status "${CONVERSION_STATUS}" \
            --arg recorded_at "${RECORDED_AT}" \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_url "${RUN_URL}" \
            --arg apply_exit_code "${APPLY_EXIT_CODE}" \
            --arg validation_exit_code "${VALIDATION_EXIT_CODE}" \
            --arg commit_exit_code "${COMMIT_EXIT_CODE}" \
            --arg apply_summary "${APPLY_SUMMARY}" \
            --arg validation_summary "${VALIDATION_SUMMARY}" \
            --arg commit_summary "${COMMIT_SUMMARY}" \
            '{
              status: $status,
              recorded_at: $recorded_at,
              commit_sha: $commit_sha,
              run_id: $run_id,
              run_url: $run_url,
              apply_exit_code: $apply_exit_code,
              validation_exit_code: $validation_exit_code,
              commit_exit_code: $commit_exit_code,
              apply_summary: $apply_summary,
              validation_summary: $validation_summary,
              commit_summary: $commit_summary
            }' > /tmp/social-factory-fifo-conversion.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          mkdir -p deployment-reports
          cp /tmp/social-factory-fifo-conversion.json deployment-reports/social-factory-fifo-conversion.json
          git add deployment-reports/social-factory-fifo-conversion.json

          if git diff --cached --quiet; then
            echo 'FIFO conversion receipt already current.'
            exit 0
          fi

          git commit -m 'Record Social Factory FIFO conversion [skip ci]'
          git push origin main
