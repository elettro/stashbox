name: Refresh Radio PROD Catalog Fallback

on:
  push:
    branches: [main]
    paths:
      - '.refresh-radio-prod-catalog-fallback'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch production catalog snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 5 --retry-delay 2 \
            'https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2/radio/songs' \
            -o /tmp/catalog.json
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/catalog.json','utf8'));const a=Array.isArray(p)?p:(p.songs||p.items||p.data||[]);if(!Array.isArray(a)||a.length<1)process.exit(2);console.log('songs='+a.length)"
      - name: Commit same-origin fallback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/catalog.json radio/catalog-fallback.json
            git add radio/catalog-fallback.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh production radio catalog fallback [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
