name: Deploy DEV Song Artwork Module

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-song-artwork-dev.yml'
      - 'radio-api/song-artwork-routes.mjs'
      - 'radio-api/migrations/20260728_song_artwork_images_dev.sql'
      - 'radio-admin/songs/dev/song-images.js'
      - 'radio-admin/songs/dev/song-images-zip.js'
      - 'radio-admin/songs/dev/song-images-presign-route.js'
      - 'radio-admin/dev/app.js'

permissions:
  contents: read
  actions: write

jobs:
  validate-and-dispatch:
    name: Validate, deploy, and verify through TRUE DEV
    runs-on: ubuntu-latest
    env:
      TRUE_DEV_API_BASE: https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Song Artwork source
        run: |
          node --check radio-api/song-artwork-routes.mjs
          node --check radio-admin/songs/dev/song-images.js
          node --check radio-admin/songs/dev/song-images-zip.js
          node --check radio-admin/songs/dev/song-images-presign-route.js
          node --check radio-admin/dev/app.js
          grep -q "song-artwork-routes.mjs" radio-api/video-factory/entry.mjs
          grep -q "song-images-presign-route.js" radio-admin/dev/app.js
          grep -q "song-images.js" radio-admin/dev/app.js
          grep -q "song-images-zip.js" radio-admin/dev/app.js

      - name: Dispatch established TRUE DEV deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-true-dev-lambda.yml --ref main
          sleep 8
          RUN_ID=$(gh run list \
            --workflow=deploy-true-dev-lambda.yml \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          test -n "${RUN_ID}"
          echo "Waiting for TRUE DEV deployment run ${RUN_ID}."
          gh run watch "${RUN_ID}" --exit-status

      - name: Verify Song Artwork routes are live
        run: |
          set -euo pipefail
          ARTWORK_STATUS=$(curl --silent --show-error --max-time 45 \
            -o /tmp/song-artwork-route.json \
            -w '%{http_code}' \
            "${TRUE_DEV_API_BASE}/radio/admin/songs/song-artwork-route-probe/artwork-images")
          test "${ARTWORK_STATUS}" = '401'

          PRESIGN_STATUS=$(curl --silent --show-error --max-time 45 \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"ratio":"1x1","filename":"route-probe.png","content_type":"image/png","size_bytes":1}' \
            -o /tmp/song-artwork-presign-route.json \
            -w '%{http_code}' \
            "${TRUE_DEV_API_BASE}/radio/admin/songs/song-artwork-route-probe/artwork-images/presign")
          test "${PRESIGN_STATUS}" = '401'

          echo 'Song Artwork media and presign routes are live behind admin authentication.'
