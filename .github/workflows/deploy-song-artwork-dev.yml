name: Deploy DEV Song Artwork Module

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-song-artwork-dev.yml'
      - 'radio-api/song-artwork-routes.mjs'
      - 'radio-api/migrations/20260728_song_artwork_images_dev.sql'

permissions:
  contents: read
  actions: write

jobs:
  validate-and-dispatch:
    name: Validate and deploy through TRUE DEV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Song Artwork source
        run: |
          node --check radio-api/song-artwork-routes.mjs
          node --check radio-admin/songs/dev/song-images.js
          grep -q "song-artwork-routes.mjs" radio-api/video-factory/entry.mjs
          grep -q "song-images.js" radio-admin/dev/app.js

      - name: Dispatch established TRUE DEV deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-true-dev-lambda.yml --ref main
