name: One-time promote DEV VEC to PROD v2

on:
  push:
    branches: [main]
    paths:
      - '.promote-dev-vec-to-prod-v2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-promote-dev-vec-to-prod-v2
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Run guarded VEC promotion
        id: promote
        continue-on-error: true
        run: node .github/scripts/promote-dev-vec-to-prod-v2.mjs
      - name: Preserve result report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-to-prod-vec-promotion-v2
          path: radio/docs/diagnostics/DEV_TO_PROD_VEC_PROMOTION_V2_LATEST.json
          if-no-files-found: warn
      - name: Record promotion report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f radio/docs/diagnostics/DEV_TO_PROD_VEC_PROMOTION_V2_LATEST.json || exit 0
          cp radio/docs/diagnostics/DEV_TO_PROD_VEC_PROMOTION_V2_LATEST.json /tmp/report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p radio/docs/diagnostics
            cp /tmp/report.json radio/docs/diagnostics/DEV_TO_PROD_VEC_PROMOTION_V2_LATEST.json
            git add radio/docs/diagnostics/DEV_TO_PROD_VEC_PROMOTION_V2_LATEST.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record DEV to PROD VEC promotion v2 [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Enforce migration result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f radio/docs/diagnostics/DEV_TO_PROD_VEC_PROMOTION_V2_LATEST.json
          jq -e '.ok == true' radio/docs/diagnostics/DEV_TO_PROD_VEC_PROMOTION_V2_LATEST.json >/dev/null
