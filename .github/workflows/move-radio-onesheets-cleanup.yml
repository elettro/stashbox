name: Move Radio One-Sheets Cleanup

on:
  push:
    paths:
      - '.github/workflows/move-radio-onesheets-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move industry examples and remove old one-sheets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p radio/onesheets
          if [ -d "onesheets/industry-examples" ]; then
            mv "onesheets/industry-examples" "radio/onesheets/industry-examples"
          fi

          rm -f \
            "onesheets/Social Factory YouTube.png" \
            "onesheets/Social Factory-process.png" \
            "onesheets/Stashbox Radio - OneSheet-July2026 (1).png" \
            "onesheets/Stashbox Radio - OneSheet-July2026 (3).png" \
            "onesheets/Stashbox Radio - OneSheet-July2026 (4).png" \
            "onesheets/Stashbox Radio - OneSheet-July2026 (5).png" \
            "onesheets/Stashbox Radio - OneSheet-July2026 (6).png" \
            "onesheets/Stashbox Radio - OneSheet-July2026 -- add .png" \
            "onesheets/Stashbox_Custom_GPT_How_To_Use_One_Sheet.png"

          python - <<'PY'
          from pathlib import Path
          p = Path('radio/blog/index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('/onesheets/industry-examples/', '/radio/onesheets/industry-examples/')
          lines = text.splitlines()
          lines = [line for line in lines if "{type:'one-sheet'" not in line]
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "elettro"
          git config user.email "dpalermo@elettro.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Move industry examples into radio and clean one-sheets"
          git push origin main
