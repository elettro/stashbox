name: Inspect Task Refresh Render

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-inspect-task-refresh-render.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TARGET_WORKFLOW: one-time-refresh-video-factory-task-definition-and-retry.yml
      REPORT_PATH: deployment-reports/task-refresh-render-workflow-status.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Wait for target workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          DEADLINE=$(( $(date +%s) + 3900 ))
          mkdir -p "$(dirname "${REPORT_PATH}")"

          while true; do
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${API}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=5" \
              > /tmp/target-runs.json

            RUN_ID=$(jq -r '.workflow_runs[0].id // empty' /tmp/target-runs.json)
            STATUS=$(jq -r '.workflow_runs[0].status // empty' /tmp/target-runs.json)
            if [ -n "${RUN_ID}" ] && [ "${STATUS}" = 'completed' ]; then break; fi
            if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
              echo 'Timed out waiting for task refresh workflow.' >&2
              exit 1
            fi
            sleep 15
          done

          curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API}/actions/runs/${RUN_ID}/jobs?per_page=20" \
            > /tmp/target-jobs.json

          RECORDED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg recorded_at "${RECORDED_AT}" \
            --slurpfile runs /tmp/target-runs.json \
            --slurpfile jobs /tmp/target-jobs.json '
              ($runs[0].workflow_runs[0] // null) as $run |
              {
                recorded_at: $recorded_at,
                latest_run: (if $run then {
                  id: $run.id,
                  status: $run.status,
                  conclusion: $run.conclusion,
                  head_sha: $run.head_sha,
                  created_at: $run.created_at,
                  updated_at: $run.updated_at,
                  html_url: $run.html_url
                } else null end),
                jobs: [($jobs[0].jobs // [])[] | {
                  id,
                  name,
                  status,
                  conclusion,
                  steps: [.steps[]? | {name, status, conclusion, number}]
                }]
              }
            ' > "${REPORT_PATH}"

      - name: Commit target status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${REPORT_PATH}" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "${REPORT_PATH}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record task refresh render workflow status [skip ci]'
          git push origin HEAD:main
