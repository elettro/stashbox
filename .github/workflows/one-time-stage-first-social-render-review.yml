name: Stage First Social Render Review
# Trigger server-to-server staging for the completed Hippy Speedball render.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-stage-first-social-render-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      SOCIAL_CONFIG_SECRET: stashbox/social-factory/dev/youtube-oauth/config
      SOCIAL_API_BASE: https://tnrca1ff32.execute-api.us-east-1.amazonaws.com/dev
      JOB_ID: cc50acd7-014d-492f-89ac-682c8894240e
      REPORT_PATH: deployment-reports/social-factory-first-staged-review.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stage completed render server-to-server
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$(dirname "${REPORT_PATH}")"

          aws secretsmanager get-secret-value \
            --secret-id "${SOCIAL_CONFIG_SECRET}" \
            --query SecretString \
            --output text > /tmp/social-config.json
          SOCIAL_ADMIN_TOKEN=$(jq -r '.admin_token' /tmp/social-config.json)

          STAGE_STATUS=$(curl --silent --show-error --max-time 300 \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "x-admin-token: ${SOCIAL_ADMIN_TOKEN}" \
            -d '{"confirm_stage":true}' \
            -o /tmp/staged-review.json \
            -w '%{http_code}' \
            "${SOCIAL_API_BASE}/social/orchestration/render-jobs/${JOB_ID}/stage")

          test "${STAGE_STATUS}" = '200'
          jq -e '
            .ok == true and
            .staged == true and
            .review_item.status == "in_review" and
            .review_item.approval_state == "pending" and
            .review_item.publishing_status == "not_published" and
            .review_item.video.object_key | startswith("incoming/render-jobs/")
          ' /tmp/staged-review.json >/dev/null

          REVIEW_ID=$(jq -r '.review_item.id' /tmp/staged-review.json)
          REVIEW_STATUS=$(curl --silent --show-error --max-time 90 \
            -H "x-admin-token: ${SOCIAL_ADMIN_TOKEN}" \
            -o /tmp/review-item.json \
            -w '%{http_code}' \
            "${SOCIAL_API_BASE}/social/review-items/${REVIEW_ID}")
          test "${REVIEW_STATUS}" = '200'
          jq -e '.ok == true and .item.id == $id' --arg id "${REVIEW_ID}" /tmp/review-item.json >/dev/null

          BUCKET=$(jq -r '.review_item.video.bucket' /tmp/staged-review.json)
          OBJECT_KEY=$(jq -r '.review_item.video.object_key' /tmp/staged-review.json)
          aws s3api head-object --bucket "${BUCKET}" --key "${OBJECT_KEY}" >/tmp/staged-head.json

          RECORDED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg recorded_at "${RECORDED_AT}" \
            --arg stage_http_status "${STAGE_STATUS}" \
            --arg review_http_status "${REVIEW_STATUS}" \
            --slurpfile stage /tmp/staged-review.json \
            --slurpfile head /tmp/staged-head.json '
              ($stage[0].review_item) as $item |
              {
                status: "success",
                recorded_at: $recorded_at,
                stage_http_status: $stage_http_status,
                review_http_status: $review_http_status,
                review_item: {
                  id: $item.id,
                  status: $item.status,
                  approval_state: $item.approval_state,
                  publishing_status: $item.publishing_status,
                  source: $item.source,
                  song: $item.song,
                  video: $item.video,
                  metadata: $item.metadata,
                  publish_settings: $item.publish_settings,
                  automation: $item.automation,
                  created_at: $item.created_at
                },
                staged_object: {
                  content_length: ($head[0].ContentLength // 0),
                  content_type: ($head[0].ContentType // "")
                },
                youtube_published: false
              }
            ' > "${REPORT_PATH}"

          rm -f /tmp/social-config.json /tmp/staged-review.json /tmp/review-item.json /tmp/staged-head.json
          unset SOCIAL_ADMIN_TOKEN

      - name: Commit staged review receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add "${REPORT_PATH}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record first staged Social Factory review [skip ci]'
          git push origin HEAD:main
