name: Sync Radio Blog One-Sheets

on:
  push:
    paths:
      - '.github/workflows/sync-radio-blog-onesheets.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync One-Sheets into Radio blog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('radio/blog/index.html')
          text = p.read_text(encoding='utf-8')

          # Remove any existing one-sheet item rows so this becomes a clean folder sync.
          lines = text.splitlines()
          lines = [line for line in lines if '"type":"one-sheet"' not in line and "type:'one-sheet'" not in line]
          text = '\n'.join(lines) + '\n'

          entries = '''      {"type":"one-sheet","title":"Social Factory YouTube","description":"A Stashbox Radio one-sheet focused on the Social Factory workflow for YouTube content creation and publishing.","image":"/radio/onesheets/Social%20Factory%20YouTube.png","url":"/radio/onesheets/Social%20Factory%20YouTube.png","search":"social factory youtube video publishing stashbox radio one sheet"},
      {"type":"one-sheet","title":"Social Factory Process","description":"A visual one-sheet explaining the Stashbox Radio Social Factory process from content selection through finished social output.","image":"/radio/onesheets/Social%20Factory-process.png","url":"/radio/onesheets/Social%20Factory-process.png","search":"social factory process workflow content video stashbox radio one sheet"},
      {"type":"one-sheet","title":"Stashbox Radio One-Sheet · July 2026 · 1","description":"A July 2026 Stashbox Radio platform one-sheet covering the ecosystem, capabilities and current product direction.","image":"/radio/onesheets/Stashbox%20Radio%20-%20OneSheet-July2026%20%281%29.png","url":"/radio/onesheets/Stashbox%20Radio%20-%20OneSheet-July2026%20%281%29.png","search":"stashbox radio july 2026 one sheet platform ecosystem"},
      {"type":"one-sheet","title":"Stashbox Radio One-Sheet · July 2026 · 3","description":"A July 2026 Stashbox Radio one-sheet documenting the growing radio, visual, audience and commerce platform.","image":"/radio/onesheets/Stashbox%20Radio%20-%20OneSheet-July2026%20%283%29.png","url":"/radio/onesheets/Stashbox%20Radio%20-%20OneSheet-July2026%20%283%29.png","search":"stashbox radio july 2026 one sheet radio visual audience commerce"},
      {"type":"one-sheet","title":"Stashbox Radio One-Sheet · July 2026 · 4","description":"A July 2026 platform explainer highlighting Stashbox Radio features, workflows and ecosystem value.","image":"/radio/onesheets/Stashbox%20Radio%20-%20OneSheet-July2026%20%284%29.png","url":"/radio/onesheets/Stashbox%20Radio%20-%20OneSheet-July2026%20%284%29.png","search":"stashbox radio july 2026 one sheet features workflows value"},
      {"type":"one-sheet","title":"Stashbox Radio One-Sheet · July 2026 · 5","description":"A July 2026 Stashbox Radio visual summary of platform capabilities and connected content operations.","image":"/radio/onesheets/Stashbox%20Radio%20-%20OneSheet-July2026%20%285%29.png","url":"/radio/onesheets/Stashbox%20Radio%20-%20OneSheet-July2026%20%285%29.png","search":"stashbox radio july 2026 one sheet platform capabilities content operations"},
      {"type":"one-sheet","title":"Stashbox Radio One-Sheet · July 2026 · 6","description":"A July 2026 Stashbox Radio one-sheet presenting the platform ecosystem and its connected media capabilities.","image":"/radio/onesheets/Stashbox%20Radio%20-%20OneSheet-July2026%20%286%29.png","url":"/radio/onesheets/Stashbox%20Radio%20-%20OneSheet-July2026%20%286%29.png","search":"stashbox radio july 2026 one sheet ecosystem media capabilities"},
      {"type":"one-sheet","title":"Stashbox Radio One-Sheet · July 2026 · Addendum","description":"An additional July 2026 Stashbox Radio one-sheet expanding the platform story and feature set.","image":"/radio/onesheets/Stashbox%20Radio%20-%20OneSheet-July2026%20--%20add%20.png","url":"/radio/onesheets/Stashbox%20Radio%20-%20OneSheet-July2026%20--%20add%20.png","search":"stashbox radio july 2026 addendum one sheet platform features"},
      {"type":"one-sheet","title":"How to Use the Stashbox Custom GPT","description":"A practical one-sheet explaining how to use the Stashbox Custom GPT as an interface to the Stashbox Radio ecosystem.","image":"/radio/onesheets/Stashbox_Custom_GPT_How_To_Use_One_Sheet.png","url":"/radio/onesheets/Stashbox_Custom_GPT_How_To_Use_One_Sheet.png","search":"stashbox custom gpt how to use radio gpt one sheet"},
'''

          marker = '    const items = [\n'
          if marker not in text:
              raise SystemExit('Could not find blog items array marker')
          text = text.replace(marker, marker + entries, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit blog sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "elettro"
          git config user.email "dpalermo@elettro.com"
          git add radio/blog/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Sync Radio blog one-sheet collection"
          git pull --rebase origin main
          git push origin main
