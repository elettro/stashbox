name: One-Time Repair Social Scheduled Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-repair-social-scheduled-infra.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: repair-social-scheduled-infra
  cancel-in-progress: false

jobs:
  repair-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      AWS_REGION: us-east-1
      STACK_NAME: stashbox-social-api-dev
      SERVICE_ROLE_NAME: stashbox-social-cloudformation-dev-role
      SERVICE_POLICY_NAME: StashboxSocialCloudFormationDev
      WORKER_LOG_GROUP: /aws/lambda/stashbox-social-publish-worker-dev
      DEPLOY_WORKFLOW: deploy-social-factory-api-dev.yml
      REPORT_PATH: deployment-reports/social-factory-scheduled-infra-repair.json

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Apply permanent deployment contract fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if new in text:
                  print(f'already fixed: {path}')
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file.write_text(text.replace(old, new, 1))
              print(f'fixed: {path}')

          deploy = '.github/workflows/deploy-social-factory-api-dev.yml'
          bootstrap = '.github/workflows/bootstrap-social-factory-cloudformation-role.yml'

          replace_once(
              deploy,
              '      EXPECTED_SCHEDULE_QUEUE_NAME: stashbox-social-publish-dev\n      EXPECTED_SCHEDULE_DLQ_NAME: stashbox-social-publish-dev-dlq',
              '      EXPECTED_SCHEDULE_QUEUE_NAME: stashbox-social-publish-dev.fifo\n      EXPECTED_SCHEDULE_DLQ_NAME: stashbox-social-publish-dev-dlq.fifo'
          )
          replace_once(
              deploy,
              '            --attribute-names QueueArn VisibilityTimeout RedrivePolicy SqsManagedSseEnabled)',
              '            --attribute-names QueueArn VisibilityTimeout RedrivePolicy SqsManagedSseEnabled FifoQueue ContentBasedDeduplication)'
          )
          replace_once(
              deploy,
              '              .Attributes.SqsManagedSseEnabled == "true" and\n              ((.Attributes.RedrivePolicy | fromjson).deadLetterTargetArn == $dlq) and',
              '              .Attributes.SqsManagedSseEnabled == "true" and\n              .Attributes.FifoQueue == "true" and\n              .Attributes.ContentBasedDeduplication == "true" and\n              ((.Attributes.RedrivePolicy | fromjson).deadLetterTargetArn == $dlq) and'
          )
          replace_once(
              bootstrap,
              '                "Resource": "arn:aws:logs:${AWS_REGION}:${ACCOUNT_ID}:log-group:/aws/lambda/stashbox-social-*:*"',
              '                "Resource": [\n                  "arn:aws:logs:${AWS_REGION}:${ACCOUNT_ID}:log-group:/aws/lambda/stashbox-social-*",\n                  "arn:aws:logs:${AWS_REGION}:${ACCOUNT_ID}:log-group:/aws/lambda/stashbox-social-*:*"\n                ]'
          )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/deploy-social-factory-api-dev.yml \
            .github/workflows/bootstrap-social-factory-cloudformation-role.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Social Factory scheduled deployment contract [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Remove orphan and repair live CloudFormation role
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STACK_ID=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackId' --output text)
          STACK_STATUS_BEFORE=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text)
          STACK_ROLE=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].RoleARN' --output text)
          EXPECTED_ROLE="arn:aws:iam::${ACCOUNT_ID}:role/${SERVICE_ROLE_NAME}"
          test "${STACK_ROLE}" = "${EXPECTED_ROLE}"

          STACK_OWNS_LOG_GROUP=$(aws cloudformation list-stack-resources \
            --stack-name "${STACK_NAME}" \
            --query "length(StackResourceSummaries[?PhysicalResourceId=='${WORKER_LOG_GROUP}'])" \
            --output text)
          test "${STACK_OWNS_LOG_GROUP}" = '0'

          ORPHAN_REMOVED=false
          LOG_GROUP=$(aws logs describe-log-groups \
            --log-group-name-prefix "${WORKER_LOG_GROUP}" \
            --query "logGroups[?logGroupName=='${WORKER_LOG_GROUP}'] | [0]" \
            --output json)
          if [ "${LOG_GROUP}" != 'null' ] && [ -n "${LOG_GROUP}" ]; then
            STORED_BYTES=$(printf '%s' "${LOG_GROUP}" | jq -r '.storedBytes // 0')
            STREAM_COUNT=$(aws logs describe-log-streams \
              --log-group-name "${WORKER_LOG_GROUP}" \
              --max-items 1 \
              --query 'length(logStreams)' \
              --output text)
            test "${STORED_BYTES}" = '0'
            test "${STREAM_COUNT}" = '0'
            aws logs delete-log-group --log-group-name "${WORKER_LOG_GROUP}"
            ORPHAN_REMOVED=true
          fi

          aws iam get-role-policy \
            --role-name "${SERVICE_ROLE_NAME}" \
            --policy-name "${SERVICE_POLICY_NAME}" \
            --query PolicyDocument \
            --output json > /tmp/service-policy.json

          BASE_LOG_ARN="arn:aws:logs:${AWS_REGION}:${ACCOUNT_ID}:log-group:/aws/lambda/stashbox-social-*"
          STREAM_LOG_ARN="${BASE_LOG_ARN}:*"
          jq --arg base "${BASE_LOG_ARN}" --arg streams "${STREAM_LOG_ARN}" '
            (.Statement[] | select(.Sid == "ManageSocialFactoryLogs").Resource) = [$base, $streams]
          ' /tmp/service-policy.json > /tmp/service-policy-fixed.json

          aws iam put-role-policy \
            --role-name "${SERVICE_ROLE_NAME}" \
            --policy-name "${SERVICE_POLICY_NAME}" \
            --policy-document file:///tmp/service-policy-fixed.json

          LIVE_POLICY=$(aws iam get-role-policy \
            --role-name "${SERVICE_ROLE_NAME}" \
            --policy-name "${SERVICE_POLICY_NAME}" \
            --query PolicyDocument \
            --output json)
          echo "${LIVE_POLICY}" | jq -e --arg base "${BASE_LOG_ARN}" --arg streams "${STREAM_LOG_ARN}" '
            ([.Statement[] | select(.Sid == "ManageSocialFactoryLogs")][0]) as $logs |
            $logs.Effect == "Allow" and
            (($logs.Action | if type == "array" then . else [.] end) | index("logs:*")) != null and
            (($logs.Resource | if type == "array" then . else [.] end) | sort) == ([$base, $streams] | sort)
          ' >/dev/null

          jq -n \
            --arg stack_id "${STACK_ID}" \
            --arg stack_status_before "${STACK_STATUS_BEFORE}" \
            --arg stack_role "${STACK_ROLE}" \
            --argjson orphan_removed "${ORPHAN_REMOVED}" \
            '{stack_id:$stack_id,stack_status_before:$stack_status_before,stack_role:$stack_role,orphan_log_group_removed:$orphan_removed,service_role_log_arns_fixed:true}' \
            > /tmp/repair-state.json

      - name: Dispatch and monitor full DEV deployment
        run: |
          set +e
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run "${DEPLOY_WORKFLOW}" --repo "${REPOSITORY}" --ref main
          DISPATCH_EXIT=$?

          RUN_ID=''
          if [ "${DISPATCH_EXIT}" = '0' ]; then
            for attempt in $(seq 1 60); do
              RUN_ID=$(gh run list \
                --repo "${REPOSITORY}" \
                --workflow "${DEPLOY_WORKFLOW}" \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,createdAt \
                --jq "map(select(.createdAt >= \"${DISPATCHED_AT}\"))[0].databaseId // empty")
              [ -n "${RUN_ID}" ] && break
              sleep 5
            done
          fi

          if [ -n "${RUN_ID}" ]; then
            for attempt in $(seq 1 480); do
              STATUS=$(gh run view "${RUN_ID}" --repo "${REPOSITORY}" --json status --jq '.status')
              [ "${STATUS}" = 'completed' ] && break
              sleep 10
            done
            gh run view "${RUN_ID}" --repo "${REPOSITORY}" \
              --json databaseId,status,conclusion,createdAt,updatedAt,url,jobs > /tmp/deploy-run.json
            CONCLUSION=$(jq -r '.conclusion // "unknown"' /tmp/deploy-run.json)
            if [ "${CONCLUSION}" != 'success' ]; then
              gh run view "${RUN_ID}" --repo "${REPOSITORY}" --log-failed > /tmp/deploy-failed.log 2>/dev/null || true
            fi
          else
            CONCLUSION='dispatch_failed'
            jq -n --arg conclusion "${CONCLUSION}" '{status:"completed",conclusion:$conclusion,jobs:[]}' > /tmp/deploy-run.json
          fi

          echo "${CONCLUSION}" > /tmp/deploy-conclusion
          exit 0

      - name: Record repair and deployment result
        if: always()
        run: |
          set -euo pipefail
          RECORDED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          STACK_STATUS_AFTER=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)
          CONCLUSION=$(cat /tmp/deploy-conclusion 2>/dev/null || echo unknown)
          FAILURE_SUMMARY=$(tail -n 120 /tmp/deploy-failed.log 2>/dev/null | tail -c 12000 || true)

          jq -n \
            --arg recorded_at "${RECORDED_AT}" \
            --arg stack_status_after "${STACK_STATUS_AFTER}" \
            --arg deployment_conclusion "${CONCLUSION}" \
            --arg failure_summary "${FAILURE_SUMMARY}" \
            --slurpfile repair /tmp/repair-state.json \
            --slurpfile run /tmp/deploy-run.json '
            {
              status:(if $deployment_conclusion == "success" then "success" else "failure" end),
              recorded_at:$recorded_at,
              source_contract_fixed:true,
              repair:$repair[0],
              deployment:{
                conclusion:$deployment_conclusion,
                run_id:($run[0].databaseId // null),
                status:($run[0].status // null),
                url:($run[0].url // null),
                stack_status_after:$stack_status_after,
                steps:([$run[0].jobs[]?.steps[]? | {name,conclusion,status}]),
                failure_summary:$failure_summary
              },
              production_changed:false
            }' > "${REPORT_PATH}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${REPORT_PATH}"
          git commit -m 'Record Social Factory scheduled infrastructure repair [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Require successful full deployment
        run: |
          test "$(cat /tmp/deploy-conclusion)" = 'success'
