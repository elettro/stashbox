name: Controlled PROD Song Roundtrip

on:
  push:
    branches:
      - feature/admin-unification-1077-cutover-candidate
    paths:
      - '.github/workflows/controlled-prod-song-roundtrip.yml'

permissions:
  contents: read

jobs:
  controlled-prod-song-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_REGION: us-east-1
      PROD_FUNCTION: stashbox-radio-api-prod-v2
      PROD_BASE: https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: feature/admin-unification-1077-cutover-candidate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run one hidden PROD song metadata write and exact revert
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts
          aws lambda get-function-configuration \
            --function-name "$PROD_FUNCTION" \
            --region "$AWS_REGION" \
            > /tmp/prod-lambda.json

          test "$(jq -r '.FunctionName' /tmp/prod-lambda.json)" = 'stashbox-radio-api-prod-v2'
          test "$(jq -r '.Environment.Variables.PGSCHEMA // ""' /tmp/prod-lambda.json)" = 'radio'

          admin_token="$(jq -r '.Environment.Variables.ADMIN_TOKEN // .Environment.Variables.RADIO_ADMIN_TOKEN // empty' /tmp/prod-lambda.json)"
          if [ -z "$admin_token" ]; then
            echo 'PROD Lambda did not expose ADMIN_TOKEN/RADIO_ADMIN_TOKEN to the authorized deployment role.' >&2
            exit 1
          fi
          echo "::add-mask::$admin_token"

          auth=(-H "x-admin-token: $admin_token" -H 'accept: application/json')
          curl --fail-with-body --silent --show-error "${auth[@]}" "$PROD_BASE/admin/songs" > /tmp/admin-before.json

          selected="$(jq -c '[.songs[]? | select(.show_public_note == false and (.featured != true) and ((.public_visibility // "visible") == "visible"))][0] // empty' /tmp/admin-before.json)"
          if [ -z "$selected" ]; then
            echo 'No safe PROD song found with show_public_note=false, featured!=true, and visible status.' >&2
            exit 1
          fi

          song_key="$(jq -r '.song_key' <<<"$selected")"
          if [ -z "$song_key" ] || [ "$song_key" = 'null' ]; then
            echo 'Selected song has no song_key.' >&2
            exit 1
          fi
          encoded_key="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$song_key")"
          original_note_json="$(jq -c '.public_track_note' <<<"$selected")"
          marker="SB-CANONICAL-QA-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          may_have_changed=0
          reverted=0

          make_revert_payload() {
            jq -n --argjson original "$original_note_json" '{public_track_note:$original}' > /tmp/revert.json
          }

          revert_now() {
            make_revert_payload
            curl --fail-with-body --silent --show-error \
              -X PUT "${auth[@]}" -H 'content-type: application/json' \
              --data-binary @/tmp/revert.json \
              "$PROD_BASE/admin/songs/$encoded_key" > /tmp/revert-response.json
            may_have_changed=0
            reverted=1
          }

          cleanup() {
            status=$?
            trap - EXIT
            if [ "$may_have_changed" = '1' ]; then
              echo 'Cleanup: restoring original PROD public_track_note.'
              if ! revert_now; then
                echo 'CRITICAL: automatic PROD revert failed.' >&2
                exit 90
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT

          jq -n --arg marker "$marker" '{public_track_note:$marker}' > /tmp/write.json
          may_have_changed=1
          curl --fail-with-body --silent --show-error \
            -X PUT "${auth[@]}" -H 'content-type: application/json' \
            --data-binary @/tmp/write.json \
            "$PROD_BASE/admin/songs/$encoded_key" > /tmp/write-response.json

          marker_seen_admin=0
          marker_seen_public=0
          for attempt in $(seq 1 20); do
            curl --fail-with-body --silent --show-error "${auth[@]}" "$PROD_BASE/admin/songs" > /tmp/admin-after.json
            curl --fail-with-body --silent --show-error "$PROD_BASE/radio/songs" > /tmp/public-after.json

            if jq -e --arg key "$song_key" --arg marker "$marker" '.songs[]? | select(.song_key==$key) | select(.public_track_note==$marker and .show_public_note==false)' /tmp/admin-after.json >/dev/null; then
              marker_seen_admin=1
            fi
            if jq -e --arg key "$song_key" --arg marker "$marker" '.songs[]? | select(.song_key==$key) | select(.public_track_note==$marker and .show_public_note==false)' /tmp/public-after.json >/dev/null; then
              marker_seen_public=1
            fi
            if [ "$marker_seen_admin" = '1' ] && [ "$marker_seen_public" = '1' ]; then
              break
            fi
            sleep 1
          done

          test "$marker_seen_admin" = '1'
          test "$marker_seen_public" = '1'

          revert_now

          restored_admin=0
          restored_public=0
          for attempt in $(seq 1 20); do
            curl --fail-with-body --silent --show-error "${auth[@]}" "$PROD_BASE/admin/songs" > /tmp/admin-restored.json
            curl --fail-with-body --silent --show-error "$PROD_BASE/radio/songs" > /tmp/public-restored.json

            if jq -e --arg key "$song_key" --argjson original "$original_note_json" '.songs[]? | select(.song_key==$key) | select(.public_track_note==$original and .show_public_note==false)' /tmp/admin-restored.json >/dev/null; then
              restored_admin=1
            fi
            if jq -e --arg key "$song_key" --argjson original "$original_note_json" '.songs[]? | select(.song_key==$key) | select(.public_track_note==$original and .show_public_note==false)' /tmp/public-restored.json >/dev/null; then
              restored_public=1
            fi
            if [ "$restored_admin" = '1' ] && [ "$restored_public" = '1' ]; then
              break
            fi
            sleep 1
          done

          test "$restored_admin" = '1'
          test "$restored_public" = '1'
          test "$reverted" = '1'

          original_type="$(jq -r 'if . == null then "null" else type end' <<<"$original_note_json")"
          jq -n \
            --arg song_key "$song_key" \
            --arg marker "$marker" \
            --arg original_type "$original_type" \
            --argjson marker_seen_admin "$marker_seen_admin" \
            --argjson marker_seen_public "$marker_seen_public" \
            --argjson restored_admin "$restored_admin" \
            --argjson restored_public "$restored_public" \
            '{pass:true,song_key:$song_key,marker:$marker,field:"public_track_note",show_public_note:false,original_value_type:$original_type,prod_admin_verified:($marker_seen_admin==1),prod_public_verified:($marker_seen_public==1),admin_revert_verified:($restored_admin==1),public_revert_verified:($restored_public==1),prod_writes_performed:2,s3_writes_performed:0,route_deployments_performed:0}' \
            > artifacts/controlled-prod-song-roundtrip.json

          cat artifacts/controlled-prod-song-roundtrip.json

      - name: Upload sanitized roundtrip report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-prod-song-roundtrip
          path: artifacts/controlled-prod-song-roundtrip.json
          if-no-files-found: warn
          retention-days: 14
