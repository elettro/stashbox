name: Build DEV Browser Audio Derivatives

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dev-browser-audio-derivatives.yml'
      - 'radio-api/scripts/build-dev-browser-audio-derivatives.mjs'

concurrency:
  group: build-dev-browser-audio-derivatives
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DEV_RADIO_API: https://d21fbe6u80.execute-api.us-east-1.amazonaws.com/dev
      DEV_MEDIA_BUCKET: stashbox-radio-media-dev-us-east-1
      DEV_MEDIA_CDN: https://d1ufj7xan6uxy0.cloudfront.net
      BROWSER_AUDIO_CONCURRENCY: '3'
      BROWSER_AUDIO_MAP_OUTPUT: radio/dev/v2/desktop/browser-audio-map.js
      BROWSER_AUDIO_REPORT_OUTPUT: /tmp/browser-audio-derivatives-report.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure publisher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Build Freedom Street derivative first
        id: fast
        env:
          BROWSER_AUDIO_TITLE_FILTER: Freedom Street
          BROWSER_AUDIO_CONCURRENCY: '1'
        run: |
          set -euo pipefail
          node radio-api/scripts/build-dev-browser-audio-derivatives.mjs
          node --check radio/dev/v2/desktop/browser-audio-map.js
          if ! git diff --quiet -- radio/dev/v2/desktop/browser-audio-map.js; then
            git add radio/dev/v2/desktop/browser-audio-map.js
            git commit -m 'Publish Freedom Street browser-safe audio derivative'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Verify Freedom Street derivative through CDN
        id: verify
        run: |
          set -euo pipefail
          TARGET=$(node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const code = fs.readFileSync('radio/dev/v2/desktop/browser-audio-map.js', 'utf8');
          const sandbox = { window: {} };
          vm.runInNewContext(code, sandbox);
          const map = sandbox.window.STASHBOX_BROWSER_AUDIO_MAP || {};
          const match = Object.entries(map).find(([source]) => source.toLowerCase().includes('freedom-street'));
          if (!match) process.exit(2);
          process.stdout.write(match[1]);
          NODE
          )
          test -n "${TARGET}"
          echo "Browser derivative: ${TARGET}"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 45 \
            -H 'Range: bytes=0-65535' \
            -D /tmp/browser-audio.headers \
            "${TARGET}" -o /tmp/browser-audio.bin
          grep -Eiq '^content-type: *audio/(mpeg|mp3)' /tmp/browser-audio.headers
          test -s /tmp/browser-audio.bin

      - name: Build remaining missing WAV derivatives
        id: full
        run: |
          set -euo pipefail
          unset BROWSER_AUDIO_TITLE_FILTER
          node radio-api/scripts/build-dev-browser-audio-derivatives.mjs
          node --check radio/dev/v2/desktop/browser-audio-map.js
          node --check radio/dev/v2/desktop/desktop-audio-compat.js

      - name: Publish full derivative map
        id: publish
        run: |
          set -euo pipefail
          if git diff --quiet -- radio/dev/v2/desktop/browser-audio-map.js; then
            echo 'Browser audio map already current.'
            exit 0
          fi
          git add radio/dev/v2/desktop/browser-audio-map.js
          git commit -m 'Publish DEV browser-safe audio derivatives'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload derivative rollout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audio-derivatives-${{ github.run_id }}
          path: /tmp/browser-audio-derivatives-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish derivative status issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const vm = require('vm');
            const title = '[Desktop V2 Audio] Browser derivatives';
            let count = 0;
            let freedom = '';
            let report = null;
            try {
              const code = fs.readFileSync('radio/dev/v2/desktop/browser-audio-map.js', 'utf8');
              const sandbox = { window: {} };
              vm.runInNewContext(code, sandbox);
              const map = sandbox.window.STASHBOX_BROWSER_AUDIO_MAP || {};
              count = Object.keys(map).length;
              freedom = Object.entries(map).find(([source]) => source.toLowerCase().includes('freedom-street'))?.[1] || '';
            } catch (_) {}
            try {
              report = JSON.parse(fs.readFileSync('/tmp/browser-audio-derivatives-report.json', 'utf8'));
            } catch (_) {}
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const skipped = Array.isArray(report?.failures) ? report.failures : [];
            const skippedPreview = skipped.slice(0, 12).map(item => `- ${item.title || '(untitled)'}: \`${item.sourceKey || 'unknown'}\` (${item.code || 'failed'})`).join('\n');
            const body = [
              `Source commit: \`${context.sha}\``,
              `Evidence: ${runUrl}`,
              `Freedom Street fast lane: **${{ steps.fast.outcome }}**`,
              `Freedom Street CDN verification: **${{ steps.verify.outcome }}**`,
              `Full catalog build: **${{ steps.full.outcome }}**`,
              `Full map publish: **${{ steps.publish.outcome }}**`,
              `Mappings currently in checkout: **${count}**`,
              report ? `Latest batch: **${report.successful} successful / ${report.failed} skipped / ${report.requested} requested**` : 'Latest batch report: **unavailable**',
              freedom ? `Freedom Street derivative: \`${freedom}\`` : 'Freedom Street derivative: **missing**',
              skippedPreview ? `Skipped stale/problem sources:\n${skippedPreview}` : 'Skipped stale/problem sources: **none reported**'
            ].join('\n\n');
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
            const existing = found.data.items.find(item => item.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body, state: 'open' });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
