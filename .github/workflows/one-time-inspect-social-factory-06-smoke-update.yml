name: Inspect Social Factory 0.6 Smoke Update
# Refresh status after the reliable updater was merged.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-inspect-social-factory-06-smoke-update.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      TARGET_WORKFLOW: one-time-update-social-factory-06-smoke-contract.yml
      REPORT_PATH: deployment-reports/social-factory-06-smoke-update-run.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Inspect update workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${REPORT_PATH}")"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28')

          curl --fail --silent --show-error "${AUTH[@]}" \
            "${API}/actions/workflows/${TARGET_WORKFLOW}/runs?per_page=5" > /tmp/runs.json

          RUN_ID=$(jq -r '.workflow_runs[0].id // empty' /tmp/runs.json)
          if [ -n "${RUN_ID}" ]; then
            curl --fail --silent --show-error "${AUTH[@]}" \
              "${API}/actions/runs/${RUN_ID}/jobs?per_page=20" > /tmp/jobs.json
            JOB_ID=$(jq -r '.jobs[0].id // empty' /tmp/jobs.json)
            if [ -n "${JOB_ID}" ]; then
              curl --fail --location --silent --show-error "${AUTH[@]}" \
                "${API}/actions/jobs/${JOB_ID}/logs" > /tmp/logs.bin || true
            fi
          else
            printf '{"jobs":[]}' > /tmp/jobs.json
          fi

          python <<'PY'
          import io
          import re
          import zipfile
          from pathlib import Path

          source = Path('/tmp/logs.bin')
          target = Path('/tmp/diagnostic.txt')
          if not source.exists():
              target.write_text('', encoding='utf-8')
          else:
              raw = source.read_bytes()
              if raw.startswith(b'PK'):
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                      text = '\n'.join(
                          archive.read(item).decode('utf-8', errors='replace')
                          for item in archive.namelist() if not item.endswith('/')
                      )
              else:
                  text = raw.decode('utf-8', errors='replace')
              pattern = re.compile(r'error|failed|failure|not found|expected|process completed|push rejected|rebase', re.I)
              lines = [line for line in text.splitlines() if pattern.search(line)]
              cleaned = '\n'.join(lines[-80:])
              cleaned = re.sub(r'(?i)(authorization):?\s+\S+', r'\1: [REDACTED]', cleaned)
              cleaned = re.sub(r'(?<![A-Za-z0-9])[A-Za-z0-9_-]{40,}(?![A-Za-z0-9])', '[REDACTED]', cleaned)
              target.write_text(cleaned[:16000], encoding='utf-8')
          PY

          RECORDED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --arg recorded_at "${RECORDED_AT}" \
            --slurpfile runs /tmp/runs.json \
            --slurpfile jobs /tmp/jobs.json \
            --rawfile diagnostic /tmp/diagnostic.txt '
              ($runs[0].workflow_runs[0] // null) as $run |
              {
                recorded_at: $recorded_at,
                run: (if $run then {
                  id: $run.id,
                  status: $run.status,
                  conclusion: $run.conclusion,
                  head_sha: $run.head_sha,
                  created_at: $run.created_at,
                  updated_at: $run.updated_at,
                  html_url: $run.html_url
                } else null end),
                jobs: [($jobs[0].jobs // [])[] | {
                  id, name, status, conclusion,
                  steps: [.steps[]? | {name, status, conclusion, number}]
                }],
                sanitized_diagnostic: $diagnostic
              }
            ' > "${REPORT_PATH}"

      - name: Commit inspection report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${REPORT_PATH}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Social Factory 0.6 smoke update status [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
