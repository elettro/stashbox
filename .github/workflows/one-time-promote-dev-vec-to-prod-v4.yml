name: One-time promote DEV VEC to PROD v4

on:
  push:
    branches: [main]
    paths:
      - '.promote-dev-vec-v4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radio-vec-prod-promotion
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Run targeted VEC collision recovery
        id: repair
        continue-on-error: true
        run: node .github/scripts/promote-dev-vec-to-prod-v4.mjs
      - name: Preserve result report
        if: always()
        run: |
          test -f radio/docs/diagnostics/DEV_TO_PROD_VEC_PROMOTION_V4_LATEST.json
          cp radio/docs/diagnostics/DEV_TO_PROD_VEC_PROMOTION_V4_LATEST.json /tmp/vec-v4-report.json
      - name: Record recovery report
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p radio/docs/diagnostics
            cp /tmp/vec-v4-report.json radio/docs/diagnostics/DEV_TO_PROD_VEC_PROMOTION_V4_LATEST.json
            git add radio/docs/diagnostics/DEV_TO_PROD_VEC_PROMOTION_V4_LATEST.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Record DEV to PROD VEC promotion v4 [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Enforce recovery result
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/vec-v4-report.json','utf8'));
          console.log(JSON.stringify(r,null,2));
          if(!r.ok) process.exit(2);
          NODE
