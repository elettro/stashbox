name: SR-BUG-0027 Diagnostic

on:
  push:
    branches:
      - fix/canonical-vec-authoring-20260912

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run desktop canonical VEC regression test
        run: node --test radio-api/tests/vec-desktop-canonical-runtime.test.mjs
      - name: Inspect canonical SolarMeister VEC content
        env:
          API: https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2
          SONG_KEY: solarmeister-stashbox
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const api = process.env.API;
          const key = process.env.SONG_KEY;
          const report = { song_key: key, checked_at: new Date().toISOString() };
          const get = async path => {
            const res = await fetch(`${api}${path}`, { headers: { accept: 'application/json' } });
            const text = await res.text();
            let body = text;
            try { body = JSON.parse(text); } catch {}
            report[path] = { status: res.status, body };
            if (!res.ok) process.exitCode = 1;
            return body;
          };
          await get(`/radio/vec/recipe?song_key=${encodeURIComponent(key)}`);
          await get(`/radio/vec/song-assets?song_key=${encodeURIComponent(key)}`);
          const songs = await get('/radio/songs');
          const rows = Array.isArray(songs) ? songs : songs?.songs || songs?.items || songs?.data || [];
          report.matched_song = rows.find(x => String(x.song_key || x.songKey || x.id || '') === key) || null;
          fs.writeFileSync('sr-bug-0027-diagnostic.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sr-bug-0027-diagnostic
          path: sr-bug-0027-diagnostic.json
          if-no-files-found: warn