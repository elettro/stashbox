name: One-time profilequeue4 publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-profilequeue4-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bust playlist queue script cache
        run: |
          sed -i 's/profilequeue2/profilequeue4/g' radio/index.html radio/desktop/index.html radio/dev/v2/index.html radio/dev/v2/desktop/index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio/index.html radio/desktop/index.html radio/dev/v2/index.html radio/dev/v2/desktop/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish profile playlist queue v4'
            git push origin main
          fi
