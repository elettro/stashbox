name: One-time promote DEV artwork to PROD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-promote-dev-artwork-to-prod.yml'
      - '.github/scripts/promote-dev-artwork-to-prod.mjs'
      - '.promote-dev-artwork-to-prod'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-promote-dev-artwork-to-prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mark promotion run started
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p radio/docs/diagnostics
          printf 'started_utc=%s\nrun_id=%s\ncommit=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_ID" "$GITHUB_SHA" > radio/docs/diagnostics/DEV_TO_PROD_ARTWORK_PROMOTION_STARTED.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio/docs/diagnostics/DEV_TO_PROD_ARTWORK_PROMOTION_STARTED.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Mark DEV to PROD artwork promotion started [skip ci]'
            git push origin HEAD:main
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Promote missing songs and canonical artwork
        id: promote
        continue-on-error: true
        run: node .github/scripts/promote-dev-artwork-to-prod.mjs

      - name: Commit promotion report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f radio/docs/diagnostics/DEV_TO_PROD_ARTWORK_PROMOTION_LATEST.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radio/docs/diagnostics/DEV_TO_PROD_ARTWORK_PROMOTION_LATEST.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record DEV to PROD artwork promotion [skip ci]'
            git push origin HEAD:main
          fi

      - name: Enforce promotion result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f radio/docs/diagnostics/DEV_TO_PROD_ARTWORK_PROMOTION_LATEST.json
          jq -e '.ok == true' radio/docs/diagnostics/DEV_TO_PROD_ARTWORK_PROMOTION_LATEST.json >/dev/null
