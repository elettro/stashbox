name: Desktop V2 System Edge Probe

on:
  push:
    branches: [main]
    paths:
      - 'radio/dev/v2/desktop/**'
      - 'radio/dev/v2/index.html'
      - 'radio-api/scripts/probe-v2-desktop-edge-system.mjs'
      - '.github/workflows/desktop-v2-system-edge-probe.yml'
  workflow_dispatch:

concurrency:
  group: desktop-v2-system-edge-probe
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Microsoft Edge from official repository
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-edge.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y microsoft-edge-stable
      - name: Install Selenium
        run: npm install --no-save --no-package-lock selenium-webdriver@4.35.0
      - name: Show Edge version
        run: microsoft-edge-stable --version
      - name: Allow DEV static deployment to settle
        run: sleep 45
      - name: Probe official Edge desktop playback
        id: probe
        continue-on-error: true
        env:
          V2_URL: https://stashbox.com/radio/dev/v2/
          DESKTOP_HEALTH_SONG_TITLE: Freedom Street
          DESKTOP_HEALTH_TIMEOUT_MS: '60000'
          DESKTOP_EDGE_PROBE_OUTPUT: /tmp/desktop-v2-system-edge.json
        run: node radio-api/scripts/probe-v2-desktop-edge-system.mjs
      - name: Preserve official Edge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-v2-system-edge-${{ github.run_id }}
          path: /tmp/desktop-v2-system-edge.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish official Edge probe issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[Desktop V2 Probe] System Edge';
            let text = '';
            try { text = fs.readFileSync('/tmp/desktop-v2-system-edge.json', 'utf8'); } catch (_) { text = 'Probe did not produce JSON output.'; }
            if (text.length > 55000) text = text.slice(0, 55000) + '\n...truncated';
            const body = `Source commit: \`${context.sha}\`\n\n\`\`\`json\n${text}\n\`\`\``;
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
            const existing = found.data.items.find(item => item.title === title);
            if (existing) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
      - name: Fail when official Edge probe fails
        if: steps.probe.outcome == 'failure'
        run: exit 1
