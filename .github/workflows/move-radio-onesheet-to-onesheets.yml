name: Move Radio OneSheet Files

on:
  push:
    paths:
      - '.github/workflows/move-radio-onesheet-to-onesheets.yml'

permissions:
  contents: write

jobs:
  move-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move radio/onesheet contents into radio/onesheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p radio/onesheets
          if [ -d "radio/onesheet" ]; then
            find radio/onesheet -mindepth 1 -maxdepth 1 -exec mv -t radio/onesheets {} +
            rmdir radio/onesheet || true
          fi

      - name: Commit move
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "elettro"
          git config user.email "dpalermo@elettro.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Move radio one-sheet files into radio/onesheets"
          git pull --rebase origin main
          git push origin main
