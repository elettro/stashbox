name: Execute Social Factory YouTube Defaults Cleanly

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-execute-social-youtube-defaults-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract and run the already-tested patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/one-time-apply-social-youtube-defaults.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n          cd social-factory-api"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-social-youtube-defaults.py').write_text(code)
          PY
          python /tmp/apply-social-youtube-defaults.py

          cd social-factory-api
          npm install --omit=dev --no-audit --no-fund
          npm run check
          npm test

      - name: Commit and push the tested source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social-factory-api radio-admin/dev/social-factory
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Default Social Factory YouTube settings and playlist assignment'
          git pull --rebase origin main
          git push origin HEAD:main
