name: One-Time Repair Social Scheduled Infrastructure V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-repair-social-scheduled-infra-v2.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: repair-social-scheduled-infra-v2
  cancel-in-progress: false

jobs:
  repair-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      AWS_REGION: us-east-1
      STACK_NAME: stashbox-social-api-dev
      SERVICE_ROLE_NAME: stashbox-social-cloudformation-dev-role
      SERVICE_POLICY_NAME: StashboxSocialCloudFormationDev
      WORKER_LOG_GROUP: /aws/lambda/stashbox-social-publish-worker-dev
      DEPLOY_WORKFLOW: deploy-social-factory-api-dev.yml
      REPORT_PATH: deployment-reports/social-factory-scheduled-infra-repair.json

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Apply permanent source fixes
        run: |
          set -euo pipefail
          cat > /tmp/apply.py <<'PY'
          from pathlib import Path

          def replace_idempotent(path, old_lines, new_lines):
              file = Path(path)
              text = file.read_text()
              old = "\n".join(old_lines)
              new = "\n".join(new_lines)
              if new in text:
                  print(f"already fixed: {path}")
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1))
              print(f"fixed: {path}")

          deploy = ".github/workflows/deploy-social-factory-api-dev.yml"
          bootstrap = ".github/workflows/bootstrap-social-factory-cloudformation-role.yml"

          replace_idempotent(deploy, [
              "      EXPECTED_SCHEDULE_QUEUE_NAME: stashbox-social-publish-dev",
              "      EXPECTED_SCHEDULE_DLQ_NAME: stashbox-social-publish-dev-dlq",
          ], [
              "      EXPECTED_SCHEDULE_QUEUE_NAME: stashbox-social-publish-dev.fifo",
              "      EXPECTED_SCHEDULE_DLQ_NAME: stashbox-social-publish-dev-dlq.fifo",
          ])

          replace_idempotent(deploy, [
              "            --attribute-names QueueArn VisibilityTimeout RedrivePolicy SqsManagedSseEnabled)",
          ], [
              "            --attribute-names QueueArn VisibilityTimeout RedrivePolicy SqsManagedSseEnabled FifoQueue ContentBasedDeduplication)",
          ])

          replace_idempotent(deploy, [
              '              .Attributes.SqsManagedSseEnabled == "true" and',
              '              ((.Attributes.RedrivePolicy | fromjson).deadLetterTargetArn == $dlq) and',
          ], [
              '              .Attributes.SqsManagedSseEnabled == "true" and',
              '              .Attributes.FifoQueue == "true" and',
              '              .Attributes.ContentBasedDeduplication == "true" and',
              '              ((.Attributes.RedrivePolicy | fromjson).deadLetterTargetArn == $dlq) and',
          ])

          replace_idempotent(bootstrap, [
              '                "Resource": "arn:aws:logs:${AWS_REGION}:${ACCOUNT_ID}:log-group:/aws/lambda/stashbox-social-*:*"',
          ], [
              '                "Resource": [',
              '                  "arn:aws:logs:${AWS_REGION}:${ACCOUNT_ID}:log-group:/aws/lambda/stashbox-social-*",',
              '                  "arn:aws:logs:${AWS_REGION}:${ACCOUNT_ID}:log-group:/aws/lambda/stashbox-social-*:*"',
              '                ]',
          ])
          PY
          python -m py_compile /tmp/apply.py
          python /tmp/apply.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/deploy-social-factory-api-dev.yml \
            .github/workflows/bootstrap-social-factory-cloudformation-role.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Social Factory scheduled deployment contract [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Repair AWS resources and service role
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STACK_STATUS_BEFORE=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text)
          STACK_ROLE=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].RoleARN' --output text)
          EXPECTED_ROLE="arn:aws:iam::${ACCOUNT_ID}:role/${SERVICE_ROLE_NAME}"
          test "${STACK_ROLE}" = "${EXPECTED_ROLE}"

          STACK_OWNS_LOG_GROUP=$(aws cloudformation list-stack-resources \
            --stack-name "${STACK_NAME}" \
            --query "length(StackResourceSummaries[?PhysicalResourceId=='${WORKER_LOG_GROUP}'])" \
            --output text)
          test "${STACK_OWNS_LOG_GROUP}" = '0'

          ORPHAN_REMOVED=false
          LOG_GROUP=$(aws logs describe-log-groups \
            --log-group-name-prefix "${WORKER_LOG_GROUP}" \
            --query "logGroups[?logGroupName=='${WORKER_LOG_GROUP}'] | [0]" \
            --output json)
          if [ "${LOG_GROUP}" != 'null' ] && [ -n "${LOG_GROUP}" ]; then
            test "$(printf '%s' "${LOG_GROUP}" | jq -r '.storedBytes // 0')" = '0'
            test "$(aws logs describe-log-streams --log-group-name "${WORKER_LOG_GROUP}" --max-items 1 --query 'length(logStreams)' --output text)" = '0'
            aws logs delete-log-group --log-group-name "${WORKER_LOG_GROUP}"
            ORPHAN_REMOVED=true
          fi

          aws iam get-role-policy \
            --role-name "${SERVICE_ROLE_NAME}" \
            --policy-name "${SERVICE_POLICY_NAME}" \
            --query PolicyDocument --output json > /tmp/policy.json
          BASE_LOG_ARN="arn:aws:logs:${AWS_REGION}:${ACCOUNT_ID}:log-group:/aws/lambda/stashbox-social-*"
          STREAM_LOG_ARN="${BASE_LOG_ARN}:*"
          jq --arg base "${BASE_LOG_ARN}" --arg streams "${STREAM_LOG_ARN}" '
            (.Statement[] | select(.Sid == "ManageSocialFactoryLogs").Resource) = [$base, $streams]
          ' /tmp/policy.json > /tmp/policy-fixed.json
          aws iam put-role-policy \
            --role-name "${SERVICE_ROLE_NAME}" \
            --policy-name "${SERVICE_POLICY_NAME}" \
            --policy-document file:///tmp/policy-fixed.json

          jq -n \
            --arg stack_status_before "${STACK_STATUS_BEFORE}" \
            --arg stack_role "${STACK_ROLE}" \
            --argjson orphan_removed "${ORPHAN_REMOVED}" \
            '{stack_status_before:$stack_status_before,stack_role:$stack_role,orphan_log_group_removed:$orphan_removed,service_role_log_arns_fixed:true}' \
            > /tmp/repair.json

      - name: Dispatch full Social Factory DEV deployment
        run: |
          set +e
          DISPATCHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run "${DEPLOY_WORKFLOW}" --repo "${REPOSITORY}" --ref main
          RUN_ID=''
          for attempt in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --repo "${REPOSITORY}" \
              --workflow "${DEPLOY_WORKFLOW}" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,createdAt \
              --jq "map(select(.createdAt >= \"${DISPATCHED_AT}\"))[0].databaseId // empty")
            [ -n "${RUN_ID}" ] && break
            sleep 5
          done

          if [ -z "${RUN_ID}" ]; then
            CONCLUSION=dispatch_failed
            jq -n '{status:"completed",conclusion:"dispatch_failed",jobs:[]}' > /tmp/run.json
          else
            for attempt in $(seq 1 480); do
              STATUS=$(gh run view "${RUN_ID}" --repo "${REPOSITORY}" --json status --jq '.status')
              [ "${STATUS}" = completed ] && break
              sleep 10
            done
            gh run view "${RUN_ID}" --repo "${REPOSITORY}" --json databaseId,status,conclusion,createdAt,updatedAt,url,jobs > /tmp/run.json
            CONCLUSION=$(jq -r '.conclusion // "unknown"' /tmp/run.json)
            if [ "${CONCLUSION}" != success ]; then
              gh run view "${RUN_ID}" --repo "${REPOSITORY}" --log-failed > /tmp/failed.log 2>/dev/null || true
            fi
          fi
          echo "${CONCLUSION}" > /tmp/conclusion
          exit 0

      - name: Record result
        if: always()
        run: |
          set -euo pipefail
          CONCLUSION=$(cat /tmp/conclusion 2>/dev/null || echo unknown)
          STACK_STATUS_AFTER=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)
          FAILURE=$(tail -n 100 /tmp/failed.log 2>/dev/null | tail -c 10000 || true)
          jq -n \
            --arg recorded_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg conclusion "${CONCLUSION}" \
            --arg stack_status_after "${STACK_STATUS_AFTER}" \
            --arg failure "${FAILURE}" \
            --slurpfile repair /tmp/repair.json \
            --slurpfile run /tmp/run.json '
            {
              status:(if $conclusion == "success" then "success" else "failure" end),
              recorded_at:$recorded_at,
              source_contract_fixed:true,
              repair:$repair[0],
              deployment:{conclusion:$conclusion,run_id:($run[0].databaseId // null),url:($run[0].url // null),stack_status_after:$stack_status_after,steps:([$run[0].jobs[]?.steps[]? | {name,conclusion,status}]),failure_summary:$failure},
              production_changed:false
            }' > "${REPORT_PATH}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${REPORT_PATH}"
          git commit -m 'Record Social Factory scheduled infrastructure repair [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Require success
        run: test "$(cat /tmp/conclusion)" = success

