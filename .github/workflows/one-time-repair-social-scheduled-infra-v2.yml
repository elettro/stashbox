name: One-Time Repair Social Scheduled Infrastructure V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-repair-social-scheduled-infra-v2.yml'
      - 'scripts/repair-social-scheduled-infra.sh'
      - 'social-factory-api/infrastructure/template.yaml'
      - 'social-factory-api/schedule-publish.mjs'

permissions:
  contents: write

concurrency:
  group: repair-social-scheduled-infra-v2
  cancel-in-progress: false

jobs:
  repair-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      AWS_REGION: us-east-1
      STACK_NAME: stashbox-social-api-dev
      SERVICE_ROLE_NAME: stashbox-social-cloudformation-dev-role
      SERVICE_POLICY_NAME: StashboxSocialCloudFormationDev
      WORKER_LOG_GROUP: /aws/lambda/stashbox-social-publish-worker-dev
      REPORT_PATH: deployment-reports/social-factory-scheduled-infra-repair.json

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          show-progress: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Repair scheduled infrastructure and deploy DEV
        run: bash scripts/repair-social-scheduled-infra.sh
