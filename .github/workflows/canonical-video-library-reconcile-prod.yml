name: Canonical Video Library Reconcile PROD

on:
  push:
    branches: [feature/canonical-video-library-1077]
    paths:
      - '.github/workflows/canonical-video-library-reconcile-prod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      PROD_FUNCTION: stashbox-radio-api-prod-v2
      PROD_API: https://je3zud66nb.execute-api.us-east-1.amazonaws.com/prod-v2
      PROD_CDN: d34ez960394y8w.cloudfront.net
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Snapshot, reconcile skate assets, verify
        shell: bash
        run: |
          set -euo pipefail
          aws lambda get-function-configuration --function-name "$PROD_FUNCTION" --region "$AWS_REGION" > /tmp/prod.json
          PROD_TOKEN="$(jq -r '.Environment.Variables.ADMIN_TOKEN // .Environment.Variables.RADIO_ADMIN_TOKEN // empty' /tmp/prod.json)"
          test -n "$PROD_TOKEN"; export PROD_TOKEN
          node <<'NODE'
          (async()=>{
            const fs=require('fs');const API=process.env.PROD_API,token=process.env.PROD_TOKEN,cdn=process.env.PROD_CDN;
            function unwrap(v){for(let i=0;i<3;i++){if(v&&typeof v==='object'&&typeof v.body==='string'){try{v=JSON.parse(v.body);continue}catch{}}break}return v}
            async function req(path,opt={}){const m=String(opt.method||'GET').toUpperCase();const r=await fetch(API+path,{...opt,method:m,headers:{'x-admin-token':token,accept:'application/json',...(opt.body?{'content-type':'application/json'}:{}),...(opt.headers||{})},cache:m==='GET'?'no-store':undefined});const t=await r.text();let b;try{b=unwrap(t?JSON.parse(t):{})}catch{b=t}if(!r.ok||b?.success===false)throw new Error(`${m} ${path} -> ${r.status} ${typeof b==='string'?b:JSON.stringify(b)}`);return b}
            const rows=(b,ks)=>{if(Array.isArray(b))return b;for(const k of ks)if(Array.isArray(b?.[k]))return b[k];return[]};const slug=f=>String(f.folder_slug||f.slug||'').toLowerCase(),id=f=>String(f.id||f.folder_id||'');
            const folders=rows(await req('/admin/visuals/folders'),['folders','items','rows','data']);const source=folders.find(f=>slug(f)==='dean-skateboarding'),target=folders.find(f=>slug(f)==='dean-skateboarding-boardwalk-beach');if(!source||!target)throw new Error('Expected legacy and canonical PROD skate folders not found');
            const sourceAssets=rows(await req(`/admin/visuals/folders/${encodeURIComponent(id(source))}/assets`),['assets','items','rows','data']);const targetBefore=rows(await req(`/admin/visuals/folders/${encodeURIComponent(id(target))}/assets`),['assets','items','rows','data']);
            fs.writeFileSync('prod-visual-library-skate-precanonical.json',JSON.stringify({capturedAt:new Date().toISOString(),sourceFolder:source,targetFolder:target,sourceAssets,targetBefore},null,2)+'\n');
            const publicUrl=a=>String(a.public_url||a.url||'').trim();const identity=a=>publicUrl(a)||String(a.s3_key||a.key||a.id||'');
            const deriveKey=a=>{const direct=String(a.s3_key||a.key||'').trim();if(direct)return direct;const u=publicUrl(a);if(!u)throw new Error(`Asset ${a.id||''} has neither s3_key nor public_url`);const parsed=new URL(u);if(parsed.hostname.toLowerCase()!==cdn)throw new Error(`Refusing to derive key from non-PROD CDN host ${parsed.hostname}`);const key=decodeURIComponent(parsed.pathname.replace(/^\/+/,''));if(!key)throw new Error(`Could not derive key for ${u}`);return key};
            const existing=new Set(targetBefore.map(identity));let created=0;
            for(const asset of sourceAssets){if(existing.has(identity(asset)))continue;const u=publicUrl(asset);if(!u)throw new Error(`Legacy asset ${asset.id||''} missing public_url`);if(new URL(u).hostname.toLowerCase()!==cdn)throw new Error(`Legacy asset outside PROD CDN: ${u}`);const payload={asset_type:asset.asset_type||asset.type||'image',file_name:asset.file_name||asset.filename||asset.name||'visual-asset',s3_key:deriveKey(asset),public_url:u,thumbnail_url:asset.thumbnail_url||u,content_type:asset.content_type||asset.mime_type||'',size_bytes:asset.size_bytes??null,width:asset.width??null,height:asset.height??null,ratio_label:asset.ratio_label||'',caption:asset.caption||'',alt_text:asset.alt_text||'',notes:asset.notes||'',shopify_product_urls:Array.isArray(asset.shopify_product_urls)?asset.shopify_product_urls:[]};await req(`/admin/visuals/folders/${encodeURIComponent(id(target))}/assets`,{method:'POST',body:JSON.stringify(payload)});existing.add(identity(asset));created++;}
            const targetAfter=rows(await req(`/admin/visuals/folders/${encodeURIComponent(id(target))}/assets`),['assets','items','rows','data']);const sourceAfter=rows(await req(`/admin/visuals/folders/${encodeURIComponent(id(source))}/assets`),['assets','items','rows','data']);const afterSet=new Set(targetAfter.map(identity));const missing=sourceAfter.map(identity).filter(x=>x&&!afterSet.has(x));if(missing.length)throw new Error(`Canonical skate folder still missing ${missing.length} legacy assets`);if(sourceAfter.length!==sourceAssets.length)throw new Error('Legacy source folder changed');
            const publicResp=await fetch(`${API}/radio/visuals/folders/${encodeURIComponent(id(target))}/assets`,{headers:{accept:'application/json','cache-control':'no-cache'},cache:'no-store'});if(!publicResp.ok)throw new Error(`Public canonical assets returned ${publicResp.status}`);const publicRows=rows(unwrap(await publicResp.json()),['assets','items','rows','data']);const publicSet=new Set(publicRows.map(identity));const publicMissing=sourceAfter.map(identity).filter(x=>x&&!publicSet.has(x));if(publicMissing.length)throw new Error(`Public canonical skate folder missing ${publicMissing.length} assets`);
            const result={success:true,sourceFolder:{id:id(source),slug:slug(source),assetCount:sourceAfter.length},canonicalFolder:{id:id(target),slug:slug(target),before:targetBefore.length,after:targetAfter.length},created,publicAssetCount:publicRows.length,verifiedAt:new Date().toISOString()};fs.writeFileSync('prod-visual-library-reconcile-result.json',JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result,null,2));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          jq -e '.success==true' prod-visual-library-reconcile-result.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-video-library-prod-reconcile
          path: |
            prod-visual-library-skate-precanonical.json
            prod-visual-library-reconcile-result.json
          if-no-files-found: warn
