<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Stashbox Radio VEC 2.0 Lab</title>
  <link rel="stylesheet" href="/radio/vec2/vec2-stage.css?v=20260817-lab1">
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#050607;color:#fff;font-family:Arial,Helvetica,sans-serif}.lab{max-width:1500px;margin:0 auto;padding:20px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.top h1{font-size:22px;margin:0 18px 0 0}.top select,.top button{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #3b4148;background:#11151a;color:#fff}.top button{cursor:pointer}.top button:hover{background:#1b2229}.stage-shell{position:relative;aspect-ratio:16/9;min-height:360px;max-height:76vh;background:#050607;border:1px solid #30363d;border-radius:14px;overflow:hidden}.vec2-stage{z-index:0!important}.hud{position:absolute;z-index:20;left:14px;right:14px;bottom:14px;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(5,6,7,.72);backdrop-filter:blur(10px)}.hud audio{width:min(620px,60vw)}.status{margin-left:auto;font-size:12px;font-weight:700}.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}.card{padding:10px 12px;background:#0d1117;border:1px solid #272d33;border-radius:10px}.card b{display:block;font-size:11px;color:#a8b0b8;text-transform:uppercase;margin-bottom:4px}.card span{font-size:13px;word-break:break-word}.log{margin-top:12px;height:180px;overflow:auto;background:#090c10;border:1px solid #272d33;border-radius:10px;padding:10px;font:12px/1.45 Consolas,monospace;white-space:pre-wrap}.note{font-size:12px;color:#a8b0b8;margin:8px 0 0}@media(max-width:800px){.meta{grid-template-columns:1fr 1fr}.stage-shell{min-height:260px}.hud{flex-wrap:wrap}.hud audio{width:100%}}
  </style>
</head>
<body>
  <main class="lab">
    <div class="top">
      <h1>VEC 2.0 Lab</h1>
      <select id="songSelect"><option>Loading songs…</option></select>
      <button id="loadBtn" type="button">Load Song</button>
      <button id="nextBtn" type="button">Next Song</button>
    </div>
    <section id="stageHost" class="stage-shell">
      <div class="hud">
        <audio id="audio" controls preload="metadata"></audio>
        <span id="status" class="status">BOOTING</span>
      </div>
    </section>
    <div class="meta">
      <div class="card"><b>Song</b><span id="songMeta">—</span></div>
      <div class="card"><b>Artwork Intro</b><span id="introMeta">—</span></div>
      <div class="card"><b>Assets</b><span id="assetMeta">—</span></div>
      <div class="card"><b>Engine State</b><span id="stateMeta">—</span></div>
    </div>
    <div id="log" class="log">Starting VEC 2.0 lab…</div>
    <p class="note">This page is isolated from the normal Stashbox Radio player. It uses the real DEV song/VEC APIs but no legacy VEC playback scripts.</p>
  </main>
  <script src="/radio/vec2/vec2-controller.js?v=20260817-lab1"></script>
  <script src="/radio/vec2-lab/lab.js?v=20260817-lab1"></script>
</body>
</html>
