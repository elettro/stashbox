openapi: 3.1.0
info:
  title: Stashbox Radio Social Factory API
  version: 0.9.2
  description: Controlled DEV actions for Stashbox Radio campaign planning, Video Factory orchestration, Content Review, scheduling, and YouTube operations.
servers:
  - url: https://tnrca1ff32.execute-api.us-east-1.amazonaws.com/dev
security:
  - AdminToken: []
paths:
  /social/health:
    get:
      operationId: getSocialFactoryHealth
      summary: Check the Social Factory service and supported capabilities.
      security: []
      responses:
        '200': {description: Service health, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/youtube/status:
    get:
      operationId: getYouTubeConnectionStatus
      summary: Check whether the Stashbox YouTube account is connected and usable.
      responses:
        '200': {description: YouTube status, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/analytics/top-songs:
    get:
      operationId: getTopSongAnalytics
      summary: Rank Stashbox songs by an all-time engagement metric using live Radio dashboard totals.
      description: Read-only song analytics. This operation never creates drafts, renders, schedules, uploads, or publications.
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum: [plays, full_plays, likes, shares, share_visits, video_clicks, product_clicks, listening_seconds]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 25
            default: 5
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [all_time]
            default: all_time
        - name: artist
          in: query
          required: false
          schema:
            type: string
        - name: genre
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Ranked songs with exact metric totals.
          content:
            application/json:
              schema:
                type: object
                required: [ok, mode, metric, period, count, songs, mutation_performed, publishing_triggered]
                properties:
                  ok:
                    type: boolean
                  mode:
                    type: string
                    enum: [read_only_analytics]
                  metric:
                    type: string
                    enum: [plays, full_plays, likes, shares, share_visits, video_clicks, product_clicks, listening_seconds]
                  period:
                    type: string
                    enum: [all_time]
                  artist_filter:
                    type: string
                  genre_filter:
                    type: string
                  count:
                    type: integer
                  songs:
                    type: array
                    items:
                      type: object
                      required: [rank, song_key, title, metric_total]
                      properties:
                        rank:
                          type: integer
                        song_key:
                          type: string
                        title:
                          type: string
                        artist:
                          type: string
                        genre:
                          type: string
                        metric_total:
                          type: number
                        metrics:
                          type: object
                          properties:
                            plays: {type: number}
                            full_plays: {type: number}
                            likes: {type: number}
                            shares: {type: number}
                            share_visits: {type: number}
                            video_clicks: {type: number}
                            product_clicks: {type: number}
                            listening_seconds: {type: number}
                  campaign_song_keys:
                    type: array
                    items:
                      type: string
                  mutation_performed:
                    type: boolean
                  publishing_triggered:
                    type: boolean
                  generated_at:
                    type: string
                    format: date-time
  /social/orchestration/candidates:
    get:
      operationId: listSocialCampaignCandidates
      summary: List eligible songs including normalized date fields used for newest-song selection.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 50
      responses:
        '200':
          description: Candidate songs with readiness, featured state, and normalized dates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  evaluated_count: {type: integer}
                  eligible_count: {type: integer}
                  candidates:
                    type: array
                    items: {$ref: '#/components/schemas/CampaignCandidate'}
                additionalProperties: true
  /social/orchestration/batch-plan:
    post:
      operationId: planSocialRenderBatch
      summary: Create a validation-only campaign proposal without creating render jobs.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchPlanRequest'}
      responses:
        '200': {description: Campaign proposal, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/orchestration/batch-drafts:
    post:
      operationId: createSocialRenderDrafts
      summary: Validate or create and launch all jobs in an approved campaign definition.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchPlanRequest'}
      responses:
        '200': {description: Validation result, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
        '201': {description: Jobs created and launched, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/orchestration/render-jobs:
    get:
      operationId: listSocialRenderJobs
      summary: List Video Factory render jobs and current status.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 50
      responses:
        '200': {description: Render jobs, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
    post:
      operationId: createSingleSocialRenderDraft
      summary: Create one Video Factory render draft.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenderDraftRequest'}
      responses:
        '201': {description: Draft created, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/orchestration/render-jobs/{jobId}:
    get:
      operationId: getSocialRenderJob
      summary: Inspect one render job.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200': {description: Render job, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/orchestration/render-jobs/{jobId}/launch:
    post:
      operationId: validateOrLaunchSocialRender
      summary: Validate or launch one render.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm_render: {type: boolean, default: false}
      responses:
        '200': {description: Launch result, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/orchestration/render-jobs/{jobId}/stage:
    post:
      operationId: stageCompletedRenderForReview
      summary: Stage one completed render into Content Review.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200': {description: Staging result, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/orchestration/batch-jobs:
    get:
      operationId: inspectSocialRenderBatch
      summary: Inspect a selected render batch.
      parameters:
        - name: job_ids
          in: query
          required: true
          schema: {type: string}
      responses:
        '200': {description: Batch status, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/orchestration/batch-launch:
    post:
      operationId: validateOrLaunchSocialRenderBatch
      summary: Validate or launch all approved jobs in one batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_ids]
              properties:
                job_ids:
                  type: array
                  minItems: 1
                  items: {type: string}
                confirm_render: {type: boolean, default: false}
      responses:
        '200': {description: Batch launch result, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/orchestration/batch-stage:
    post:
      operationId: stageCompletedRenderBatchForReview
      summary: Stage completed jobs into Content Review as a batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_ids]
              properties:
                job_ids:
                  type: array
                  minItems: 1
                  items: {type: string}
      responses:
        '200': {description: Batch staging result, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/review-items/batch-schedule:
    post:
      operationId: validateOrScheduleSocialContentBatch
      summary: Validate or schedule multiple approved Content Review items with one confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: object
                    required: [review_id, scheduled_at]
                    properties:
                      review_id: {type: string}
                      scheduled_at: {type: string, format: date-time}
                timezone:
                  type: string
                  default: America/New_York
                confirm_batch_schedule:
                  type: boolean
                  default: false
                  description: Omit or set false for validation. Set true only after one explicit user confirmation of the complete schedule.
      responses:
        '200':
          description: Batch validation or saved schedule results for every review item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericResponse'
  /social/review-items:
    get:
      operationId: listSocialContentReviewItems
      summary: List Content Review items.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 50
      responses:
        '200': {description: Review items, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/review-items/{reviewId}:
    get:
      operationId: getSocialContentReviewItem
      summary: Inspect one Content Review item.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200': {description: Review item, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/review-items/{reviewId}/preview:
    post:
      operationId: createSocialContentPreview
      summary: Create a secure read-only reviewer link.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200': {description: Secure reviewer URL, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/review-items/{reviewId}/save:
    post:
      operationId: saveSocialContentReviewEdits
      summary: Save review metadata without approving or publishing.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                selected_title:
                  type: string
                selected_description:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                visibility:
                  type: string
                  enum: [public, unlisted, private]
                playlist_titles:
                  type: array
                  items:
                    type: string
                scheduled_at:
                  type: [string, 'null']
                  format: date-time
                timezone:
                  type: string
                note:
                  type: string
              additionalProperties: false
      responses:
        '200': {description: Saved review item, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/review-items/{reviewId}/decision:
    post:
      operationId: setSocialContentReviewDecision
      summary: Approve, hold, or reject a review item.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approve, hold, reject]}
                note: {type: string}
      responses:
        '200': {description: Decision result, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/review-items/{reviewId}/publish:
    post:
      operationId: validateOrPublishSocialContent
      summary: Validate or publish a review item.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm_upload: {type: boolean, default: false}
      responses:
        '200': {description: Publish result, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/review-items/{reviewId}/schedule:
    post:
      operationId: validateOrScheduleSocialContent
      summary: Validate or schedule publication.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_at]
              properties:
                scheduled_at: {type: string, format: date-time}
                timezone: {type: string, default: America/New_York}
                confirm_schedule: {type: boolean, default: false}
      responses:
        '200': {description: Schedule result, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
  /social/review-items/{reviewId}/schedule/cancel:
    post:
      operationId: cancelScheduledSocialContent
      summary: Cancel a scheduled publication.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200': {description: Cancellation result, content: {application/json: {schema: {$ref: '#/components/schemas/GenericResponse'}}}}
components:
  securitySchemes:
    AdminToken:
      type: apiKey
      in: header
      name: x-admin-token
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 250, default: 50}
    JobId:
      name: jobId
      in: path
      required: true
      schema: {type: string}
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: {type: string}
  schemas:
    CampaignCandidate:
      type: object
      properties:
        song_key: {type: string}
        title: {type: string}
        artist: {type: string}
        album_name: {type: string}
        genre: {type: string}
        public_visibility: {type: string}
        featured: {type: boolean}
        audio_ready: {type: boolean}
        artwork_ready: {type: boolean}
        visual_readiness: {type: string}
        eligible: {type: boolean}
        candidate_score: {type: number}
        release_date: {type: [string, 'null'], format: date-time}
        published_at: {type: [string, 'null'], format: date-time}
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
        selection_date: {type: [string, 'null'], format: date-time}
        selection_date_source:
          type: [string, 'null']
          enum: [release_date, published_at, created_at, updated_at, null]
        reasons:
          type: array
          items: {type: string}
      additionalProperties: true
    BatchPlanRequest:
      type: object
      properties:
        campaign_name: {type: string}
        selected_song_keys:
          type: array
          maxItems: 10
          items: {type: string}
        song_count: {type: integer, minimum: 1, maximum: 10, default: 3}
        variations_per_song: {type: integer, minimum: 1, maximum: 4, default: 1}
        selection_mode:
          type: string
          enum: [ranked, newest]
          default: ranked
          description: Use newest to sort eligible songs by backend selection_date descending. Never infer newest from score or list order.
        genre: {type: string}
        artist: {type: string}
        featured_only: {type: boolean, default: false}
        require_visuals: {type: boolean, default: true}
        proposal_attempt: {type: integer, minimum: 0, maximum: 1000, default: 0}
        duration_mode: {type: string, enum: [full, promo, custom], default: promo}
        duration_seconds: {type: integer, minimum: 1, maximum: 600, default: 30}
        aspect_ratio: {type: string, enum: ['9:16', '16:9'], default: '9:16'}
        fps: {type: integer, minimum: 24, maximum: 60, default: 30}
        intro_enabled: {type: boolean, default: false}
        outro_enabled: {type: boolean, default: false}
        corner_bug_enabled: {type: boolean, default: false}
        include_artist: {type: boolean, default: false}
        include_song: {type: boolean, default: false}
        include_album: {type: boolean, default: false}
        confirm_create_drafts:
          type: boolean
          default: false
          description: Keep false or omit for proposal-only validation. Set true only after immediate approval of the final proposal.
      additionalProperties: false
    RenderDraftRequest:
      type: object
      required: [song_key]
      properties:
        song_key: {type: string}
        campaign_name: {type: string}
        aspect_ratio: {type: string, enum: ['9:16', '16:9', '1:1', '4:5'], default: '9:16'}
        duration_mode: {type: string, enum: [full, promo, custom], default: promo}
        duration_seconds: {type: integer, minimum: 1, maximum: 600, default: 30}
        fps: {type: integer, enum: [24, 25, 30, 60], default: 30}
        intro_enabled: {type: boolean, default: false}
        outro_enabled: {type: boolean, default: false}
        corner_bug_enabled: {type: boolean, default: false}
        include_artist: {type: boolean, default: false}
        include_song: {type: boolean, default: false}
        include_album: {type: boolean, default: false}
      additionalProperties: true
    GenericResponse:
      type: object
      properties:
        ok: {type: boolean}
        error: {type: string}
        details: {type: object, additionalProperties: true}
      additionalProperties: true